name: Build OmegaStream APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/omegastream/app
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Download app icon
          curl -sL "https://raw.githubusercontent.com/nicetech-creator/omegastream/main/icon.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || python3 -c "
          import base64, struct, zlib
          w=h=192; raw=b''
          for y in range(h):
              raw += b'\\x00'
              for x in range(w):
                  cx,cy=w//2,h//2; dx,dy=x-cx,y-cy; d=(dx*dx+dy*dy)**0.5
                  if d<80: raw+=bytes([0,220,130,255])
                  elif d<90: raw+=bytes([0,180,100,255])
                  else: raw+=bytes([0,0,0,255])
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          ihdr=struct.pack('>IIBBBBB',w,h,8,6,0,0,0)
          png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',ihdr)+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          open('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png','wb').write(png)
          "

          # settings.gradle
          cat > settings.gradle << 'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OmegaStream"
          include ':app'
          GRADLE

          # build.gradle
          cat > build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          GRADLE

          # gradle.properties
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          PROPS

          # app/build.gradle
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.omegastream.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.omegastream.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          GRADLE

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:label="OmegaStream"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="fullUser">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # MainActivity.java
          cat > app/src/main/java/com/omegastream/app/MainActivity.java << 'JAVA'
          package com.omegastream.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private long backPressTime = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          String url = req.getUrl().toString();
                          if (url.contains("onrender.com") || url.contains("s-u.in")
                              || url.contains("workers.dev") || url.contains("zflixtv.com"))
                              return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setDownloadListener((url, ua, disp, mime, sz) -> {
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          String name = URLUtil.guessFileName(url, disp, mime);
                          r.setTitle(name);
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                          r.setMimeType(mime);
                          r.addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url));
                          ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(r);
                          Toast.makeText(this, "Downloading " + name, Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Download failed", Toast.LENGTH_SHORT).show();
                      }
                  });

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl("https://omegastream.onrender.com");
              }

              @Override
              public boolean onKeyDown(int code, KeyEvent e) {
                  if (code == KeyEvent.KEYCODE_BACK && webView.canGoBack()) { webView.goBack(); return true; }
                  if (code == KeyEvent.KEYCODE_BACK) {
                      if (System.currentTimeMillis() - backPressTime < 2000) finish();
                      else { backPressTime = System.currentTimeMillis(); Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show(); }
                      return true;
                  }
                  return super.onKeyDown(code, e);
              }

              @Override protected void onSaveInstanceState(Bundle b) { super.onSaveInstanceState(b); webView.saveState(b); }
              @Override protected void onPause() { super.onPause(); webView.onPause(); }
              @Override protected void onResume() { super.onResume(); webView.onResume(); }
              @Override protected void onDestroy() { if (webView != null) webView.destroy(); super.onDestroy(); }
          }
          JAVA

      - name: Build APK
        run: |
          chmod +x gradlew || echo "Generating gradle wrapper"
          gradle wrapper --gradle-version 8.3 || true
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmegaStream-APK
          path: app/build/outputs/apk/debug/app-debug.apk
