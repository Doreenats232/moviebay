<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>OmegaStream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100svh;
    }

    /* ===== STATUS BAR ===== */
    #statusBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      background: rgba(0, 220, 130, 0.95);
      color: #000;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 8px 16px;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    #statusBar.show { transform: translateY(0); }
    #statusBar.error { background: rgba(220, 50, 50, 0.95); color: #fff; }

    /* ===== LOADING OVERLAY ===== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loadingOverlay.hidden { display: none; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #00DC82;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay p { color: rgba(255,255,255,0.5); font-size: 14px; }

    /* ===== HEADER ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      font-size: 22px;
      font-weight: 800;
      color: #00DC82;
      letter-spacing: -0.5px;
    }
    .header-logo span { color: #fff; }
    .search-btn {
      margin-left: auto;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== SEARCH BAR ===== */
    #searchBar {
      display: none;
      padding: 0 16px 12px;
      background: rgba(0,0,0,0.92);
    }
    #searchBar.active { display: block; }
    #searchInput {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    #searchInput::placeholder { color: rgba(255,255,255,0.35); }
    #searchInput:focus { border-color: #00DC82; }

    /* ===== CATEGORY TABS ===== */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0;
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-tab.active {
      background: #00DC82;
      color: #000;
    }

    /* ===== CONTENT SECTIONS ===== */
    .section {
      padding: 8px 0 16px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      padding: 8px 16px;
      color: #fff;
    }

    /* ===== POSTER GRID (horizontal scroll) ===== */
    .poster-scroll {
      display: flex;
      gap: 12px;
      padding: 8px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .poster-scroll::-webkit-scrollbar { display: none; }

    /* ===== POSTER GRID (vertical grid) ===== */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 8px 16px;
    }

    .poster-card {
      flex-shrink: 0;
      width: 130px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .poster-grid .poster-card {
      width: 100%;
    }
    .poster-card:active { transform: scale(0.96); }
    .poster-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 0.675;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }
    .poster-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .poster-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,220,130,0.9);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .poster-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .poster-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== ERROR STATE ===== */

      text-align: center;
      padding: 40px 20px;
    }

    }
    .retry-btn {
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      background: #00DC82;
      color: #000;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== DETAIL PAGE ===== */

      display: none;

      min-height: 100svh;
    }

      height: 420px;

    }
    .detail-hero img {

    .detail-hero-gradient {

      bottom: 0;
      left: 0;
      right: 0;

    .detail-back {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .detail-info {
      padding: 0 20px 24px;
      margin-top: -60px;
      position: relative;
      z-index: 5;
    }
    .detail-logo {
      max-height: 72px;
      max-width: 60%;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .detail-title {

    }
    .detail-meta {

    .detail-meta .badge {

      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;

      color: #000;

      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
    }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .detail-tag {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.7);
    }
    .detail-desc {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.75);
      margin-bottom: 20px;
    }
    .play-btn {
      width: 100%;
      max-width: 400px;
      height: 52px;
      border: none;
      border-radius: 26px;
      background: #00DC82;
      color: #000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

    /* ===== STREAM SELECTOR ===== */
    .stream-selector {
      margin-top: 16px;
    }
    .stream-selector-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .stream-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;

    .stream-option:active { background: rgba(255,255,255,0.12); }
    .stream-option.active {
      background: rgba(0,220,130,0.15);
      border: 1px solid rgba(0,220,130,0.3);
    }
    .stream-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .stream-info { flex: 1; }
    .stream-name {
      font-size: 14px;
      font-weight: 600;
    }
    .stream-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ===== EPISODE LIST ===== */
    .episode-list {
      margin-top: 16px;
    }
    .episode-list-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .season-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 12px;
    }
    .season-tabs::-webkit-scrollbar { display: none; }
    .season-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .season-tab.active {
      background: #00DC82;
      color: #000;
    }
    .episode-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 6px;
      cursor: pointer;
    }
    .episode-item:active { background: rgba(255,255,255,0.1); }
    .episode-item.playing {
      background: rgba(0,220,130,0.15);
    }
    .ep-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .ep-info { flex: 1; }
    .ep-name {
      font-size: 13px;
      font-weight: 600;
    }
    .ep-date {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }

    /* ===== VIDEO PLAYER PAGE ===== */
    #playerPage {
      display: none;
      min-height: 100vh;
      min-height: 100svh;
      background: #000;
    }
    .player-container {
      width: 100%;
      background: #000;
    }
    .player-container video {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      display: block;
    }
    .player-controls {
      padding: 16px;
    }
    .player-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .player-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
    }
    .player-nav {
      display: flex;
      gap: 12px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .nav-btn.primary {
      background: #00DC82;
      color: #000;
    }
    .player-back {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skeleton-poster {
      width: 130px;
      height: 190px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    /* ===== UTILITY ===== */
    .hidden { display: none !important; }
    .home-content { padding-bottom: 80px; }
  </style>
</head>
<body>

  <!-- STATUS BAR -->
  <div id="statusBar"></div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Loading OmegaStream...</p>

  <!-- ============ HOME PAGE ============ -->
  <div id="homePage">
    <div class="header">

          <button id="nextEpBtn" class="nav-btn primary" onclick="playNextEpisode()">Next →</button>

      </div>

<script>
// ===================================================================
// CONFIGURATION
// ===================================================================
var WORKER_BASE = 'https://moviebay-proxy.milesdaglas.workers.dev';
var PROXY_URL = WORKER_BASE + '?url=';
var VIDEO_PROXY = WORKER_BASE + '/video?url=';
var API_BASE = 'https://s-u.in';

var CATALOGS = [
  { id: 'moviebay-trending-movies', name: 'Trending Movies', type: 'movie' },
  { id: 'moviebay-latest-movies', name: 'Latest Movies', type: 'movie' },
  { id: 'moviebay-popular-movies', name: 'Popular Movies', type: 'movie' },
  { id: 'moviebay-vj-movies', name: 'VJ Movies', type: 'movie' },
  { id: 'moviebay-trending-series', name: 'Trending Series', type: 'series' },
  { id: 'moviebay-latest-series', name: 'Latest Series', type: 'series' },
  { id: 'moviebay-popular-series', name: 'Popular Series', type: 'series' },
  { id: 'moviebay-vj-series', name: 'VJ Series', type: 'series' },
  { id: 'moviebay-all-movies', name: 'All Movies', type: 'movie' },
  { id: 'moviebay-all-series', name: 'All Series', type: 'series' }
];

// ===================================================================
// CACHE LAYER
// ===================================================================
var memoryCache = {};

function cacheGet(key) {
  if (memoryCache[key] && memoryCache[key].expiry > Date.now()) {
    return memoryCache[key].data;
  }
  try {
    var stored = localStorage.getItem('os_cache_' + key);
    if (stored) {
      var parsed = JSON.parse(stored);
      if (parsed && parsed.expiry > Date.now()) {
        memoryCache[key] = parsed;
        return parsed.data;
      }
    }
  } catch(e) {}
  return null;
}

function cacheSet(key, data, ttlMs) {
  var entry = { data: data, expiry: Date.now() + (ttlMs || 300000) };
  memoryCache[key] = entry;
  try {
    localStorage.setItem('os_cache_' + key, JSON.stringify(entry));
  } catch(e) {}
}

// ===================================================================
// FETCH WITH RETRY + RATE LIMIT HANDLING
// ===================================================================
function fetchJson(url, retries) {
  retries = retries || 3;
  return new Promise(function(resolve, reject) {
    var cached = cacheGet(url);
    if (cached) {
      resolve(cached);
      return;
    }

    function attempt(remaining, delay) {
      setTimeout(function() {
        fetch(url)
          .then(function(resp) {
            if (resp.status === 429) {
              if (remaining > 0) {
                var wait = delay * 2;
                showStatus('Rate limited - retrying in ' + Math.round(wait/1000) + 's...');
                attempt(remaining - 1, wait);
              } else {
                reject(new Error('Rate limited - try again in a minute'));
              }
              return;
            }
            if (!resp.ok) {
              if (remaining > 0) {
                attempt(remaining - 1, delay * 2);
              } else {
                reject(new Error('HTTP ' + resp.status));
              }
              return;
            }
            return resp.json();
          })
          .then(function(data) {
            if (data) {
              cacheSet(url, data, 300000);
              resolve(data);
            }
          })
          .catch(function(err) {
            if (remaining > 0) {
              attempt(remaining - 1, delay * 2);
            } else {
              reject(err);
            }
          });
      }, delay);
    }

    attempt(retries, 1000);
  });
}

// ===================================================================
// STREAM URL RESOLVER - THE KEY FIX
// ===================================================================
function resolveStreamUrl(rawUrl) {
  if (!rawUrl) return rawUrl;

  // HLS streams: play directly (native on mobile)
  if (rawUrl.includes('/stream/hls/') || rawUrl.includes('.m3u8')) {
    return rawUrl;
  }

  // Direct CDN MP4: play directly
  if (rawUrl.includes('cdn.zflixtv.com') || (rawUrl.includes('.mp4') && !rawUrl.includes('s-u.in'))) {
    return rawUrl;
  }

  // s-u.in proxy URLs (/stream/v/): route through Worker video proxy
  if (rawUrl.includes('s-u.in/stream/v/') || rawUrl.includes('s-u.in/stream/')) {
    return VIDEO_PROXY + encodeURIComponent(rawUrl);
  }

  // Anything else on s-u.in: proxy it
  if (rawUrl.includes('s-u.in')) {
    return VIDEO_PROXY + encodeURIComponent(rawUrl);
  }

  return rawUrl;
}

// ===================================================================
// STATUS BAR
// ===================================================================
var statusTimer = null;

function showStatus(msg, isError) {
  var bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = isError ? 'show error' : 'show';
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(hideStatus, 3000);
}

function hideStatus() {
  document.getElementById('statusBar').className = '';
}

// ===================================================================
// STATE
// ===================================================================
var currentCategory = CATALOGS[0].id;
var currentType = 'movie';
var currentDetail = null;
var currentStreams = [];
var currentSelectedStream = 0;
var currentEpisodes = [];
var currentEpisodeIndex = -1;
var searchTimeout = null;

// ===================================================================
// INIT
// ===================================================================
function init() {
  renderCategoryTabs();
  loadHome();
  document.getElementById('loadingOverlay').classList.add('hidden');
}

// ===================================================================
// CATEGORY TABS
// ===================================================================
function renderCategoryTabs() {
  var container = document.getElementById('categoryTabs');
  container.innerHTML = '';
  CATALOGS.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat.id === currentCategory ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = function() {
      currentCategory = cat.id;
      currentType = cat.type;
      renderCategoryTabs();
      loadHome();
    };
    container.appendChild(btn);
  });
}

// ===================================================================
// HOME PAGE LOADING
// ===================================================================
function loadHome() {
  var content = document.getElementById('homeContent');
  content.innerHTML = '';

  // Show loading skeletons
  for (var s = 0; s < 3; s++) {
    var section = document.createElement('div');
    section.className = 'section';
    var title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = 'Loading...';
    section.appendChild(title);
    var scroll = document.createElement('div');
    scroll.className = 'poster-scroll';
    for (var i = 0; i < 5; i++) {
      var sk = document.createElement('div');
      sk.className = 'skeleton skeleton-poster';
      scroll.appendChild(sk);
    }
    section.appendChild(scroll);
    content.appendChild(section);
  }

  // Load all catalogs in current type
  var toLoad = CATALOGS.filter(function(c) { return c.type === currentType; });
  var loaded = 0;

  toLoad.forEach(function(cat) {
    var apiUrl = PROXY_URL + encodeURIComponent(API_BASE + '/catalog/' + cat.type + '/' + cat.id + '.json');

    fetchJson(apiUrl)
      .then(function(data) {
        renderHomeSection(cat, data && data.metas ? data.metas : []);
      })
      .catch(function(err) {
        renderHomeError(cat, err.message);
      })
      .finally(function() {
        loaded++;
        if (loaded === toLoad.length) {
          // Remove remaining skeletons
          var skels = content.querySelectorAll('.skeleton-poster');
          skels.forEach(function(sk) { sk.remove(); });
        }
      });
  });
}

function renderHomeSection(cat, metas) {
  var content = document.getElementById('homeContent');

  // Find or create section for this catalog
  var sectionId = 'section_' + cat.id;
  var section = document.getElementById(sectionId);
  if (!section) {
    section = document.createElement('div');
    section.id = sectionId;
    section.className = 'section';
    content.appendChild(section);
  }

  if (!metas || metas.length === 0) {
    section.innerHTML = '<div class="section-title">' + cat.name + '</div>' +
      '<div class="error-state"><p>No content available</p></div>';
    return;
  }

  section.innerHTML = '<div class="section-title">' + cat.name + '</div>';
  var scroll = document.createElement('div');
  scroll.className = 'poster-scroll';

  metas.slice(0, 20).forEach(function(meta) {
    scroll.appendChild(createPosterCard(meta));
  });

  section.appendChild(scroll);
}

function renderHomeError(cat, errMsg) {
  var content = document.getElementById('homeContent');
  var sectionId = 'section_' + cat.id;
  var section = document.getElementById(sectionId);
  if (!section) {
    section = document.createElement('div');
    section.id = sectionId;
    section.className = 'section';
    content.appendChild(section);
  }
  section.innerHTML = '<div class="section-title">' + cat.name + '</div>' +
    '<div class="error-state"><p>Failed to load: ' + (errMsg || 'Unknown error') + '</p>' +
    '<button class="retry-btn" onclick="loadHome()">Retry</button></div>';
}

// ===================================================================
// POSTER CARD
// ===================================================================
function createPosterCard(meta) {
  var card = document.createElement('div');
  card.className = 'poster-card';
  card.onclick = function() {
    openDetail(meta.type || currentType, meta.id);
  };

  var imgWrap = document.createElement('div');
  imgWrap.className = 'poster-img-wrap';

  var img = document.createElement('img');
  img.src = meta.poster || '';
  img.alt = meta.name || '';
  img.loading = 'lazy';
  img.onerror = function() {
    img.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" fill="#222"><rect width="200" height="300"/><text x="100" y="150" fill="#555" text-anchor="middle" font-size="14">No Image</text></svg>');
  };
  imgWrap.appendChild(img);

  if (meta.vj || (meta.vjs && meta.vjs.length)) {
    var badge = document.createElement('div');
    badge.className = 'poster-badge';
    badge.textContent = meta.vj || (meta.vjs ? meta.vjs[0] : '');
    imgWrap.appendChild(badge);
  }

  card.appendChild(imgWrap);

  var name = document.createElement('div');
  name.className = 'poster-name';
  name.textContent = meta.name || 'Unknown';
  card.appendChild(name);

  var sub = document.createElement('div');
  sub.className = 'poster-sub';
  sub.textContent = (meta.releaseInfo || '') + (meta.vj ? ' · ' + meta.vj : '');
  card.appendChild(sub);

  return card;
}

// ===================================================================
// SEARCH
// ===================================================================
function toggleSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.toggle('active');
  if (bar.classList.contains('active')) {
    document.getElementById('searchInput').focus();
  } else {
    document.getElementById('searchInput').value = '';
    loadHome();
  }
}

function onSearch(query) {
  if (searchTimeout) clearTimeout(searchTimeout);
  if (!query || query.length < 2) {
    loadHome();
    return;
  }

  searchTimeout = setTimeout(function() {
    var searchUrl = PROXY_URL + encodeURIComponent(API_BASE + '/catalog/' + currentType + '/' + (currentType === 'movie' ? 'moviebay-all-movies' : 'moviebay-all-series') + '/search=' + encodeURIComponent(query) + '.json');

    showStatus('Searching...');

    fetchJson(searchUrl)
      .then(function(data) {
        hideStatus();
        var metas = data && data.metas ? data.metas : [];
        var content = document.getElementById('homeContent');
        content.innerHTML = '<div class="section"><div class="section-title">Results for "' + query + '"</div>';
        if (metas.length === 0) {
          content.innerHTML += '<div class="error-state"><p>No results found</p></div>';
        } else {
          var grid = document.createElement('div');
          grid.className = 'poster-grid';
          metas.forEach(function(meta) {
            grid.appendChild(createPosterCard(meta));
          });
          content.querySelector('.section').appendChild(grid);
        }
      })
      .catch(function(err) {
        hideStatus();
        showStatus('Search failed: ' + err.message, true);
      });
  }, 500);
}

// ===================================================================
// DETAIL PAGE
// ===================================================================
function openDetail(type, id) {
  currentType = type;
  showStatus('Loading details...');
  document.getElementById('loadingOverlay').classList.remove('hidden');

  var metaUrl = PROXY_URL + encodeURIComponent(API_BASE + '/meta/' + type + '/' + id + '.json');

  fetchJson(metaUrl)
    .then(function(data) {
      hideStatus();
      document.getElementById('loadingOverlay').classList.add('hidden');
      if (!data || !data.meta) {
        showStatus('Movie details not found', true);
        return;
      }
      currentDetail = data.meta;
      renderDetail(data.meta);
    })
    .catch(function(err) {
      hideStatus();
      document.getElementById('loadingOverlay').classList.add('hidden');
      showStatus('Failed to load details: ' + err.message, true);
    });
}

function renderDetail(meta) {
  // Hero background
  var bg = meta.background || meta.banner || meta.poster || '';
  document.getElementById('detailBg').src = bg;
  document.getElementById('detailBg').onerror = function() {
    this.src = meta.poster || '';
  };

  // Logo
  var logo = document.getElementById('detailLogo');
  if (meta.logo) {
    logo.src = meta.logo;
    logo.style.display = '';
  } else {
    logo.style.display = 'none';
    document.getElementById('detailTitle').textContent = meta.name || 'Unknown';
    document.getElementById('detailTitle').style.display = '';
  }

  if (meta.logo) {
    document.getElementById('detailTitle').style.display = 'none';
  }

  // Meta row
  var metaDiv = document.getElementById('detailMeta');
  metaDiv.innerHTML = '';
  if (meta.releaseInfo) {
    var yr = document.createElement('span');
    yr.textContent = meta.releaseInfo;
    metaDiv.appendChild(yr);
  }
  if (meta.runtime) {
    var rt = document.createElement('span');
    rt.textContent = meta.runtime;
    metaDiv.appendChild(rt);
  }
  if (meta.imdbRating) {
    var imdb = document.createElement('span');
    imdb.className = 'imdb';
    imdb.textContent = 'IMDb ' + meta.imdbRating;
    metaDiv.appendChild(imdb);
  }
  if (meta.vj) {
    var vj = document.createElement('span');
    vj.className = 'badge';
    vj.textContent = 'VJ: ' + meta.vj;
    metaDiv.appendChild(vj);
  }

  // Tags
  var tagsDiv = document.getElementById('detailTags');
  tagsDiv.innerHTML = '';
  if (meta.genres) {
    var genres = Array.isArray(meta.genres) ? meta.genres : [meta.genres];
    genres.forEach(function(g) {
      var tag = document.createElement('div');
      tag.className = 'detail-tag';
      tag.textContent = g;
      tagsDiv.appendChild(tag);
    });
  }

  // Description
  document.getElementById('detailDesc').textContent = meta.description || '';

  // Reset play button
  document.getElementById('detailPlayBtn').style.display = '';
  document.getElementById('detailPlayBtn').innerHTML = '▶ Play Now';

  // Load streams
  loadStreams(meta.id, meta.type);

  // Load episodes if series
  if (meta.type === 'series' && meta.videos && meta.videos.length) {
    renderEpisodes(meta);
  } else {
    document.getElementById('episodeList').innerHTML = '';
  }

  // Show detail page
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('playerPage').style.display = 'none';
  document.getElementById('detailPage').style.display = 'block';
  window.scrollTo(0, 0);
}

function loadStreams(id, type) {
  var streamUrl = PROXY_URL + encodeURIComponent(API_BASE + '/stream/' + type + '/' + id + '.json');

  fetchJson(streamUrl)
    .then(function(data) {
      currentStreams = data && data.streams ? data.streams : [];
      currentSelectedStream = 0;
      renderStreamSelector();
    })
    .catch(function(err) {
      document.getElementById('streamSelector').innerHTML =
        '<div class="error-state"><p>Failed to load streams: ' + err.message + '</p>' +
        '<button class="retry-btn" onclick="loadStreams(\'' + id + '\',\'' + type + '\')">Retry</button></div>';
    });
}

function renderStreamSelector() {
  var container = document.getElementById('streamSelector');

  if (!currentStreams || currentStreams.length === 0) {
    container.innerHTML = '<div class="error-state"><p>No streams available for this title</p></div>';
    document.getElementById('detailPlayBtn').style.display = 'none';
    return;
  }

  if (currentStreams.length === 1) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = '<div class="stream-selector-title">Available Streams</div>';

  currentStreams.forEach(function(stream, idx) {
    var opt = document.createElement('div');
    opt.className = 'stream-option' + (idx === currentSelectedStream ? ' active' : '');
    opt.innerHTML =
      '<div class="stream-icon">' + (stream.isFast ? '⚡' : '🎬') + '</div>' +
      '<div class="stream-info">' +
        '<div class="stream-name">' + (stream.vj || stream.sourceName || 'Stream ' + (idx+1)) + '</div>' +
        '<div class="stream-sub">' + (stream.subtitle || '') + '</div>' +
      '</div>';
    opt.onclick = function() {
      currentSelectedStream = idx;
      renderStreamSelector();
    };
    container.appendChild(opt);
  });
}

// ===================================================================
// EPISODES
// ===================================================================
function renderEpisodes(meta) {
  currentEpisodes = meta.videos || [];
  var container = document.getElementById('episodeList');

  // Group by season
  var seasons = {};
  currentEpisodes.forEach(function(ep) {
    var s = ep.season || 1;
    if (!seasons[s]) seasons[s] = [];
    seasons[s].push(ep);
  });

  var seasonNums = Object.keys(seasons).sort(function(a,b) { return a - b; });

  var html = '<div class="episode-list-title">Episodes</div>';
  html += '<div class="season-tabs">';
  seasonNums.forEach(function(s, i) {
    html += '<button class="season-tab' + (i === 0 ? ' active' : '') + '" onclick="selectSeason(' + s + ', this)">Season ' + s + '</button>';
  });
  html += '</div><div id="episodeItems"></div>';
  container.innerHTML = html;

  // Show first season
  renderEpisodeItems(seasons[seasonNums[0]]);
}

function selectSeason(seasonNum, btn) {
  // Update tab styles
  var tabs = document.querySelectorAll('.season-tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');

  // Filter episodes
  var eps = currentEpisodes.filter(function(ep) {
    return (ep.season || 1) === parseInt(seasonNum);
  });
  renderEpisodeItems(eps);
}

function renderEpisodeItems(episodes) {
  var container = document.getElementById('episodeItems');
  container.innerHTML = '';

  episodes.forEach(function(ep, idx) {
    var item = document.createElement('div');
    item.className = 'episode-item';
    item.innerHTML =
      '<div class="ep-num">' + (ep.number || (idx + 1)) + '</div>' +
      '<div class="ep-info">' +
        '<div class="ep-name">' + (ep.name || 'Episode ' + (ep.number || idx + 1)) + '</div>' +
        '<div class="ep-date">' + (ep.released || '') + '</div>' +
      '</div>';
    item.onclick = function() {
      // Find index in full episode array
      var globalIdx = currentEpisodes.indexOf(ep);
      currentEpisodeIndex = globalIdx;
      loadEpisodeStream(ep);
    };
    container.appendChild(item);
  });
}

function loadEpisodeStream(ep) {
  var epUrl = PROXY_URL + encodeURIComponent(API_BASE + '/stream/series/' + currentDetail.id + ':' + (ep.season || 1) + ':' + (ep.number || 1) + '.json');

  showStatus('Loading episode stream...');

  fetchJson(epUrl)
    .then(function(data) {
      hideStatus();
      var streams = data && data.streams ? data.streams : [];
      if (streams.length > 0) {
        showPlayer(streams[0].url, streams[0].fallbackUrl, currentDetail.name + ' - S' + (ep.season||1) + 'E' + (ep.number||1), streams[0].subtitle || '');
      } else {
        showStatus('No stream for this episode', true);
      }
    })
    .catch(function(err) {
      hideStatus();
      showStatus('Failed to load episode: ' + err.message, true);
    });
}

// ===================================================================
// PLAY ACTIONS
// ===================================================================
function onDetailPlay() {
  if (!currentStreams || currentStreams.length === 0) {
    showStatus('No streams available', true);
    return;
  }

  var stream = currentStreams[currentSelectedStream];
  showPlayer(stream.url, stream.fallbackUrl, currentDetail.name, stream.subtitle || '');
}

function showPlayer(rawUrl, fallbackUrl, title, subtitle) {
  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('playerPage').style.display = 'block';
  window.scrollTo(0, 0);

  document.getElementById('playerTitle').textContent = title;
  document.getElementById('playerSub').textContent = subtitle || '';

  // Update episode nav buttons
  updateEpisodeNav();

  startPlayback(rawUrl, fallbackUrl);
}

function updateEpisodeNav() {
  var prevBtn = document.getElementById('prevEpBtn');
  var nextBtn = document.getElementById('nextEpBtn');

  if (currentEpisodeIndex < 0) {
    // Movie - hide nav
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    return;
  }

  prevBtn.style.display = '';
  nextBtn.style.display = '';

  prevBtn.disabled = currentEpisodeIndex <= 0;
  nextBtn.disabled = currentEpisodeIndex >= currentEpisodes.length - 1;
}

function playPrevEpisode() {
  if (currentEpisodeIndex > 0) {
    currentEpisodeIndex--;
    var ep = currentEpisodes[currentEpisodeIndex];
    loadEpisodeStream(ep);
  }
}

function playNextEpisode() {
  if (currentEpisodeIndex < currentEpisodes.length - 1) {
    currentEpisodeIndex++;
    var ep = currentEpisodes[currentEpisodeIndex];
    loadEpisodeStream(ep);
  }
}

function backToDetail() {
  // FULL VIDEO CLEANUP
  var video = document.getElementById('videoPlayer');
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute('src');
  video.load();

  document.getElementById('playerPage').style.display = 'none';
  document.getElementById('detailPage').style.display = 'block';
  window.scrollTo(0, 0);
}

function showHome() {
  // FULL VIDEO CLEANUP
  var video = document.getElementById('videoPlayer');
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute('src');
  video.load();

  document.getElementById('detailPage').style.display = 'none';
  document.getElementById('playerPage').style.display = 'none';
  document.getElementById('homePage').style.display = 'block';
  window.scrollTo(0, 0);
}

// ===================================================================
// VIDEO PLAYBACK - WITH FULL FIXES
// ===================================================================
function startPlayback(rawStreamUrl, fallbackUrl) {
  var video = document.getElementById('videoPlayer');
  var streamUrl = resolveStreamUrl(rawStreamUrl);
  var resolvedFallback = fallbackUrl ? resolveStreamUrl(fallbackUrl) : null;

  console.log('[OmegaStream] Raw URL:', rawStreamUrl ? rawStreamUrl.substring(0, 80) + '...' : 'null');
  console.log('[OmegaStream] Resolved URL:', streamUrl ? streamUrl.substring(0, 80) + '...' : 'null');

  // FULL CLEANUP of previous playback
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute('src');
  video.load();

  // Reset UI
  hideStatus();

  // Brief pause to let the browser release the old source
  setTimeout(function() {
    video.src = streamUrl;
    video.load();

    var playPromise = video.play();
    if (playPromise) {
      playPromise.catch(function(e) {
        console.log('[OmegaStream] Autoplay blocked:', e);
        showStatus('Tap play button to start');
      });
    }
  }, 100);

  // ===== SEEK STALL RECOVERY =====
  var stallTimer = null;
  var recoverTime = 0;
  var fallbackUsed = false;

  function onSeeking() {
    recoverTime = video.currentTime;
    if (stallTimer) clearTimeout(stallTimer);
    stallTimer = setTimeout(function() {
      if (video.paused || video.readyState < 3) {
        console.log('[OmegaStream] Seek stalled at ' + recoverTime + 's - recovering');
        var t = recoverTime;
        video.pause();
        video.removeAttribute('src');
        video.load();
        setTimeout(function() {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', function onMeta() {
            video.removeEventListener('loadedmetadata', onMeta);
            video.currentTime = t;
            video.play();
          });
        }, 100);
      }
    }, 4000);
  }

  function onPlaying() {
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
  }

  function onError() {
    var err = video.error;
    var errMsg = 'Unknown error';
    if (err) {
      switch(err.code) {
        case 1: errMsg = 'Video loading aborted'; break;
        case 2: errMsg = 'Network error - stream unreachable'; break;
        case 3: errMsg = 'Video decode error - corrupt stream'; break;
        case 4: errMsg = 'Format not supported or URL blocked'; break;
      }
    }
    console.log('[OmegaStream] Video error:', errMsg, '- raw:', rawStreamUrl ? rawStreamUrl.substring(0, 60) : 'null');

    // Try fallback URL if available and not yet tried
    if (resolvedFallback && !fallbackUsed && resolvedFallback !== streamUrl) {
      fallbackUsed = true;
      console.log('[OmegaStream] Trying fallback URL...');
      showStatus('Trying backup stream...');
      video.pause();
      video.removeAttribute('src');
      video.load();
      setTimeout(function() {
        video.src = resolvedFallback;
        video.load();
        video.play().catch(function() {});
      }, 100);
      return;
    }

    showStatus('Stream error: ' + errMsg + ' - tap play to retry', true);
    setTimeout(hideStatus, 6000);
  }

  function onEnded() {
    // Auto-advance to next episode
    if (currentEpisodeIndex >= 0 && currentEpisodeIndex < currentEpisodes.length - 1) {
      showStatus('Playing next episode...');
      setTimeout(function() {
        hideStatus();
        playNextEpisode();
      }, 1500);
    }
  }

  // Register listeners
  video.addEventListener('seeking', onSeeking);
  video.addEventListener('playing', onPlaying);
  video.addEventListener('error', onError);
  video.addEventListener('ended', onEnded);

  // Cleanup function
  video._stallCleanup = function() {
    video.removeEventListener('seeking', onSeeking);
    video.removeEventListener('playing', onPlaying);
    video.removeEventListener('error', onError);
    video.removeEventListener('ended', onEnded);
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    video._stallCleanup = null;
  };
}

document.addEventListener('DOMContentLoaded', init);
