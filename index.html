<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OmegaStream</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #1a1a1a;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, #e50914, #ff6b6b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 40px 10px 16px;
  border-radius: 24px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.search-box input:focus {
  border-color: #e50914;
}

.search-box button {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: #e50914;
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.back-btn {
  background: #1a1a1a;
  border: 1px solid #333;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.back-btn.visible {
  display: flex;
}

/* CATEGORY TABS */
.tabs {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  z-index: 999;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px);
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #1a1a1a;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1px solid #333;
  background: transparent;
  color: #aaa;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}

.tab.active {
  background: #e50914;
  border-color: #e50914;
  color: #fff;
}

.tab:hover {
  border-color: #e50914;
  color: #fff;
}

/* CONTENT */
.content {
  padding: 120px 16px 30px;
  max-width: 1400px;
  margin: 0 auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}

@media (min-width: 600px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
}

@media (min-width: 900px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
  }
}

.card {
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border-radius: 12px;
  overflow: hidden;
  background: #141414;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(229,9,20,0.3);
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #1a1a1a;
}

.card-title {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 500;
  color: #ddd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* DETAIL VIEW */
.detail-view {
  display: none;
  padding: 70px 0 30px;
}

.detail-view.visible {
  display: block;
}

.detail-hero {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.5);
}

.detail-hero .hero-logo {
  position: absolute;
  bottom: 30px;
  left: 30px;
  max-width: 300px;
  max-height: 120px;
  object-fit: contain;
  filter: brightness(1);
}

.detail-info {
  padding: 20px 16px;
  max-width: 900px;
  margin: 0 auto;
}

.detail-info h1 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
}

.detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  align-items: center;
}

.detail-meta span {
  font-size: 13px;
  color: #aaa;
}

.detail-meta .genre {
  background: #1a1a1a;
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid #333;
  font-size: 12px;
}

.detail-meta .vj-badge {
  background: #e50914;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.detail-desc {
  color: #ccc;
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 24px;
}

.play-btn {
  background: linear-gradient(135deg, #e50914, #ff4444);
  color: #fff;
  border: none;
  padding: 14px 40px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s;
  margin-bottom: 24px;
}

.play-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 25px rgba(229,9,20,0.4);
}

/* EPISODES */
.episodes-section {
  margin-top: 20px;
}

.episodes-section h2 {
  font-size: 20px;
  margin-bottom: 16px;
  font-weight: 700;
}

.episode-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

.episode-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.episode-card:hover {
  border-color: #e50914;
  background: #222;
}

.episode-card .ep-number {
  color: #e50914;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.episode-card .ep-name {
  font-size: 14px;
  font-weight: 500;
  color: #eee;
}

.episode-card .ep-date {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}

/* PLAYER */
.player-view {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2000;
  background: #000;
}

.player-view.visible {
  display: flex;
  flex-direction: column;
}

.player-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: rgba(0,0,0,0.9);
  gap: 12px;
}

.player-header .close-player {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.video-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #000;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(0,0,0,0.9);
}

.player-controls button {
  background: rgba(255,255,255,0.1);
  border: 1px solid #333;
  color: #fff;
  padding: 10px 20px;
  border-radius: 24px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.player-controls button:hover {
  background: #e50914;
  border-color: #e50914;
}

.player-controls button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.player-controls button:disabled:hover {
  background: rgba(255,255,255,0.1);
  border-color: #333;
}

/* STREAM SELECTOR */
.stream-selector {
  display: flex;
  gap: 8px;
  padding: 8px 16px;
  overflow-x: auto;
  background: rgba(0,0,0,0.8);
  scrollbar-width: none;
}

.stream-selector::-webkit-scrollbar {
  display: none;
}

.stream-option {
  padding: 6px 14px;
  border-radius: 16px;
  border: 1px solid #333;
  background: transparent;
  color: #aaa;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s;
}

.stream-option.active {
  background: #e50914;
  border-color: #e50914;
  color: #fff;
}

/* LOADING & STATES */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #666;
  font-size: 15px;
}

.loading::after {
  content: '';
  display: block;
  width: 30px;
  height: 30px;
  border: 3px solid #333;
  border-top-color: #e50914;
  border-radius: 50%;
  margin: 16px auto 0;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: #666;
  font-size: 15px;
  line-height: 1.8;
}

.retry-btn {
  background: #e50914;
  color: #fff;
  border: none;
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: transform 0.2s;
}

.retry-btn:hover {
  transform: scale(1.05);
}

/* STATUS BAR */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 3000;
  background: rgba(229,9,20,0.9);
  color: #fff;
  padding: 10px 16px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  transform: translateY(100%);
  transition: transform 0.3s;
}

.status-bar.visible {
  transform: translateY(0);
}

/* HIDDEN */
.hidden {
  display: none !important;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <button class="back-btn" id="backBtn" onclick="goBack()">&#8592;</button>
  <div class="logo">OMEGA</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies & series..." onkeypress="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">&#128269;</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs" id="tabsContainer"></div>

<!-- MAIN CONTENT GRID -->
<div class="content" id="mainContent">
  <div class="grid" id="contentGrid"></div>
</div>

<!-- DETAIL VIEW -->
<div class="detail-view" id="detailView">
  <div class="detail-hero">
    <img id="detailBanner" src="" alt="">
    <img class="hero-logo" id="detailLogo" src="" alt="" style="display:none">
  </div>
  <div class="detail-info">
    <h1 id="detailTitle"></h1>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-desc" id="detailDesc"></div>
    <button class="play-btn" id="mainPlayBtn" onclick="playFromDetail()">
      &#9654; Play
    </button>
    <div class="episodes-section" id="episodesSection" style="display:none">
      <h2>Episodes</h2>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div class="player-view" id="playerView">
  <div class="player-header">
    <button class="close-player" onclick="closePlayer()">&#10005;</button>
    <div class="player-title" id="playerTitle">Loading...</div>
  </div>
  <div class="stream-selector" id="streamSelector"></div>
  <div class="video-container">
    <video id="videoPlayer" controls playsinline preload="auto"></video>
  </div>
  <div class="player-controls" id="playerControls">
    <button id="prevEpBtn" onclick="playPrevEpisode()">&#9664; Prev</button>
    <button id="nextEpBtn" onclick="playNextEpisode()">Next &#9654;</button>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar" id="statusBar"></div>

<script>
// ============================================
// CONFIGURATION
// ============================================
var PROXY_URL = 'https://moviebay-proxy.milesdaglas.workers.dev/?url=';
var API_BASE = 'https://s-u.in';

var CATEGORIES = [
  { id: 'moviebay-latest-movies', type: 'movie', name: 'Latest Movies' },
  { id: 'moviebay-trending-movies', type: 'movie', name: 'Trending Movies' },
  { id: 'moviebay-popular-movies', type: 'movie', name: 'Popular Movies' },
  { id: 'moviebay-year-movies', type: 'movie', name: '2026 Movies' },
  { id: 'moviebay-vj-movies', type: 'movie', name: 'VJ Movies' },
  { id: 'moviebay-all-movies', type: 'movie', name: 'All Movies' },
  { id: 'moviebay-latest-series', type: 'series', name: 'Latest Series' },
  { id: 'moviebay-trending-series', type: 'series', name: 'Trending Series' },
  { id: 'moviebay-popular-series', type: 'series', name: 'Popular Series' },
  { id: 'moviebay-year-series', type: 'series', name: '2026 Series' },
  { id: 'moviebay-vj-series', type: 'series', name: 'VJ Series' },
  { id: 'moviebay-all-series', type: 'series', name: 'All Series' }
];

// ============================================
// STATE
// ============================================
var currentCategory = null;
var currentMeta = null;
var currentType = 'movie';
var currentEpisodeIndex = -1;
var currentEpisodes = [];
var currentStreams = [];
var currentStreamIndex = 0;
var currentView = 'home';
var currentDetailId = null;
var currentDetailType = null;

// ============================================
// CACHE LAYER
// ============================================
var apiCache = new Map();

function getCached(key) {
  if (apiCache.has(key)) return apiCache.get(key);
  try {
    var stored = localStorage.getItem('os_' + key);
    if (stored) {
      var parsed = JSON.parse(stored);
      apiCache.set(key, parsed);
      return parsed;
    }
  } catch(e) {}
  return null;
}

function setCached(key, data) {
  apiCache.set(key, data);
  try {
    localStorage.setItem('os_' + key, JSON.stringify(data));
  } catch(e) {}
}

// ============================================
// FETCH WITH RETRY
// ============================================
async function fetchJson(url) {
  var cacheKey = url;
  var cached = getCached(cacheKey);
  if (cached) return cached;

  var proxyUrl = PROXY_URL + encodeURIComponent(url);

  for (var attempt = 0; attempt < 3; attempt++) {
    try {
      var ctrl = new AbortController();
      var timer = setTimeout(function() { ctrl.abort(); }, 15000);
      var resp = await fetch(proxyUrl, { signal: ctrl.signal });
      clearTimeout(timer);

      if (resp.status === 429) {
        showStatus('Rate limited - retrying...');
        var wait = Math.pow(2, attempt) * 2000;
        await new Promise(function(r) { setTimeout(r, wait); });
        continue;
      }

      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      setCached(cacheKey, data);
      hideStatus();
      return data;
    } catch(e) {
      if (attempt === 2) {
        hideStatus();
        throw e;
      }
      await new Promise(function(r) { setTimeout(r, 1000 * (attempt + 1)); });
    }
  }
  throw new Error('All retries failed');
}

// ============================================
// STATUS BAR
// ============================================
function showStatus(msg) {
  var bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.classList.add('visible');
}

function hideStatus() {
  document.getElementById('statusBar').classList.remove('visible');
}

// ============================================
// INITIALIZATION
// ============================================
function init() {
  buildTabs();
  loadCategory(CATEGORIES[0].id, CATEGORIES[0].type);
}

function buildTabs() {
  var container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  CATEGORIES.forEach(function(cat, index) {
    var tab = document.createElement('button');
    tab.className = 'tab' + (index === 0 ? ' active' : '');
    tab.textContent = cat.name;
    tab.onclick = function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      showHome();
      loadCategory(cat.id, cat.type);
    };
    container.appendChild(tab);
  });
}

// ============================================
// VIEW MANAGEMENT
// ============================================
function showHome() {
  currentView = 'home';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('detailView').classList.remove('visible');
  document.getElementById('backBtn').classList.remove('visible');
}

function showDetail(id, type) {
  currentView = 'detail';
  currentDetailId = id;
  currentDetailType = type;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('detailView').classList.add('visible');
  document.getElementById('backBtn').classList.add('visible');
  loadDetail(id, type);
}

function goBack() {
  if (currentView === 'detail') {
    showHome();
    // Re-show current category content from cache
    if (currentCategory) {
      loadCategory(currentCategory.id, currentCategory.type);
    }
  }
}

// ============================================
// CATEGORY LOADING
// ============================================
async function loadCategory(catalogId, type) {
  currentCategory = { id: catalogId, type: type };
  var grid = document.getElementById('contentGrid');
  if (!grid) return;

  grid.innerHTML = '<div class="loading">Loading...</div>';

  try {
    var url = API_BASE + '/catalog/' + type + '/' + catalogId + '.json';
    var data = await fetchJson(url);

    if (!data || !data.metas || data.metas.length === 0) {
      grid.innerHTML = '<div class="empty">No content found.<br><button class="retry-btn" onclick="loadCategory(\'' + catalogId + '\',\'' + type + '\')">Retry</button></div>';
      return;
    }

    grid.innerHTML = '';
    data.metas.forEach(function(meta) {
      var card = document.createElement('div');
      card.className = 'card';

      var img = document.createElement('img');
      img.src = meta.poster || '';
      img.alt = meta.name || '';
      img.loading = 'lazy';
      img.onerror = function() {
        this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%231a1a1a" width="200" height="300"/><text x="100" y="150" fill="%23444" text-anchor="middle" font-size="14">No Poster</text></svg>';
      };

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = meta.name || 'Unknown';

      card.appendChild(img);
      card.appendChild(title);
      card.onclick = function() { showDetail(meta.id, meta.type || type); };
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = '<div class="empty">Failed to load content.<br><small>' + e.message + '</small><br><button class="retry-btn" onclick="loadCategory(\'' + catalogId + '\',\'' + type + '\')">Retry</button></div>';
  }
}

// ============================================
// DETAIL LOADING
// ============================================
async function loadDetail(id, type) {
  var banner = document.getElementById('detailBanner');
  var logo = document.getElementById('detailLogo');
  var title = document.getElementById('detailTitle');
  var meta = document.getElementById('detailMeta');
  var desc = document.getElementById('detailDesc');
  var playBtn = document.getElementById('mainPlayBtn');
  var epSection = document.getElementById('episodesSection');
  var epList = document.getElementById('episodeList');

  banner.src = '';
  logo.style.display = 'none';
  title.textContent = 'Loading...';
  meta.innerHTML = '';
  desc.textContent = '';
  playBtn.textContent = 'Loading...';
  playBtn.disabled = true;
  epSection.style.display = 'none';
  epList.innerHTML = '';

  try {
    var url = API_BASE + '/meta/' + type + '/' + id + '.json';
    var data = await fetchJson(url);

    if (!data || !data.meta) {
      title.textContent = 'Not found';
      desc.textContent = 'Could not load details.';
      return;
    }

    var m = data.meta;
    currentMeta = m;
    currentType = type;

    banner.src = m.banner || m.background || m.poster || '';
    if (m.logo) {
      logo.src = m.logo;
      logo.style.display = 'block';
    }

    title.textContent = m.name || 'Unknown';

    var metaHtml = '';
    if (m.releaseInfo) metaHtml += '<span>' + m.releaseInfo + '</span>';
    if (m.genres && m.genres.length) {
      m.genres.forEach(function(g) {
        metaHtml += '<span class="genre">' + g + '</span>';
      });
    }
    if (m.vjs && m.vjs.length) {
      m.vjs.forEach(function(vj) {
        metaHtml += '<span class="vj-badge">' + vj + '</span>';
      });
    }
    meta.innerHTML = metaHtml;

    desc.textContent = m.description || 'No description available.';

    if (type === 'movie') {
      playBtn.innerHTML = '&#9654; Play Movie';
      playBtn.disabled = false;
      playBtn.onclick = function() { playFromDetail(); };
    } else if (type === 'series' && m.videos && m.videos.length > 0) {
      playBtn.innerHTML = '&#9654; Play S' + (m.videos[0].season || 1) + 'E' + (m.videos[0].number || 1);
      playBtn.disabled = false;
      currentEpisodes = m.videos;
      playBtn.onclick = function() { playEpisode(0); };

      epSection.style.display = 'block';
      epList.innerHTML = '';

      var lastSeason = -1;
      m.videos.forEach(function(ep, idx) {
        if (ep.season !== lastSeason) {
          lastSeason = ep.season;
          var seasonHeader = document.createElement('div');
          seasonHeader.style.gridColumn = '1 / -1';
          seasonHeader.style.padding = '8px 0';
          seasonHeader.innerHTML = '<span style="color:#e50914;font-weight:700;font-size:15px">Season ' + ep.season + '</span>';
          epList.appendChild(seasonHeader);
        }

        var epCard = document.createElement('div');
        epCard.className = 'episode-card';
        epCard.innerHTML = '<div class="ep-number">S' + ep.season + ' E' + ep.number + '</div><div class="ep-name">' + (ep.name || 'Episode ' + ep.number) + '</div><div class="ep-date">' + (ep.released || '') + '</div>';
        epCard.onclick = function() { playEpisode(idx); };
        epList.appendChild(epCard);
      });
    } else {
      playBtn.innerHTML = '&#9654; Play';
      playBtn.disabled = true;
      playBtn.textContent = 'No streams available';
    }
  } catch(e) {
    title.textContent = 'Error loading';
    desc.textContent = 'Failed to load details: ' + e.message;
    playBtn.textContent = 'Retry';
    playBtn.disabled = false;
    playBtn.onclick = function() { loadDetail(id, type); };
  }
}

// ============================================
// PLAYBACK
// ============================================
async function playFromDetail() {
  if (!currentMeta) return;
  showStatus('Loading streams...');

  try {
    var url = API_BASE + '/stream/' + currentType + '/' + currentMeta.id + '.json';
    var data = await fetchJson(url);

    if (!data || !data.streams || data.streams.length === 0) {
      hideStatus();
      showStatus('No streams available');
      setTimeout(hideStatus, 3000);
      return;
    }

    currentStreams = data.streams;
    currentStreamIndex = 0;
    currentEpisodeIndex = -1;
    hideStatus();
    openPlayer(currentStreams[0], currentMeta.name || 'Video');
  } catch(e) {
    hideStatus();
    showStatus('Failed to load streams: ' + e.message);
    setTimeout(hideStatus, 4000);
  }
}

async function playEpisode(index) {
  if (!currentMeta || !currentEpisodes[index]) return;
  showStatus('Loading episode...');

  try {
    var ep = currentEpisodes[index];
    var url = API_BASE + '/stream/' + currentType + '/' + currentMeta.id + ':' + (ep.season || 1) + ':' + (ep.number || index + 1) + '.json';
    var data = await fetchJson(url);

    if (!data || !data.streams || data.streams.length === 0) {
      hideStatus();
      showStatus('No streams for this episode');
      setTimeout(hideStatus, 3000);
      return;
    }

    currentStreams = data.streams;
    currentStreamIndex = 0;
    currentEpisodeIndex = index;
    var epName = 'S' + (ep.season || 1) + 'E' + (ep.number || index + 1) + ' - ' + (ep.name || currentMeta.name || '');
    hideStatus();
    openPlayer(currentStreams[0], epName);
    updateEpisodeButtons();
  } catch(e) {
    hideStatus();
    showStatus('Failed to load episode: ' + e.message);
    setTimeout(hideStatus, 4000);
  }
}

function updateEpisodeButtons() {
  var prevBtn = document.getElementById('prevEpBtn');
  var nextBtn = document.getElementById('nextEpBtn');
  prevBtn.disabled = currentEpisodeIndex <= 0;
  nextBtn.disabled = currentEpisodeIndex >= currentEpisodes.length - 1;
}

function playPrevEpisode() {
  if (currentEpisodeIndex > 0) {
    playEpisode(currentEpisodeIndex - 1);
  }
}

function playNextEpisode() {
  if (currentEpisodeIndex < currentEpisodes.length - 1) {
    playEpisode(currentEpisodeIndex + 1);
  }
}

// ============================================
// PLAYER
// ============================================
function openPlayer(stream, title) {
  var playerView = document.getElementById('playerView');
  var video = document.getElementById('videoPlayer');
  var playerTitle = document.getElementById('playerTitle');
  var streamSelector = document.getElementById('streamSelector');

  playerView.classList.add('visible');
  playerTitle.textContent = title || 'Playing...';

  // Build stream selector
  streamSelector.innerHTML = '';
  currentStreams.forEach(function(s, idx) {
    var btn = document.createElement('button');
    btn.className = 'stream-option' + (idx === currentStreamIndex ? ' active' : '');
    btn.textContent = (s.name || s.server || ('Stream ' + (idx + 1))) + (s.isFast ? ' (Fast)' : '');
    btn.onclick = function() {
      currentStreamIndex = idx;
      streamSelector.querySelectorAll('.stream-option').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      startPlayback(s.url || s.fallbackUrl, title);
    };
    streamSelector.appendChild(btn);
  });

  if (streamSelector.children.length <= 1) {
    streamSelector.style.display = 'none';
  } else {
    streamSelector.style.display = 'flex';
  }

  var streamUrl = stream.url || stream.fallbackUrl || '';
  startPlayback(streamUrl, title);
}

function startPlayback(streamUrl, title) {
  var video = document.getElementById('videoPlayer');

  // FULL CLEANUP of previous video
  video.pause();
  video.removeAttribute('src');
  video.load();

  // Small delay to ensure cleanup completes
  setTimeout(function() {
    video.src = streamUrl;
    video.load();

    var playPromise = video.play();
    if (playPromise) {
      playPromise.catch(function(e) {
        console.log('Autoplay blocked, user must tap play:', e);
      });
    }
  }, 100);

  // === SEEK STALL RECOVERY ===
  // Remove old listeners by cloning approach or use flags
  if (video._stallCleanup) video._stallCleanup();

  var stallTimer = null;
  var recoverTime = 0;

  function onSeeking() {
    recoverTime = video.currentTime;
    if (stallTimer) clearTimeout(stallTimer);
    stallTimer = setTimeout(function() {
      if (video.paused || video.readyState < 3) {
        console.log('Seek stalled at ' + recoverTime + 's - recovering...');
        var t = recoverTime;
        video.pause();
        video.removeAttribute('src');
        video.load();
        setTimeout(function() {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', function onMeta() {
            video.removeEventListener('loadedmetadata', onMeta);
            video.currentTime = t;
            video.play();
          });
        }, 100);
      }
    }, 4000);
  }

  function onPlaying() {
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
  }

  function onError() {
    console.log('Video error, attempting recovery...');
    showStatus('Stream error - tap play to retry');
    setTimeout(hideStatus, 4000);
  }

  function onEnded() {
    // Auto-advance to next episode for series
    if (currentEpisodeIndex >= 0 && currentEpisodeIndex < currentEpisodes.length - 1) {
      showStatus('Playing next episode...');
      setTimeout(function() {
        hideStatus();
        playEpisode(currentEpisodeIndex + 1);
      }, 1500);
    }
  }

  video.addEventListener('seeking', onSeeking);
  video.addEventListener('playing', onPlaying);
  video.addEventListener('error', onError);
  video.addEventListener('ended', onEnded);

  video._stallCleanup = function() {
    video.removeEventListener('seeking', onSeeking);
    video.removeEventListener('playing', onPlaying);
    video.removeEventListener('error', onError);
    video.removeEventListener('ended', onEnded);
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    video._stallCleanup = null;
  };
}

function closePlayer() {
  var video = document.getElementById('videoPlayer');
  video.pause();
  if (video._stallCleanup) video._stallCleanup();
  video.removeAttribute('src');
  video.load();
  document.getElementById('playerView').classList.remove('visible');
}

// ============================================
// SEARCH
// ============================================
async function doSearch() {
  var query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  showHome();
  var grid = document.getElementById('contentGrid');
  grid.innerHTML = '<div class="loading">Searching for "' + query + '"...</div>';

  // Hide tab active state
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });

  try {
    var movieUrl = API_BASE + '/catalog/movie/moviebay-all-movies/search=' + encodeURIComponent(query) + '.json';
    var seriesUrl = API_BASE + '/catalog/series/moviebay-all-series/search=' + encodeURIComponent(query) + '.json';

    var results = await Promise.allSettled([
      fetchJson(movieUrl),
      fetchJson(seriesUrl)
    ]);

    var allMetas = [];
    results.forEach(function(r) {
      if (r.status === 'fulfilled' && r.value && r.value.metas) {
        allMetas = allMetas.concat(r.value.metas);
      }
    });

    if (allMetas.length === 0) {
      grid.innerHTML = '<div class="empty">No results for "' + query + '"</div>';
      return;
    }

    grid.innerHTML = '';
    allMetas.forEach(function(meta) {
      var card = document.createElement('div');
      card.className = 'card';

      var img = document.createElement('img');
      img.src = meta.poster || '';
      img.alt = meta.name || '';
      img.loading = 'lazy';
      img.onerror = function() {
        this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="%231a1a1a" width="200" height="300"/></svg>';
      };

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = meta.name || 'Unknown';

      card.appendChild(img);
      card.appendChild(title);
      card.onclick = function() { showDetail(meta.id, meta.type || 'movie'); };
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = '<div class="empty">Search failed: ' + e.message + '<br><button class="retry-btn" onclick="doSearch()">Retry</button></div>';
  }
}
