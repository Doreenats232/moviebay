// ================================================================
// VIDEO PLAYBACK
// ================================================================
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x;
}

function getResumePoint() {
  if (!currentDetail) return 0;
  var list = getContinue();
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    var pe = (p.episodeIndex === undefined || p.episodeIndex === null) ? -1 : p.episodeIndex;
    if (p.id === currentDetail.id && pe === currentEpisodeIndex && p.currentTime > 15 && p.duration > 0 && p.currentTime < p.duration - 30) return p.currentTime;
  }
  return 0;
}

function startPlayback(rawStreamUrl, fallbackUrl) {
  var video = document.getElementById("videoPlayer");
  pcReset();
  var streamUrl = resolveStreamUrl(rawStreamUrl);
  var resolvedFallback = fallbackUrl ? resolveStreamUrl(fallbackUrl) : null;

  console.log("[Omega] Raw:", rawStreamUrl ? rawStreamUrl.substring(0, 100) : "null");
  console.log("[Omega] Resolved:", streamUrl ? streamUrl.substring(0, 100) : "null");

  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();
  hideStatus();

  var resumeAt = getResumePoint();
  if (resumeAt > 0) {
    video.addEventListener("loadedmetadata", function onResume() {
      video.removeEventListener("loadedmetadata", onResume);
      try { video.currentTime = resumeAt; showToast("Resuming at " + fmtTime(resumeAt), "info"); } catch (e) {}
    });
  }

  setTimeout(function() {
    video.src = streamUrl;
    video.load();
    video.play().catch(function() { showStatus("Tap play to start"); });
  }, 100);

  var stallTimer = null;
  var waitTimer = null;
  var recoverTime = 0;
  var fallbackUsed = false;
  var curUrl = streamUrl;
  var retries = 0;
  var MAX_RETRIES = 3;

  function reloadAt(url, t, delay) {
    video.pause();
    video.removeAttribute("src");
    video.load();
    setTimeout(function() {
      video.src = url;
      video.load();
      if (t > 0) {
        video.addEventListener("loadedmetadata", function m() {
          video.removeEventListener("loadedmetadata", m);
          try { video.currentTime = t; } catch (e) {}
        });
      }
      video.play().catch(function() {});
    }, delay);
  }

  function onWaiting() {
    if (waitTimer) clearTimeout(waitTimer);
    waitTimer = setTimeout(function() {
      if (!video.paused && video.readyState < 3 && retries < MAX_RETRIES && navigator.onLine !== false) {
        retries++;
        showStatus("Stream stalled, reconnecting...", "warning");
        reloadAt(curUrl, video.currentTime || 0, 300);
      }
    }, 10000);
  }

  function onOnline() {
    if (video.error || (video.readyState < 3 && !video.paused)) {
      showStatus("Back online, resuming...");
      retries = 0;
      reloadAt(curUrl, video.currentTime || recoverTime || 0, 300);
    }
  }

  function onSeeking() {
    recoverTime = video.currentTime;
    if (stallTimer) clearTimeout(stallTimer);
    stallTimer = setTimeout(function() {
      if (video.paused || video.readyState < 3) {
        var t = recoverTime;
        video.pause();
        video.removeAttribute("src");
        video.load();
        setTimeout(function() {
          video.src = curUrl;
          video.addEventListener("loadedmetadata", function onMeta() {
            video.removeEventListener("loadedmetadata", onMeta);
            video.currentTime = t;
            video.play();
          });
        }, 100);
      }
    }, 4000);
  }

  function onPlaying() {
    retries = 0;
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    hideStatus();
  }

  function onError() {
    var err = video.error;
    var errMsg = "Unknown error";
    if (err) {
      switch (err.code) {
        case 1: errMsg = "Loading aborted"; break;
        case 2: errMsg = "Network error"; break;
        case 3: errMsg = "Decode error"; break;
        case 4: errMsg = "Format not supported"; break;
      }
    }
    if (err && err.code === 1) return;
    var t = video.currentTime || recoverTime || 0;
    if (navigator.onLine === false) {
      showStatus("You're offline - will resume when you're back online", "warning");
      return;
    }
    if (retries < MAX_RETRIES) {
      retries++;
      showStatus("Connection hiccup, retrying (" + retries + "/" + MAX_RETRIES + ")...", "warning");
      reloadAt(curUrl, t, 1000 * Math.pow(2, retries - 1));
      return;
    }
    if (resolvedFallback && !fallbackUsed && resolvedFallback !== streamUrl) {
      fallbackUsed = true;
      retries = 0;
      curUrl = resolvedFallback;
      showStatus("Trying backup stream...");
      reloadAt(curUrl, t, 100);
      return;
    }
    var hint = (err && (err.code === 2 || err.code === 4)) ? "Stream may have expired. Go back and reopen the title, or pick another VJ/stream." : errMsg + " - tap play to retry";
    showStatus(hint, "error");
    setTimeout(hideStatus, 8000);
  }

  function onEnded() {
    saveProgress();
    if (!pcNextCancelled && currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length - 1) {
      showStatus("Next episode starting...");
      setTimeout(function() { hideStatus(); playNextEpisode(); }, 1500);
    }
  }

  video.addEventListener("seeking", onSeeking);
  video.addEventListener("waiting", onWaiting);
  window.addEventListener("online", onOnline);
  video.addEventListener("playing", onPlaying);
  video.addEventListener("error", onError);
  video.addEventListener("ended", onEnded);

  video._stallCleanup = function() {
    video.removeEventListener("seeking", onSeeking);
    video.removeEventListener("waiting", onWaiting);
    window.removeEventListener("online", onOnline);
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    video.removeEventListener("playing", onPlaying);
    video.removeEventListener("error", onError);
    video.removeEventListener("ended", onEnded);
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    video._stallCleanup = null;
  };
}

function playPrevEpisode() {
  if (currentEpisodeIndex > 0) {
    currentEpisodeIndex--;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
    renderPlayerEpisodes();
  }
}

function playNextEpisode() {
  if (currentEpisodeIndex < allEpisodes.length - 1) {
    currentEpisodeIndex++;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
    renderPlayerEpisodes();
  }
}

function getHistory() { try { return JSON.parse(localStorage.getItem("os_hist") || "[]"); } catch (e) { return []; } }

function addToHistory() {
  if (!currentDetail) return;
  var epInfo = null;
  if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length) {
    var ep = allEpisodes[currentEpisodeIndex];
    epInfo = "S" + ep.season + " E" + ep.number;
  }
  var h = getHistory().filter(function(x) { return x.id !== currentDetail.id; });
  h.unshift({ id: currentDetail.id, type: currentDetail.type, name: currentDetail.name, poster: currentDetail.poster || currentDetail.background || "", episodeInfo: epInfo, episodeIndex: currentEpisodeIndex, timestamp: Date.now() });
  h = h.slice(0, 60);
  try { localStorage.setItem("os_hist", JSON.stringify(h)); } catch (e) {}
}

function clearHistory() {
  try { localStorage.removeItem("os_hist"); } catch (e) {}
  renderLibrary();
  showToast("History cleared", "info");
}

function timeAgo(ts) {
  var d = Math.max(0, Date.now() - (ts || 0));
  var m = Math.floor(d / 60000);
  if (m < 1) return "Just now";
  if (m < 60) return m + " min ago";
  var h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  var days = Math.floor(h / 24);
  return days === 1 ? "Yesterday" : days + " days ago";
}

function leftText(item) {
  if (!item.duration) return "Resume";
  var rem = Math.max(0, item.duration - (item.currentTime || 0));
  var m = Math.round(rem / 60);
  if (m >= 60) return Math.floor(m / 60) + "h " + (m % 60) + "m left";
  return m + " min left";
}

function libOpen(item) {

function libRow(item, sub, pct, onOpen, onRemove) {
  var row = document.createElement("div");
  row.className = "lib-row";
  row.onclick = onOpen;
  var th = document.createElement("div");
  th.className = "lib-thumb";
  if (item.poster) {
    var im = document.createElement("img");
    im.src = item.poster; im.alt = ""; im.loading = "lazy";
    im.onerror = function() { this.style.display = "none"; };
    th.appendChild(im);
  }
  var info = document.createElement("div");
  info.className = "lib-info";
  var n = document.createElement("div"); n.className = "lib-name"; n.textContent = item.name || "Unknown";
  var sb = document.createElement("div"); sb.className = "lib-sub"; sb.textContent = sub;
  info.appendChild(n); info.appendChild(sb);
  if (pct >= 0) {
    var bar = document.createElement("div"); bar.className = "lib-bar";
    var f = document.createElement("div"); f.style.width = Math.min(100, Math.max(0, pct)) + "%";
    bar.appendChild(f); info.appendChild(bar);
  }
  row.appendChild(th); row.appendChild(info);
  if (onRemove) {
    var rm = document.createElement("button");
    rm.className = "lib-remove";
    rm.setAttribute("aria-label", "Remove");
    rm.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    rm.onclick = function(e) { e.stopPropagation(); onRemove(); };
    row.appendChild(rm);
  }
  return row;
}

function setLibTab(t) { libTab = t; renderLibrary(); }

function renderLibrary() {
  var tabs = [["list", "My list"], ["history", "History"], ["downloads", "Downloads"]];
  var th = "";
  tabs.forEach(function(t) { th += '<button class="lib-tab' + (libTab === t[0] ? ' active' : '') + '" aria-pressed="' + (libTab === t[0]) + '" onclick="setLibTab(\'' + t[0] + '\')">' + t[1] + '</button>'; });
  document.getElementById("libTabs").innerHTML = th;
  var c = document.getElementById("libContent");
  c.innerHTML = "";
  if (libTab === "list") renderLibList(c);
  else if (libTab === "history") renderLibHistory(c);
  else renderLibDownloads(c);
  window.scrollTo(0, 0);
}

function libEmpty(c, title, body) {
  var d = document.createElement("div");
  d.className = "empty-state";
  var h = document.createElement("h3"); h.textContent = title;
  var p = document.createElement("p"); p.textContent = body;
  d.appendChild(h); d.appendChild(p);
  c.appendChild(d);
}

function renderLibList(c) {
  var cont = getContinue();
  var wl = getWatchlist();
  if (!cont.length && !wl.length) { libEmpty(c, "Start your list", "Tap My List on any title to save it here. Anything you watch shows up under Continue watching."); return; }
  if (cont.length) {
    var t = document.createElement("div"); t.className = "lib-sec"; t.textContent = "Continue watching"; c.appendChild(t);
    cont.forEach(function(item) {
      var pct = item.duration > 0 ? (item.currentTime / item.duration * 100) : 0;
      var sub = (item.episodeInfo ? item.episodeInfo + " \u00b7 " : "") + leftText(item);
      c.appendChild(libRow(item, sub, pct, function() { libOpen(item); }, function() { libRemoveContinue(item.id); }));
    });
  }
  if (wl.length) {
    var t2 = document.createElement("div"); t2.className = "lib-sec"; t2.style.paddingTop = "18px"; t2.textContent = "My list"; c.appendChild(t2);
    var grid = document.createElement("div"); grid.className = "poster-grid";
    wl.forEach(function(meta) { grid.appendChild(createPosterCard(meta)); });
    c.appendChild(grid);
  }
}

function renderLibHistory(c) {
  var h = getHistory();
  if (!h.length) { libEmpty(c, "Nothing watched yet", "Titles you play will show up here."); return; }
  var bar = document.createElement("div"); bar.className = "lib-actions";
  var b = document.createElement("button"); b.className = "lib-action"; b.textContent = "Clear history"; b.onclick = clearHistory;
  bar.appendChild(b); c.appendChild(bar);
  h.forEach(function(item) {
    var sub = (item.episodeInfo ? item.episodeInfo + " \u00b7 " : "") + timeAgo(item.timestamp);
    c.appendChild(libRow(item, sub, -1, function() { libOpen(item); }, null));
  });
}

function renderLibDownloads(c) {
  var bar = document.createElement("div"); bar.className = "lib-actions";
  bar.innerHTML = '<button class="lib-action" onclick="processDownloadQueue()">Start all</button><button class="lib-action" onclick="clearCompletedDownloads()">Clear done</button>';
  c.appendChild(bar);
  var list = document.createElement("div"); list.id = "libDownloadList";
  c.appendChild(list);
  renderDownloadList();
}

// ================================================================
// PLAYER CONTROLS
// ================================================================
var pcHideTimer = null, pcTapTimer = null, pcLastTap = 0, pcDragging = false;
var pcNextCancelled = false, pcIntroUsed = false, pcSeekTimers = {};
var PC_RATES = [1, 1.25, 1.5, 2, 0.75];
var PC_ICON_PLAY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>';
var PC_ICON_PAUSE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';

function pcVideo() { return document.getElementById("videoPlayer"); }
function pcOverlay() { return document.getElementById("pcOverlay"); }

function pcSchedHide() {
  if (pcHideTimer) clearTimeout(pcHideTimer);
  pcHideTimer = setTimeout(function() {
    var v = pcVideo();
    if (v && !v.paused && !pcDragging) pcOverlay().classList.remove("show");
  }, 3200);
}
function pcShow() { pcOverlay().classList.add("show"); pcSchedHide(); }

function pcReset() {
  pcNextCancelled = false; pcIntroUsed = false;
  var n = document.getElementById("pcNext"); if (n) n.classList.remove("on");
  var si = document.getElementById("pcSkipIntro"); if (si) si.classList.remove("on");
  var sk = document.getElementById("pcSeek"); if (sk) { sk.value = 0; sk.style.setProperty("--pos", "0%"); sk.style.setProperty("--buf", "0%"); }
  var cc = document.getElementById("pcCC"); if (cc) cc.style.display = "none";
  pcShow();
}

function pcFlash(side) {
  var el = document.getElementById(side === "L" ? "pcSeekL" : "pcSeekR");
  el.classList.add("on");
  if (pcSeekTimers[side]) clearTimeout(pcSeekTimers[side]);
  pcSeekTimers[side] = setTimeout(function() { el.classList.remove("on"); }, 600);
}

function pcSkip(d) {
  var v = pcVideo();
  if (!v) return;
  var dur = isFinite(v.duration) ? v.duration : Infinity;
  try { v.currentTime = Math.max(0, Math.min(dur - 0.5, v.currentTime + d)); } catch (e) {}
  pcFlash(d < 0 ? "L" : "R");
  pcShow();
}

function pcTogglePlay() {
  var v = pcVideo();
  if (!v) return;
  if (v.paused) v.play().catch(function() {}); else v.pause();
  pcShow();
}

function pcSkipIntro() {
  var v = pcVideo();
  if (!v) return;
  pcIntroUsed = true;
  document.getElementById("pcSkipIntro").classList.remove("on");
  var dur = isFinite(v.duration) ? v.duration : Infinity;
  try { v.currentTime = Math.min(dur - 5, v.currentTime + 90); } catch (e) {}
}

function pcCancelNext() { pcNextCancelled = true; document.getElementById("pcNext").classList.remove("on"); }

function pcCycleSpeed() {
  var v = pcVideo();
  var i = PC_RATES.indexOf(v.playbackRate);
  var r = PC_RATES[(i + 1) % PC_RATES.length];
  v.defaultPlaybackRate = r;
  v.playbackRate = r;
  document.getElementById("pcSpeed").textContent = r + "x";
  pcShow();
}

function pcToggleCC() {
  var v = pcVideo();
  var tracks = v.textTracks;
  if (!tracks || !tracks.length) return;
  var on = tracks[0].mode === "showing";
  for (var i = 0; i < tracks.length; i++) tracks[i].mode = on ? "disabled" : (i === 0 ? "showing" : "disabled");
  document.getElementById("pcCC").classList.toggle("on", !on);
  pcShow();
}

function pcFullscreen() {
  var w = document.getElementById("playerVideoWrap");
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (w.requestFullscreen) w.requestFullscreen().catch(function() {});
}

function pcUpdateTime() {
  var v = pcVideo();
  var dur = isFinite(v.duration) ? v.duration : 0;
  var cur = v.currentTime || 0;
  var sk = document.getElementById("pcSeek");
  if (!pcDragging && dur > 0) sk.value = Math.round(cur / dur * 1000);
  sk.style.setProperty("--pos", (dur > 0 ? cur / dur * 100 : 0) + "%");
  try {
    var b = v.buffered;
    var end = 0;
    for (var i = 0; i < b.length; i++) { if (b.start(i) <= cur + 0.5 && b.end(i) > end) end = b.end(i); }
    sk.style.setProperty("--buf", (dur > 0 ? end / dur * 100 : 0) + "%");
  } catch (e) {}
  document.getElementById("pcTime").textContent = fmtTime(cur) + " / " + fmtTime(dur);

  var isEp = currentEpisodeIndex >= 0;
  var si = document.getElementById("pcSkipIntro");
  si.classList.toggle("on", isEp && !pcIntroUsed && cur > 8 && cur < 180);

  var hasNext = isEp && currentEpisodeIndex < allEpisodes.length - 1;
  var rem = dur - cur;
  var nx = document.getElementById("pcNext");
  if (hasNext && !pcNextCancelled && dur > 60 && rem > 0 && rem <= 12) {
    document.getElementById("pcNextSec").textContent = Math.ceil(rem);
    nx.classList.add("on");
    si.classList.remove("on");
  } else { nx.classList.remove("on"); }
}

function pcInit() {
  var v = pcVideo();
  if (!v || v._pcInit) return;
  v._pcInit = true;
  var zone = document.getElementById("pcZone");
  var ov = pcOverlay();
  var playBtn = document.getElementById("pcPlay");
  playBtn.innerHTML = PC_ICON_PLAY;

  zone.addEventListener("click", function(e) {
    var r = zone.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    var now = Date.now();
    if (now - pcLastTap < 300 && (x < 0.4 || x > 0.6)) {
      clearTimeout(pcTapTimer); pcLastTap = 0;
      pcSkip(x < 0.5 ? -10 : 10);
      return;
    }
    pcLastTap = now;
    clearTimeout(pcTapTimer);
    pcTapTimer = setTimeout(function() {
      if (ov.classList.contains("show") && !v.paused) ov.classList.remove("show");
      else pcShow();
    }, 260);
  });

  var sk = document.getElementById("pcSeek");
  sk.addEventListener("input", function() {
    pcDragging = true;
    var dur = isFinite(v.duration) ? v.duration : 0;
    document.getElementById("pcTime").textContent = fmtTime(sk.value / 1000 * dur) + " / " + fmtTime(dur);
    sk.style.setProperty("--pos", (sk.value / 10) + "%");
    if (pcHideTimer) clearTimeout(pcHideTimer);
  });
  sk.addEventListener("change", function() {
    var dur = isFinite(v.duration) ? v.duration : 0;
    if (dur > 0) { try { v.currentTime = sk.value / 1000 * dur; } catch (e) {} }
    pcDragging = false;
    pcSchedHide();
  });

  v.addEventListener("play", function() { playBtn.innerHTML = PC_ICON_PAUSE; pcSchedHide(); });
  v.addEventListener("pause", function() { playBtn.innerHTML = PC_ICON_PLAY; ov.classList.add("show"); });
  v.addEventListener("ended", function() { playBtn.innerHTML = PC_ICON_PLAY; ov.classList.add("show"); });
  v.addEventListener("timeupdate", pcUpdateTime);
  v.addEventListener("progress", pcUpdateTime);
  v.addEventListener("waiting", function() { document.getElementById("pcSpin").classList.add("on"); });
  v.addEventListener("playing", function() { document.getElementById("pcSpin").classList.remove("on"); });
  v.addEventListener("canplay", function() { document.getElementById("pcSpin").classList.remove("on"); });
  v.addEventListener("loadstart", function() { document.getElementById("pcSpin").classList.add("on"); });
  v.addEventListener("loadedmetadata", function() {
    var has = v.textTracks && v.textTracks.length > 0;
    document.getElementById("pcCC").style.display = has ? "" : "none";
    pcUpdateTime();
  });

  if (!window.OmegaDL && document.getElementById("playerVideoWrap").requestFullscreen) document.getElementById("pcFs").style.display = "";

  document.addEventListener("keydown", function(e) {
    if (document.getElementById("playerPage").style.display !== "flex") return;
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || (tag === "input" && e.target.id !== "pcSeek")) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); pcTogglePlay(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); pcSkip(-10); }
    else if (e.key === "ArrowRight") { e.preventDefault(); pcSkip(10); }
    else if (e.key === "f") pcFullscreen();
  });
}

function registerServiceWorker() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(e) { console.log("[SW] register failed:", e && e.message); });
  });
  navigator.serviceWorker.addEventListener("message", function(ev) {
    if (ev.data && ev.data.type === "update-ready") {
      var playing = document.getElementById("playerPage").style.display === "flex";
      var busy = downloadQueue.some(function(d) { return d.status === "downloading"; });
      if (!playing && !busy && !window.__swReloaded) { window.__swReloaded = true; location.reload(); }
      else showToast("Update ready - reopen the app to get it", "info");
    }
  });
}

function init() {
  registerServiceWorker();
  renderVJBar();
  pcInit();
  loadQueue();
  idbPurgeOrphans();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  renderDownloadList();
  updateDownloadBadge();
  startAppPolling();
  resumeBgItems();
  bgCleanup();
  processDownloadQueue();
  renderCategoryTabs();
  loadHome();
  renderDownloadList();
  updateDownloadBadge();
  setTimeout(function() { document.getElementById("loadingOverlay").classList.add("hidden"); }, 800);
}

document.addEventListener("DOMContentLoaded", init);
document.addEventListener("keydown", function(e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute("role") === "button" && t.tagName !== "BUTTON") { e.preventDefault(); t.click(); }
});
</script>
