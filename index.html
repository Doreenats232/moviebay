<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>OmegaStream</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--primary:#00DC82;--primary-dark:#00B86B;--bg:#000;--surface:#0A0A0C;--card:#111114;--card-hover:#1A1D24;--text:#FFF;--text-2:rgba(255,255,255,0.7);--text-3:rgba(255,255,255,0.4);--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.1);--error:#FF4757;--warning:#FFA502;--radius:14px;--radius-sm:8px;--radius-pill:28px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;min-height:100vh;min-height:100svh}
::-webkit-scrollbar{display:none}
html{scrollbar-width:none}
img{-webkit-user-drag:none;user-select:none}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{outline:none;font-family:inherit}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
@keyframes kenBurns{0%{transform:scale(1)}100%{transform:scale(1.05)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#statusBar{position:fixed;top:0;left:0;right:0;z-index:10001;background:rgba(0,220,130,0.95);color:#000;font-size:13px;font-weight:600;text-align:center;padding:10px 16px;transform:translateY(-100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
#statusBar.show{transform:translateY(0)}
#statusBar.error{background:rgba(220,50,50,0.95);color:#fff}
#statusBar.warning{background:rgba(255,165,2,0.95);color:#000}
#toastContainer{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10002;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{background:rgba(20,20,24,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn 0.3s ease;pointer-events:auto}
.toast.hiding{animation:toastOut 0.3s ease forwards}
.toast-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:800}
.toast-icon.success{background:rgba(0,220,130,0.2);color:var(--primary)}
.toast-icon.error{background:rgba(255,71,87,0.2);color:var(--error)}
.toast-icon.info{background:rgba(255,165,2,0.2);color:var(--warning)}
#loadingOverlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.4s ease}
#loadingOverlay.hidden{opacity:0;pointer-events:none}
.loader-logo{font-size:32px;font-weight:800;color:var(--primary);letter-spacing:-1px}
.loader-logo span{color:var(--text)}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite}
#loadingOverlay p{color:var(--text-3);font-size:13px;animation:pulse 1.5s infinite}
.header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:14px 18px;display:flex;align-items:center;gap:12px}
.header-logo{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-0.5px}
.header-logo span{color:var(--text)}
.header-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border:none;border-radius:50%;background:var(--glass);color:var(--text);font-size:17px;display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.15s}
.icon-btn:active{background:rgba(255,255,255,0.15);transform:scale(0.92)}
#searchBar{display:none;padding:0 18px 14px;background:rgba(0,0,0,0.85);position:relative}
#searchBar.active{display:block;animation:fadeIn 0.2s ease}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .search-icon{position:absolute;left:14px;color:var(--text-3);font-size:16px;pointer-events:none}
#searchInput{width:100%;padding:13px 16px 13px 42px;border:1px solid var(--glass-border);border-radius:var(--radius);background:rgba(255,255,255,0.06);color:var(--text);font-size:15px;transition:border-color 0.2s,background 0.2s}
#searchInput::placeholder{color:var(--text-3)}
#searchInput:focus{border-color:var(--primary);background:rgba(255,255,255,0.08)}
#searchSuggestions{display:none;position:absolute;top:100%;left:18px;right:18px;background:rgba(18,18,22,0.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);z-index:200;max-height:380px;overflow-y:auto;margin-top:4px;animation:slideDown 0.15s ease}
#searchSuggestions.show{display:block}
.suggestion-item{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.04)}
.suggestion-item:active{background:rgba(255,255,255,0.08)}
.suggestion-name{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggestion-name mark{background:rgba(0,220,130,0.3);color:var(--primary);border-radius:2px}
.suggestion-meta{font-size:11px;color:var(--text-3);flex-shrink:0;margin-left:12px}
.suggestion-all{padding:14px 16px;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;text-align:center;border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,220,130,0.03)}
.suggestion-all:active{background:rgba(0,220,130,0.08)}
.suggestion-fuzzy{font-size:10px;color:var(--warning);margin-left:8px;font-weight:600}
.category-tabs{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;scrollbar-width:none}
.category-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:9px 20px;border:none;border-radius:var(--radius-pill);background:rgba(255,255,255,0.07);color:var(--text-2);font-size:13px;font-weight:600;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);white-space:nowrap}
.cat-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 16px rgba(0,220,130,0.3)}
.cat-tab:active{transform:scale(0.95)}
.cat-tab-sep{flex-shrink:0;width:1px;background:rgba(255,255,255,0.1);margin:6px 4px}
.hero-carousel{position:relative;width:100%;height:440px;overflow:hidden;border-radius:0 0 28px 28px}
.hero-slides{position:relative;width:100%;height:100%}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 0.8s ease;cursor:pointer}
.hero-slide.active{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-slide.active img{animation:kenBurns 8s ease-in-out infinite alternate}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.7) 70%,rgba(0,0,0,0.97) 100%)}
.hero-glow-l,.hero-glow-r{position:absolute;top:10%;bottom:10%;width:70px;pointer-events:none;z-index:2}
.hero-glow-l{left:-15px;background:radial-gradient(ellipse,rgba(0,220,130,0.18),transparent);filter:blur(20px)}
.hero-glow-r{right:-15px;background:radial-gradient(ellipse,rgba(0,220,130,0.18),transparent);filter:blur(20px)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:20px 20px 42px;z-index:5}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:var(--primary);color:#000;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.8px}
.hero-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px;line-height:1.2}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.hero-meta span{font-size:13px;font-weight:600;color:var(--text-2)}
.hero-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.hero-desc{font-size:13px;line-height:1.5;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px;max-width:500px}
.hero-actions{display:flex;gap:10px}
.hero-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);cursor:pointer;transition:all 0.3s;border:0;padding:0}
.hero-dot.active{background:var(--primary);width:24px;border-radius:4px}
.btn-primary{padding:13px 28px;border:none;border-radius:var(--radius-pill);background:var(--primary);color:#000;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;transition:all 0.2s}
.btn-primary:active{transform:scale(0.95);opacity:0.9}
.btn-secondary{padding:13px 28px;border:1px solid var(--glass-border);border-radius:var(--radius-pill);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;transition:all 0.2s}
.btn-secondary:active{transform:scale(0.95);background:rgba(255,255,255,0.12)}
.section{padding:12px 0 20px;animation:fadeInUp 0.3s ease}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px}
.section-title{font-size:18px;font-weight:700}
.poster-scroll{display:flex;gap:12px;padding:4px 18px 8px;overflow-x:auto;scrollbar-width:none}
.poster-scroll::-webkit-scrollbar{display:none}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px;padding:4px 18px 8px}
.poster-card{flex-shrink:0;width:132px;cursor:pointer;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1)}
.poster-card:active{transform:scale(0.94)}
.poster-grid .poster-card{width:100%}
.poster-img-wrap{position:relative;width:100%;aspect-ratio:0.675;border-radius:var(--radius);overflow:hidden;background:var(--card)}
.poster-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s ease}
.poster-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--primary);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.poster-quality{position:absolute;top:6px;left:6px;background:rgba(0,220,130,0.9);color:#000;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px}
.poster-name{margin-top:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster-sub{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-card{flex-shrink:0;width:180px;cursor:pointer}
.continue-img-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--card)}
.continue-img-wrap img{width:100%;height:100%;object-fit:cover}
.continue-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--primary);border-radius:0 2px 0 0}
.continue-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,220,130,0.85);display:flex;align-items:center;justify-content:center}
.continue-info{margin-top:8px}
.continue-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-ep{font-size:11px;color:var(--text-3);margin-top:2px}
.continue-remove{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);color:var(--text-2);font-size:11px;display:flex;align-items:center;justify-content:center}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.03) 0%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.03) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
.skeleton-poster{width:132px;height:190px;border-radius:var(--radius);flex-shrink:0}
.skeleton-hero{width:100%;height:440px;border-radius:0 0 28px 28px}
.skeleton-row{display:flex;gap:12px;padding:4px 18px}
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px;padding:4px 18px 8px}
.skeleton-grid .skeleton{width:100%;aspect-ratio:2/3;border-radius:var(--radius)}
.skeleton-title{height:18px;width:140px;margin:14px 18px 10px;border-radius:6px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[role=button]:focus:not(:focus-visible){outline:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.error-state{text-align:center;padding:32px 20px}
.error-state .error-icon{font-size:36px;margin-bottom:12px}
.error-state p{color:var(--text-3);margin-bottom:16px;font-size:14px}
.retry-btn{padding:10px 24px;border:none;border-radius:var(--radius-pill);background:var(--primary);color:#000;font-size:14px;font-weight:700}
.load-sentinel{width:100%;padding:20px;text-align:center}
.load-sentinel .spinner{margin:0 auto}
.empty-state{text-align:center;padding:48px 20px}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-state p{color:var(--text-3);font-size:14px}
#detailPage{display:none;min-height:100vh;min-height:100svh}
.detail-hero{position:relative;width:100%;height:420px;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero-gradient{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(transparent,rgba(0,0,0,0.98))}
.detail-top-btns{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:10}
.detail-top-btn{width:44px;height:44px;border:none;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center}
.detail-info{padding:0 20px 32px;margin-top:-80px;position:relative;z-index:5}
.detail-logo{max-height:80px;max-width:65%;object-fit:contain;object-position:left bottom;margin-bottom:14px}
.detail-title-text{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px}
.detail-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.detail-meta-item{font-size:14px;font-weight:600;color:var(--text-2)}
.detail-badge{padding:3px 9px;border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:11px;font-weight:700;color:var(--text-2)}
.detail-imdb{background:#F5C518;color:#000;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:800}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.detail-tag{padding:5px 12px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2)}
.detail-tag.vj-tag{background:rgba(0,220,130,0.1);border-color:rgba(0,220,130,0.2);color:var(--primary)}
.detail-desc{font-size:15px;line-height:1.65;color:var(--text-2);margin-bottom:22px}
.detail-actions{display:flex;gap:10px;margin-bottom:24px}
.detail-actions .btn-primary{flex:1;max-width:260px;justify-content:center}
.action-circle-btn{width:52px;height:52px;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.action-circle-btn:active{transform:scale(0.9)}
.action-circle-btn.active{background:rgba(255,71,87,0.15)!important;border-color:rgba(255,71,87,0.3)!important;color:var(--error)!important}
.sub-section-title{font-size:16px;font-weight:700;margin-bottom:12px}
.stream-option{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius);background:rgba(255,255,255,0.04);border:1px solid transparent;margin-bottom:8px;cursor:pointer;transition:all 0.2s}
.stream-option:active{background:rgba(255,255,255,0.08)}
.stream-option.active{background:rgba(0,220,130,0.08);border-color:rgba(0,220,130,0.25)}
.stream-icon-wrap{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:16px}
.stream-option.active .stream-icon-wrap{background:rgba(0,220,130,0.15)}
.stream-info{flex:1;min-width:0}
.stream-name{font-size:14px;font-weight:600}
.stream-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.stream-speed{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px}
.stream-speed.fast{background:rgba(0,220,130,0.15);color:var(--primary)}
.stream-speed.normal{background:rgba(255,165,2,0.15);color:var(--warning)}
.season-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.season-tabs::-webkit-scrollbar{display:none}
.season-tab{flex-shrink:0;padding:8px 18px;border:none;border-radius:var(--radius-pill);background:rgba(255,255,255,0.07);color:var(--text-2);font-size:13px;font-weight:600;transition:all 0.25s;white-space:nowrap}
.season-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 12px rgba(0,220,130,0.25)}
.episode-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:rgba(255,255,255,0.03);margin-bottom:6px;cursor:pointer;transition:all 0.2s}
.episode-item:active{background:rgba(255,255,255,0.08)}
.episode-item.playing{background:rgba(0,220,130,0.1);border:1px solid rgba(0,220,130,0.2)}
.ep-num{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.episode-item.playing .ep-num{background:var(--primary);color:#000}
.ep-info{flex:1;min-width:0}
.ep-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-date{font-size:12px;color:var(--text-3);margin-top:2px}
.ep-play-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#playerPage{display:none;height:100vh;height:100svh;flex-direction:column;background:var(--bg)}
#playerPage.active{display:flex}
.player-video-wrap{flex-shrink:0;width:100%;background:#000;position:relative}
.player-video-wrap video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.player-video-topbar{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);z-index:10;opacity:0;transition:opacity 0.3s}
.player-video-wrap:hover .player-video-topbar{opacity:1}
.player-back-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:120px}
.player-info-bar{padding:16px 18px 0}
.player-title-main{font-size:18px;font-weight:700;margin-bottom:4px}
.player-title-sub{font-size:13px;color:var(--text-3);margin-bottom:14px}
.player-action-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.player-act-btn{padding:9px 16px;border:1px solid var(--glass-border);border-radius:var(--radius-pill);background:var(--glass);color:var(--text);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.player-act-btn:active{background:rgba(255,255,255,0.1)}

// ================================================================
// CACHE LAYER
// ================================================================
var memCache = {};
function cacheGet(key) {
  if (memCache[key] && memCache[key].exp > Date.now()) return memCache[key].d;
  try { var s = localStorage.getItem("os_" + key); if (s) { var p = JSON.parse(s); if (p && p.exp > Date.now()) { memCache[key] = p; return p.d; } } } catch (e) {}
  return null;
}
function cacheSet(key, data, ttl) {
  var entry = { d: data, exp: Date.now() + (ttl || 300000) };
  memCache[key] = entry;
  try { localStorage.setItem("os_" + key, JSON.stringify(entry)); } catch (e) {}
}

// ================================================================
// FETCH WITH RETRY
// ================================================================
function fetchJson(url, retries) {
  retries = retries || 3;
  return new Promise(function(resolve, reject) {
    var cached = cacheGet(url);
    if (cached) { resolve(cached); return; }
    function attempt(remaining, delay) {
      setTimeout(function() {
        fetch(url).then(function(resp) {
          if (resp.status === 429) {
            if (remaining > 0) { showStatus("Rate limited, retrying...", "warning"); attempt(remaining - 1, delay * 2); }
            else reject(new Error("Rate limited"));
            return;
          }
          if (!resp.ok) { if (remaining > 0) attempt(remaining - 1, delay * 2); else reject(new Error("HTTP " + resp.status)); return; }
          return resp.json();
        }).then(function(data) { if (data) { cacheSet(url, data, 300000); resolve(data); } })
        .catch(function(err) { if (remaining > 0) attempt(remaining - 1, delay * 2); else reject(err); });
      }, delay);
    }
    attempt(retries, 1000);
  });
}

// ================================================================
// URL UTILITIES
// ================================================================
function stripDownloadParam(url) {
  if (!url) return url;
  return url.replace(/[?&]download=\d+/gi, "").replace(/\?$/, "").replace(/\?&/, "?");
}

function resolveStreamUrl(rawUrl) {
  if (!rawUrl) return rawUrl;
  rawUrl = stripDownloadParam(rawUrl);
  if (rawUrl.indexOf(".m3u8") !== -1 || rawUrl.indexOf("/stream/hls/") !== -1) return rawUrl;
  if (rawUrl.indexOf("cdn.zflixtv.com") !== -1) return rawUrl;
  if (rawUrl.indexOf(".mp4") !== -1 && rawUrl.indexOf("s-u.in") === -1) return rawUrl;
  if (rawUrl.indexOf("s-u.in") !== -1) return VIDEO_PROXY + encodeURIComponent(rawUrl);
  return rawUrl;
}

function getDownloadableUrl(rawUrl) {
  if (!rawUrl) return null;
  rawUrl = stripDownloadParam(rawUrl);
  if (rawUrl.indexOf(".m3u8") !== -1 || rawUrl.indexOf("/stream/hls/") !== -1) return null;
  if (rawUrl.indexOf("s-u.in") !== -1) return VIDEO_PROXY + encodeURIComponent(rawUrl);
  return rawUrl;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escJs(s) {
  return esc(String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}

function sanitizeFilename(name) {
  if (!name) return "video";
  return String(name).replace(/[<>:"/\\|?*\x00-\x1f]/g, "").replace(/\s+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "").substring(0, 120) || "video";
}

// ================================================================

function showToast(msg, type) {
  var container = document.getElementById("toastContainer");

  container.appendChild(toast);
  setTimeout(function() { toast.classList.add("hiding"); setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300); }, 2800);
}

function addToGlobalPool(items) {

// ================================================================
// VJ EXTRACTION AND GROUPING
// ================================================================
function extractVJName(stream) {
  if (stream.vj && String(stream.vj).trim()) return String(stream.vj).trim();
  if (stream.vjName && String(stream.vjName).trim()) return String(stream.vjName).trim();
  if (stream.translator && String(stream.translator).trim()) return String(stream.translator).trim();
  var name = String(stream.name || stream.title || stream.sourceName || "");
  if (!name) return "Original";
  var sepPatterns = ["|", " - ", " -- ", " : ", " // ", " >> "];
  for (var i = 0; i < sepPatterns.length; i++) {
    var idx = name.indexOf(sepPatterns[i]);
    if (idx > 0) {
      var before = name.substring(0, idx).trim();
      if (before && /[a-zA-Z]/.test(before) && !/^\d{3,4}p$/i.test(before)) return before;
    }
  }
  var cleaned = name.replace(/\b(\d{3,4}p|HD|FHD|UHD|4K|SD|HQ|LQ|CAM|HDCAM|HDRip|BluRay|WEB-DL|WEBRip|H\.?26[45]|x26[45]|AAC|MP3|AC3)\b/gi, "").trim();
  cleaned = cleaned.replace(/^[\s\-|:\/]+|[\s\-|:\/]+$/g, "").trim();
  if (cleaned && cleaned.length > 1 && /[a-zA-Z]/.test(cleaned)) {
    if (/^\d{3,4}p$/i.test(cleaned) || /^(HD|FHD|UHD|4K|SD)$/i.test(cleaned)) return "Original";
    return cleaned;
  }
  return "Original";
}

function groupStreamsByVJ(streams) {
  if (!streams || streams.length < 2) return [];
  var groups = {};
  var order = [];
  streams.forEach(function(s, idx) {
    var vjName = extractVJName(s);
    if (!groups[vjName]) {
      groups[vjName] = { name: vjName, streams: [], globalIndices: [] };
      order.push(vjName);
    }
    groups[vjName].streams.push(s);
    groups[vjName].globalIndices.push(idx);
  });
  var result = order.map(function(name) { return groups[name]; });
  if (result.length <= 1) return [];
  return result;
}

function getBestStreamForVJ(vjGroup) {
  if (!vjGroup || !vjGroup.streams.length) return null;
  var best = vjGroup.streams[0];
  var bestIdx = vjGroup.globalIndices[0];
  for (var i = 0; i < vjGroup.streams.length; i++) {
    var s = vjGroup.streams[i];
    var name = String(s.name || s.title || "").toLowerCase();
    if (name.indexOf("1080") !== -1 || name.indexOf("fhd") !== -1) { best = s; bestIdx = vjGroup.globalIndices[i]; break; }
    if (name.indexOf("720") !== -1 || name.indexOf("hd") !== -1) { best = s; bestIdx = vjGroup.globalIndices[i]; }
  }
  return { stream: best, globalIndex: bestIdx };
}

// ================================================================

function formatBytes(bytes) {
  if (!bytes) return "0 B";

        herr.status = response.status;
        response.text().then(function(t) {
          t = (t || "").substring(0, 300);

          var detail = t;
          try { var j = JSON.parse(t); if (j && j.error) detail = String(j.error); } catch (e) {}
          if (response.status === 400 && /Missing url parameter/i.test(t) && url.indexOf("/dl?") !== -1) {

          if (!saveBlobToDownloads(blob, fileName)) { reject(new Error("Could not save file.")); return; }

      free(); // other queued items can start while this one runs in the background
      return bgTrack(item, st);
    }, function(err) { fallback(err && err.message); });
  });
}

// after a reload / reopen: pick the background downloads back up
function resumeBgItems() {
  if (!bgSupported()) return;
  downloadQueue.forEach(function(it) {
    if (it.status === "downloading" && it.bgId && !activeDl[it.id]) {
      var st = activeDl[it.id] = { ctl: null, paused: false, cancelled: false, wake: null, bg: true };
      bgTrack(it, st);
    }
  });
}

function bgCleanup() {
  if (!("caches" in window) || !("serviceWorker" in navigator) || location.protocol === "file:") return;
  bgReady().then(function(reg) {
    return caches.open(BG_CACHE).then(function(c) {
      return c.keys().then(function(keys) {
        keys.forEach(function(k) {
          var keep = downloadQueue.some(function(d) { return d.bgId && bgKey(reg, d.bgId) === k.url && !(d.status === "done" && Date.now() - (d.bgDoneAt || 0) > 600000); });
          if (!keep) c.delete(k);
        });
      });
    });
  }).catch(function() {});
}

// failed downloads that are worth another go retry by themselves (e.g. after a reload or when the network is back)
function kickRetries() {
  if (navigator.onLine === false) return;
  var now = Date.now(), any = false;
  downloadQueue.forEach(function(it) {
    if (it.status === "error" && it.retry && (it.autoTries || 0) < 8 && now >= (it.retryAt || 0)) {
      it.autoTries = (it.autoTries || 0) + 1; it.status = "queued"; it.errorMsg = ""; it.message = "Retrying..."; any = true;
    }
  });
  if (any) { renderDownloadList(); updateDownloadBadge(); processDownloadQueue(); }
}
setInterval(kickRetries, 8000);
window.addEventListener("online", function() { setTimeout(function() { kickActive(); kickRetries(); }, 1000); });
document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "hidden") {
    // write what we have to disk so a killed tab resumes from the saved byte
    Object.keys(dlFlush).forEach(function(k) { try { dlFlush[k]().catch(function() {}); } catch (e) {} });
    saveQueueNow();
  } else { kickActive(); kickRetries(); if (window.OmegaDL) { startAppPolling(); pollAppDownloads(); } }
});
window.addEventListener("pageshow", function() { kickActive(); kickRetries(); });
function kickActive() {
  Object.keys(activeDl).forEach(function(k) {
    var st = activeDl[k];
    if (!st || st.bg || st.paused || st.cancelled) return;
    if (st.wake) { st.wake(); return; }
    if (st.inFlight && st.ctl && Date.now() - (st.lastByte || 0) > 3000) { st.lastByte = Date.now(); try { st.ctl.abort(); } catch (e) {} }
  });
}

// --- user actions ---
function findDl(id) {
  for (var i = 0; i < downloadQueue.length; i++) { if (downloadQueue[i].id === id) return downloadQueue[i]; }
  return null;
}
function dlAction(id, act) {
  var it = findDl(id);
  if (!it) return;
  if (act === "pause") pauseDownload(it);
  else if (act === "resume") resumeDownload(it);
  else if (act === "cancel") cancelDownload(it);
  else if (act === "restart") restartDeviceDownload(it);
}
function restartDeviceDownload(it) {
  if (!it.dmId) return;
  try { window.OmegaDL.cancel(it.dmId); } catch (e) {}
  it.dmId = ""; it.status = "queued"; it.receivedBytes = 0; it.progress = 0; it.message = "Restarting...";
  renderDownloadList(); updateDownloadBadge(); processDownloadQueue();
}
function pauseDownload(it) {
  var st = activeDl[it.id];
  if (st) { st.paused = true; if (st.ctl) st.ctl.abort(); if (st.wake) st.wake(); }
  else if (it.status === "queued") { it.status = "paused"; it.userPaused = true; it.message = "Paused"; }
  renderDownloadList(); updateDownloadBadge();
}
function resumeDownload(it) {
  if (it.status !== "paused" && it.status !== "error") return;
  it.userPaused = false; it.autoTries = 0;
  if (it.bgId && bgSupported() && !activeDl[it.id]) {
    it.status = "downloading"; it.errorMsg = ""; it.message = "Saving...";
    var bst = activeDl[it.id] = { ctl: null, paused: false, cancelled: false, wake: null, bg: true };
    renderDownloadList(); updateDownloadBadge(); bgTrack(it, bst);
    return;
  }
  it.status = "queued"; it.errorMsg = ""; it.message = "Waiting";
  renderDownloadList(); updateDownloadBadge();
  processDownloadQueue();
}
function cancelDownload(it) {
  var st = activeDl[it.id];
  if (st) { st.cancelled = true; if (st.ctl) st.ctl.abort(); if (st.wake) st.wake(); }
  if (it.bgId) bgDrop(it);
  // only stop a device download that is still running - never delete a finished file
  if (it.dmId && (it.status === "downloading" || it.status === "queued") && window.OmegaDL && typeof window.OmegaDL.cancel === "function") {
    try { window.OmegaDL.cancel(it.dmId); } catch (e) {}
  }
  if (!it.dmId) idbClear(it.id);
  downloadQueue = downloadQueue.filter(function(x) { return x !== it; });
  renderDownloadList(); updateDownloadBadge();
}
function dlActionsHtml(item) {
  var id = escJs(item.id), b = "";
  function btn(act, label, cls) { return '<button class="dl-act' + (cls ? " " + cls : "") + '" onclick="dlAction(\'' + id + '\',\'' + act + '\')">' + label + '</button>'; }
  if (item.status === "downloading") { if (!item.dmId && !item.bgId) b += btn("pause", "Pause"); if (item.dmId) b += btn("restart", "Restart"); b += btn("cancel", "Cancel", "danger"); }
  else if (item.status === "queued") b += btn("cancel", "Cancel", "danger");
  else if (item.status === "paused") b += btn("resume", "Resume") + btn("cancel", "Cancel", "danger");
  else if (item.status === "error") b += btn("resume", "Retry") + btn("cancel", "Remove", "danger");
  else if (item.status === "done") b += btn("cancel", "Remove", "danger");
  return b ? '<div class="dl-actions">' + b + '</div>' : "";
}

// --- SMART DOWNLOAD: worker re-creates the stream link and downloads it in ONE request.
// Needed because stream links are locked to the IP that created them (ip-mismatch).
function buildSmartDownloadUrl(item) {
  if (!item) return null;
  var api = item.apiUrl;
  if (!api && item.type === "episode" && item.seriesId) api = API_BASE + "/stream/series/" + item.seriesId + ":" + item.season + ":" + item.episode + ".json";
  if (!api) return null;
  return WORKER_BASE + "/dl?api=" + encodeURIComponent(api) + "&vj=" + encodeURIComponent(item.vjName || "") + "&sig=" + encodeURIComponent(item.sig || "") + "&name=" + encodeURIComponent(item.fileName || "video.mp4");
}

// --- NATIVE FALLBACK: plain navigation download (no Origin header, unlike fetch) ---
function openNativeDownload(dlUrl, fileName) {
  var u = dlUrl;
  if (u.indexOf(WORKER_BASE) === 0) u += (u.indexOf("?") !== -1 ? "&" : "?") + "dl=1&fn=" + encodeURIComponent(fileName);
  var a = document.createElement("a");
  a.href = u; a.download = fileName; a.target = "_blank"; a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
}

// --- QUEUE MANAGEMENT ---
function addToDownloadQueue(dlItem, fileName) {
  var id = dlItem.itemId || ("dl_" + Date.now());
  var key = dlItem.key || ((dlItem.type === "episode" && dlItem.seriesId) ? "ep:" + dlItem.seriesId + ":" + dlItem.season + ":" + dlItem.episode : "");
  for (var i = 0; i < downloadQueue.length; i++) {
    var q = downloadQueue[i];
    if ((key && q.key === key) || q.id === id) {
      if (q.status === "done") showToast("Already downloaded. Remove it from the list to download it again.", "info");
      else showToast("Already in your downloads", "info");
      return false;
    }
  }
  downloadQueue.push({
    id: id, key: key, fileName: fileName,
    type: dlItem.type || "direct",
    directUrl: dlItem.directUrl || null,
    seriesId: dlItem.seriesId || null,
    season: dlItem.season || 0, episode: dlItem.episode || 0,
    vjName: dlItem.vjName || "",
    apiUrl: dlItem.apiUrl || "", sig: dlItem.sig || "",
    status: "queued", progress: 0, receivedBytes: 0, totalBytes: 0,
    errorMsg: "", saveLocation: "Downloads/" + fileName
  });
  updateDownloadBadge();
  renderDownloadList();
  showToast("Queued: " + fileName, "success");
  return true;
}

function getBestDownloadUrl(stream) {
  if (!stream) return null;
  if (stream.downloadUrl) {
    var du = stripDownloadParam(stream.downloadUrl);
    if (du.indexOf(".m3u8") === -1 && du.indexOf("/stream/hls/") === -1) return du;
  }
  if (stream.fallbackUrl) {
    var fu = stripDownloadParam(stream.fallbackUrl);
    if (fu.indexOf(".m3u8") === -1 && fu.indexOf("/stream/hls/") === -1) return fu;
  }
  if (stream.url) {
    var u = stripDownloadParam(stream.url);
    if (u.indexOf(".m3u8") === -1 && u.indexOf("/stream/hls/") === -1) return u;
  }
  return null;
}

function processDownloadQueue() {
  if (isProcessingQueue) return;
  var nextItem = null;
  for (var i = 0; i < downloadQueue.length; i++) {
    if (downloadQueue[i].status === "queued") { nextItem = downloadQueue[i]; break; }
  }
  if (!nextItem) { isProcessingQueue = false; updateDownloadBadge(); return; }
  isProcessingQueue = true;

  function doDownload(rawUrl) {
    if (!rawUrl) {
      nextItem.status = "error";
      nextItem.errorMsg = "No downloadable URL (HLS-only).";
      renderDownloadList(); isProcessingQueue = false; updateDownloadBadge(); processDownloadQueue();
      return;
    }
    var dlUrl = getDownloadableUrl(rawUrl);
    if (!dlUrl) {
      nextItem.status = "error";
      nextItem.errorMsg = "HLS cannot be downloaded. Pick MP4 stream.";
      renderDownloadList(); isProcessingQueue = false; updateDownloadBadge(); processDownloadQueue();
      return;
    }

    var smartUrl = buildSmartDownloadUrl(nextItem);
    if (smartUrl) dlUrl = smartUrl;

    // Show save location BEFORE download starts
    var saveLoc = "Downloads/" + nextItem.fileName;
    nextItem.status = "downloading";
    nextItem.saveLocation = saveLoc;
    nextItem.message = "Preparing...";
    renderDownloadList();

    if (window.OmegaDL && typeof window.OmegaDL.start === "function") {
      // ANDROID APP: hand over to the system DownloadManager and track it by id
      var dmId = "-1";
      try { dmId = String(window.OmegaDL.start(dlUrl, nextItem.fileName)); } catch (e) {}
      if (dmId && dmId !== "-1") {
        nextItem.dmId = dmId; nextItem.status = "downloading"; nextItem.message = "Starting..."; nextItem.progress = 0;
        renderDownloadList(); startAppPolling();
      } else {
        nextItem.status = "error"; nextItem.errorMsg = "Could not start the download - retrying automatically"; nextItem.retry = true; nextItem.retryAt = Date.now() + 8000;
        renderDownloadList();
      }
      isProcessingQueue = false; updateDownloadBadge(); processDownloadQueue();
      return;
    }
    if (window.OmegaDL) {
      // older APK bridge: fire and forget
      var triggered = triggerSystemDownload(rawUrl, nextItem.fileName, smartUrl);
      if (triggered) {
        nextItem.status = "done"; nextItem.progress = 100;
        nextItem.message = "Saving to " + saveLoc + " - check notifications";
        renderDownloadList();
        showToast("Download started! Saving to " + saveLoc, "success");
        isProcessingQueue = false; updateDownloadBadge(); processDownloadQueue();
        return;
      }
    }
    doBrowserDownload(dlUrl);
  }

  function doBrowserDownload(dlUrl) {
    var item = nextItem;
    if (bgSupported() && !item.noBg) { doBgDownload(item, dlUrl); return; }
    var st = activeDl[item.id] = { ctl: null, paused: false, cancelled: false, wake: null };
    var attempt = 0, lastPaint = 0, MAX_AUTO = 6;
    item.status = "downloading"; item.errorMsg = "";
    renderDownloadList();

    function release() { clearInterval(st.watch); delete activeDl[item.id]; delete dlFlush[item.id]; isProcessingQueue = false; updateDownloadBadge(); processDownloadQueue(); }
    function pctText() { return item.totalBytes > 0 ? Math.min(99, item.receivedBytes / item.totalBytes * 100).toFixed(0) + "%" : formatBytes(item.receivedBytes); }
    function markPaused() { item.status = "paused"; item.userPaused = true; item.message = "Paused at " + pctText(); renderDownloadList(); release(); }

    function run() {
      if (st.cancelled) { release(); return; }
      if (st.paused) { markPaused(); return; }
      st.ctl = (typeof AbortController !== "undefined") ? new AbortController() : { abort: function() {}, signal: undefined };
      item.message = attempt ? "Resuming..." : (item.receivedBytes > 0 ? "Resuming from " + pctText() : "Preparing...");
      renderDownloadList();
      st.inFlight = true; st.lastByte = Date.now();
      resumableDownload(item, dlUrl, function(received, total) {
        attempt = 0; st.lastByte = Date.now();
        item.receivedBytes = received;
        if (total) item.totalBytes = total;
        item.progress = total > 0 ? Math.min(99, received / total * 100) : 0;
        item.message = "Downloading " + (total > 0 ? item.progress.toFixed(1) + "%" : formatBytes(received));
        var now = Date.now();
        if (now - lastPaint > 500) { lastPaint = now; renderDownloadList(); }
      }, st.ctl.signal).then(function(result) {
        st.inFlight = false;
        item.status = "done"; item.progress = 100; item.receivedBytes = result.size; item.totalBytes = result.size;
        item.message = "Saved to " + (item.saveLocation || "Downloads/");
        renderDownloadList();
        showToast("Downloaded! " + formatBytes(result.size) + " saved to " + (item.saveLocation || "Downloads/"), "success");
        release();
      }).catch(function(err) {
        err = err || new Error("Unknown error");
        st.inFlight = false;
        if (st.cancelled) { release(); return; }
        if (st.paused) { markPaused(); return; }
        console.log("[Download] Error:", err.message);
        if (isRetryableDownloadError(err) && attempt < MAX_AUTO) {
          attempt++;
          var wait = Math.min(30, Math.pow(2, attempt));
          item.message = navigator.onLine === false ? "Offline - will continue when you reconnect" : "Connection lost - retrying in " + wait + "s (" + attempt + "/" + MAX_AUTO + ")";
          renderDownloadList();
          dlWait(wait, st).then(run);
          return;
        }
        item.status = "error";
        item.errorMsg = (err.message || "Failed") + (item.receivedBytes > 0 && item.totalBytes > 0 ? " - continues from " + pctText() : "");
        if (isRetryableDownloadError(err)) { item.retry = true; item.retryAt = Date.now() + 30000; item.errorMsg += " (retrying automatically)"; }
        renderDownloadList();
        showToast("Download failed: " + (err.message || "unknown"), "error");
        release();
      });
    }
    // dead-connection watchdog: phones silently drop sockets in the background; reconnect and continue from the saved byte
    st.watch = setInterval(function() {
      if (st.inFlight && !st.paused && !st.cancelled && document.visibilityState === "visible" && st.ctl && Date.now() - st.lastByte > 25000) {
        st.lastByte = Date.now();
        try { st.ctl.abort(); } catch (e) {}
      }
    }, 5000);
    run();
  }

  // Get the raw URL
  if (nextItem.directUrl) {
    doDownload(nextItem.directUrl);
  } else if (nextItem.type === "episode" && nextItem.seriesId) {
    showStatus("Fetching stream for " + nextItem.fileName + "...");
    var streamApiUrl = PROXY_URL + encodeURIComponent(API_BASE + "/stream/series/" + nextItem.seriesId + ":" + nextItem.season + ":" + nextItem.episode + ".json");
    fetchJson(streamApiUrl, 2).then(function(data) {
      hideStatus();
      var streams = data && data.streams ? data.streams : [];
      if (!streams.length) {
        nextItem.status = "error"; nextItem.errorMsg = "No streams for this episode";
        renderDownloadList(); isProcessingQueue = false; processDownloadQueue(); return;
      }
      var bestUrl = null;
      if (nextItem.vjName) {
        for (var s = 0; s < streams.length; s++) {
          if (extractVJName(streams[s]) === nextItem.vjName) { bestUrl = getBestDownloadUrl(streams[s]); break; }
        }
      }
      if (!bestUrl) bestUrl = getBestDownloadUrl(streams[0]);
      doDownload(bestUrl);
    }).catch(function(err) {
      hideStatus(); nextItem.status = "error"; nextItem.errorMsg = err.message;
      renderDownloadList(); isProcessingQueue = false; processDownloadQueue();
    });
  } else {
    nextItem.status = "error"; nextItem.errorMsg = "No download URL";
    renderDownloadList(); isProcessingQueue = false; processDownloadQueue();
  }
}

function updateDownloadBadge() {
  var active = 0;
  for (var i = 0; i < downloadQueue.length; i++) {
    if (downloadQueue[i].status === "queued" || downloadQueue[i].status === "downloading") active++;
  }
  var nb = document.getElementById("navDlBadge");
  if (nb) { nb.style.display = active > 0 ? "flex" : "none"; nb.textContent = active; }
}

function renderDownloadList() {
  var container = document.getElementById("downloadList");
  if (!container) return;
  var libList = document.getElementById("libDownloadList");
  if (!downloadQueue.length) {
    container.innerHTML = '<div class="empty-state"><p>No downloads yet</p></div>';
    if (libList) libList.innerHTML = '<div class="empty-state"><p>No downloads yet</p></div>';
    saveQueue();
    return;
  }
  var html = "";
  for (var i = downloadQueue.length - 1; i >= 0; i--) {
    var item = downloadQueue[i];
    var statusText = ""; var iconClass = item.status; var iconChar = "";
    if (item.status === "queued") { statusText = "Waiting"; iconChar = "&#8987;"; }
    else if (item.status === "downloading") {
      statusText = item.message || ("Downloading " + (item.progress || 0).toFixed(1) + "%");
      iconChar = "&#8595;";
    }
    else if (item.status === "paused") { statusText = item.message || "Paused"; iconChar = "II"; }
    else if (item.status === "done") {
      statusText = item.message || "Done";
      iconChar = "&#10003;";
    }
    else {
      statusText = item.errorMsg || "Failed";
      iconChar = "!";
    }
    var byteInfo = "";
    if (item.status === "downloading" && item.totalBytes > 0) {
      byteInfo = '<span>' + formatBytes(item.receivedBytes) + " / " + formatBytes(item.totalBytes) + '</span>';
    }
    var locationHtml = "";
    if (item.saveLocation && item.status !== "queued") {
      locationHtml = '<div class="dl-save-hint">' + esc(item.saveLocation) + '</div>';
    }
    html += '<div class="dl-item ' + item.status + '"><div class="dl-item-status-icon ' + iconClass + '">' + iconChar + '</div><div class="dl-item-info"><div class="dl-item-name">' + esc(item.fileName) + '</div><div class="dl-item-status"><span>' + esc(statusText) + '</span>' + byteInfo + '</div>' + locationHtml + '<div class="dl-progress-wrap"><div class="dl-progress-fill" style="width:' + (item.progress || 0) + '%"></div></div>' + dlActionsHtml(item) + '</div></div>';
  }
  container.innerHTML = html;
  if (libList) libList.innerHTML = html;
  saveQueue();
}

function toggleDownloadPanel() {
  var panel = document.getElementById("downloadPanel");
  panel.classList.toggle("show");
  if (panel.classList.contains("show")) renderDownloadList();
}

function clearCompletedDownloads() {
  downloadQueue.forEach(function(item) { if (item.status === "error" && !item.dmId) idbClear(item.id); });
  downloadQueue = downloadQueue.filter(function(item) { return item.status !== "done" && item.status !== "error"; });
  renderDownloadList(); updateDownloadBadge();
}

// EPISODE BATCH DOWNLOAD
// ================================================================
function toggleEpDownload(globalIdx) {

  else selectedEpDownload[globalIdx] = true;
  renderPlayerEpisodes();
  updateBatchDownloadBar();
}

function selectAllEpisodes() {
  var allSelected = true;
  for (var i = 0; i < allEpisodes.length; i++) { if (!selectedEpDownload[i]) { allSelected = false; break; } }
  if (allSelected) { selectedEpDownload = {}; }
  else { for (var j = 0; j < allEpisodes.length; j++) selectedEpDownload[j] = true; }
  renderPlayerEpisodes(); updateBatchDownloadBar();
}

function getSelectedCount() {
  var count = 0;
  for (var k in selectedEpDownload) { if (selectedEpDownload[k]) count++; }
  return count;
}

function updateBatchDownloadBar() {
  var btn = document.getElementById("batchDlBtn");
  if (btn) { var c = getSelectedCount(); btn.textContent = c > 0 ? "Download Selected (" + c + ")" : "Download Selected"; }
}

function downloadSelectedEpisodes() {
  var count = 0;
  for (var i = 0; i < allEpisodes.length; i++) {
    if (selectedEpDownload[i]) {
      var ep = allEpisodes[i];
      var fname = sanitizeFilename((currentDetail ? currentDetail.name : "Series") + "_S" + String(ep.season).padStart(2, "0") + "E" + String(ep.number).padStart(2, "0")) + ".mp4";
      var directUrl = null;
      if (i === currentEpisodeIndex && currentStreams.length > 0) {
        directUrl = getBestDownloadUrl(currentStreams[currentSelectedStream] || currentStreams[0]);
      }
      var vjName = "";
      if (vjGroups.length > 0 && vjGroups[selectedVJIndex]) vjName = vjGroups[selectedVJIndex].name;
      var added = addToDownloadQueue({ itemId: (currentDetail ? currentDetail.id : "") + ":" + ep.season + ":" + ep.number, type: "episode", seriesId: currentDetail ? currentDetail.id : "", season: ep.season, episode: ep.number, directUrl: directUrl, vjName: vjName }, fname);
      if (added) count++;

  }

  } else { showToast("Select episodes first", "info"); }

function downloadSingleEpisode(globalIdx) {
  if (globalIdx < 0 || globalIdx >= allEpisodes.length) return;
  var ep = allEpisodes[globalIdx];
  var fname = sanitizeFilename((currentDetail ? currentDetail.name : "Series") + "_S" + String(ep.season).padStart(2, "0") + "E" + String(ep.number).padStart(2, "0")) + ".mp4";

  }

  if (vjGroups.length > 0 && vjGroups[selectedVJIndex]) vjName = vjGroups[selectedVJIndex].name;

function downloadCurrent() {
  if (!currentStreams || !currentStreams.length) { showToast("No stream to download", "error"); return; }
  var stream = currentStreams[currentSelectedStream] || currentStreams[0];
  var dlUrl = getBestDownloadUrl(stream);
  if (!dlUrl) {
    showToast("HLS stream - cannot download. Pick MP4 version.", "error");
    return;
  }
  var fname = (currentDetail && currentDetail.name ? currentDetail.name : "video");
  if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length) {
    var ep = allEpisodes[currentEpisodeIndex];
    fname += "_S" + String(ep.season).padStart(2, "0") + "E" + String(ep.number).padStart(2, "0");
  }
  if (vjGroups.length > 0 && vjGroups[selectedVJIndex]) {
    fname += "_" + vjGroups[selectedVJIndex].name;
  }
  fname = sanitizeFilename(fname) + ".mp4";
  var smartApi = "", smartKey = "";
  if (currentDetail) {
    if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length) {
      var sep = allEpisodes[currentEpisodeIndex];
      smartApi = API_BASE + "/stream/series/" + currentDetail.id + ":" + sep.season + ":" + sep.number + ".json";
      smartKey = "ep:" + currentDetail.id + ":" + sep.season + ":" + sep.number;
    } else {

// ================================================================
// FUZZY SEARCH
// ================================================================
function normalizeString(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
}

function levenshtein(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  var matrix = [];
  for (var i = 0; i <= b.length; i++) matrix[i] = [i];
  for (var j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (var i2 = 1; i2 <= b.length; i2++) {
    for (var j2 = 1; j2 <= a.length; j2++) {
      if (b.charAt(i2 - 1) === a.charAt(j2 - 1)) matrix[i2][j2] = matrix[i2 - 1][j2 - 1];
      else matrix[i2][j2] = Math.min(matrix[i2 - 1][j2 - 1] + 1, matrix[i2][j2 - 1] + 1, matrix[i2 - 1][j2] + 1);
    }
  }
  return matrix[b.length][a.length];
}

function fuzzyScore(query, target) {
  if (!query || !target) return 0;
  var nq = normalizeString(query);
  var nt = normalizeString(target);
  if (!nq || !nt) return 0;
  if (nt === nq) return 100;
  if (nt.indexOf(nq) !== -1) return 85;
  if (nq.indexOf(nt) !== -1) return 75;
  var qWords = nq.split(" ").filter(Boolean);
  var tWords = nt.split(" ").filter(Boolean);
  if (!qWords.length || !tWords.length) return 0;
  var matchCount = 0;
  for (var i = 0; i < qWords.length; i++) {
    var qw = qWords[i];
    var bestMatch = 0;
    for (var j = 0; j < tWords.length; j++) {
      var tw = tWords[j];
      if (tw.indexOf(qw) !== -1 || qw.indexOf(tw) !== -1) { bestMatch = 1; break; }
      if (qw.length >= 3 && tw.length >= 3) {
        var dist = levenshtein(qw, tw);
        var maxLen = Math.max(qw.length, tw.length);
        var sim = 1 - (dist / maxLen);
        if (sim > bestMatch && sim > 0.6) bestMatch = sim;
      }
    }
    matchCount += bestMatch;
  }
  var wordScore = (matchCount / qWords.length) * 70;
  var dist2 = levenshtein(nq, nt);
  var maxLen2 = Math.max(nq.length, nt.length);
  var stringScore = maxLen2 > 0 ? (1 - (dist2 / maxLen2)) * 50 : 0;
  return Math.max(wordScore, stringScore);
}

function fuzzySearch(items, query, limit) {
  var results = [];
  items.forEach(function(item) {
    if (!item.name) return;
    var score = fuzzyScore(query, item.name);
    if (score > 25) results.push({ item: item, score: score });
  });
  results.sort(function(a, b) { return b.score - a.score; });
  return results.slice(0, limit || 10).map(function(r) { return r.item; });
}

    } else {

    }
    html += '<div class="suggestion-item" onclick="hideSuggestions();openDetail(\'' + escJs(item.type || "movie") + '\',\'' + escJs(item.id) + '\')"><div class="suggestion-name">' + highlighted + '</div><div class="suggestion-meta">' + esc(item.releaseInfo || "") + '</div></div>';
  });
  html += '<div class="suggestion-all" onclick="onSearchSubmit(\'' + escJs(query) + '\')">View all results for "' + esc(query) + '"</div>';

  container.className = "show";
}

function onSearchSubmit(query) {

// ================================================================
// VJ BAR
// ================================================================
var currentVJFilter = "";
var VJ_STORE = "os_vjs";
var VJ_SEEDS = ["VJ Junior", "VJ Emmy", "VJ Ice P", "VJ Jingo", "VJ Kevo", "VJ Little T"];
var vjTimer = null;

function vjKey(raw) { return String(raw || "").toLowerCase().replace(/^\s*vj[\s.\-_]*/, "").replace(/[^a-z0-9]/g, ""); }
function vjLabel(raw) {
  var t = String(raw || "").trim().replace(/^vj[\s.\-_]*/i, "").trim();
  if (t === t.toLowerCase()) t = t.replace(/\b[a-z]/g, function(c) { return c.toUpperCase(); });
  return "VJ " + t;
}

function getItemVJs(item) {
  var out = [], seen = {};
  function add(raw) {
    raw = String(raw || "").trim();
    var k = vjKey(raw);
    if (!k || seen[k]) return;
    seen[k] = 1;
    out.push({ key: k, name: vjLabel(raw) });
  }
  if (!item) return out;
  if (item.vj) add(item.vj);
  if (Array.isArray(item.vjs)) item.vjs.forEach(function(v) { add(typeof v === "string" ? v : (v && (v.name || v.vj))); });
  var text = (item.name || "") + " " + (item.description || "");
  var re = /\bVJ[\s.\-]?([A-Z][A-Za-z0-9]*(?:\s[A-Z][A-Za-z0-9]?\b)?)/g, m;
  while ((m = re.exec(text)) !== null) add("VJ " + m[1]);
  return out;
}

function itemMatchesVJ(item, key) {
  var v = getItemVJs(item);
  for (var i = 0; i < v.length; i++) { if (v[i].key === key) return true; }
  return false;
}

function loadVJStore() {
  try { var o = JSON.parse(localStorage.getItem(VJ_STORE) || "{}"); return (o && typeof o === "object") ? o : {}; } catch (e) { return {}; }
}

function scheduleVJRefresh() {
  if (vjTimer) return;
  vjTimer = setTimeout(function() { vjTimer = null; refreshVJBar(); }, 400);
}

function refreshVJBar() {
  var store = loadVJStore(), counts = {}, changed = false;
  globalAllItems.forEach(function(item) {
    getItemVJs(item).forEach(function(v) { var c = counts[v.key] || (counts[v.key] = { name: v.name, n: 0 }); c.n++; });
  });
  Object.keys(counts).forEach(function(k) {
    var o = store[k];
    if (!o) { store[k] = { name: counts[k].name, n: counts[k].n }; changed = true; }
    else if (counts[k].n > o.n) { o.n = counts[k].n; changed = true; }
  });
  var keys = Object.keys(store);
  if (keys.length > 60) {
    keys.sort(function(a, b) { return store[b].n - store[a].n; }).slice(60).forEach(function(k) { delete store[k]; });
    changed = true;
  }
  if (changed) { try { localStorage.setItem(VJ_STORE, JSON.stringify(store)); } catch (e) {} }
  renderVJBar(store);
}

function renderVJBar(store) {
  var bar = document.getElementById("vjBar");
  if (!bar) return;
  store = store || loadVJStore();
  var view = {};
  Object.keys(store).forEach(function(k) { view[k] = store[k]; });
  VJ_SEEDS.forEach(function(nm) { var k = vjKey(nm); if (!view[k]) view[k] = { name: nm, n: 0 }; });
  var keys = Object.keys(view).sort(function(a, b) { return (view[b].n - view[a].n) || view[a].name.localeCompare(view[b].name); }).slice(0, 24);
  if (currentVJFilter && keys.indexOf(currentVJFilter) === -1 && view[currentVJFilter]) keys.unshift(currentVJFilter);
  var html = '<button class="vj-chip' + (!currentVJFilter ? ' on' : '') + '" onclick="selectVJ(\'\')"><span class="vj-av">All</span>All VJs</button>';
  keys.forEach(function(k) {
    var nm = view[k].name;
    html += '<button class="vj-chip' + (currentVJFilter === k ? ' on' : '') + '" aria-pressed="' + (currentVJFilter === k) + '" onclick="selectVJ(\'' + escJs(k) + '\')"><span class="vj-av">' + esc(nm.replace(/^VJ\s*/, "").charAt(0).toUpperCase()) + '</span>' + esc(nm) + '</button>';
  });
  var left = bar.scrollLeft;
  bar.innerHTML = html;
  bar.scrollLeft = left;
}

function vjName(key) {
  var store = loadVJStore();
  if (store[key]) return store[key].name;
  for (var i = 0; i < VJ_SEEDS.length; i++) { if (vjKey(VJ_SEEDS[i]) === key) return VJ_SEEDS[i]; }
  return "VJ " + key;
}

function selectVJ(key) {
  currentVJFilter = key || "";
  renderVJBar();
  var sb = document.getElementById("searchBar");
  if (sb) sb.classList.remove("active");
  selectCategory(currentCategoryFilter || "all");
}

function loadVJFiltered(catId) {
  var key = currentVJFilter, name = vjName(key), cat = null;
  if (catId && catId !== "all") { for (var i = 0; i < CATEGORY_TABS.length; i++) { if (CATEGORY_TABS[i].id === catId) { cat = CATEGORY_TABS[i]; break; } } }
  var content = document.getElementById("homeContent");
  content.innerHTML = skelPage();

  function wanted(item) {
    return !cat || itemMatchesCategory(item, cat);
  }
  var local = globalAllItems.filter(function(item) { return itemMatchesVJ(item, key) && wanted(item); });
  var term = encodeURIComponent(name.toLowerCase());
  var calls = [
    fetchJson(PROXY_URL + encodeURIComponent(API_BASE + "/catalog/movie/moviebay-all-movies/search=" + term + ".json"), 1).catch(function() { return { metas: [] }; }),
    fetchJson(PROXY_URL + encodeURIComponent(API_BASE + "/catalog/series/moviebay-all-series/search=" + term + ".json"), 1).catch(function() { return { metas: [] }; })
  ];
  Promise.all(calls).then(function(results) {
    if (currentVJFilter !== key || currentCategoryFilter !== (catId || "all")) return;
    var seen = {}, merged = [];
    function add(m) { if (m && m.id && !seen[m.id]) { seen[m.id] = true; merged.push(m); } }
    local.forEach(add);
    results.forEach(function(r, idx) {
      if (!r || !r.metas) return;
      r.metas.forEach(function(m) {
        if (!m.type) m.type = idx === 0 ? "movie" : "series";
        var vjs = getItemVJs(m);
        var ok = vjs.length ? vjs.some(function(v) { return v.key === key; }) : true;
        if (ok && wanted(m)) add(m);
      });
    });
    renderFilteredGrid(merged, (cat ? cat.name + " \u00b7 " : "") + name);
    var hdr = content.querySelector(".section-header");
    if (hdr) {
      var b = document.createElement("button");
      b.className = "vj-clear"; b.textContent = "Clear VJ"; b.onclick = function() { selectVJ(""); };
      hdr.appendChild(b);
    }
  }).catch(function() { renderFilteredGrid(local, name); });
}

function selectCategory(catId) {
  currentCategoryFilter = catId;
  renderCategoryTabs();
  if (currentVJFilter) { loadVJFiltered(catId); return; }
  if (catId === "all") { resetDedup(); loadHome(); return; }
  var cat = null;
  for (var i = 0; i < CATEGORY_TABS.length; i++) { if (CATEGORY_TABS[i].id === catId) { cat = CATEGORY_TABS[i]; break; } }
  if (!cat) return;
  var content = document.getElementById("homeContent");
  content.innerHTML = skelPage();
  if (cat.typeFilter) loadTypeFiltered(cat);
  else loadGenreFiltered(cat);
}

function loadTypeFiltered(cat) {
  var content = document.getElementById("homeContent");
  var type = cat.typeFilter;
  var localItems = globalAllItems.filter(function(item) { return (item.type || "movie") === type; });
  var catalogId = type === "movie" ? "moviebay-all-movies" : "moviebay-all-series";
  var url = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + type + "/" + catalogId + ".json");
  fetchJson(url).then(function(data) {
    var metas = data && data.metas ? data.metas : [];
    metas.forEach(function(m) { if (!m.type) m.type = type; });
    addToGlobalPool(metas);
    var seenIds = {};
    var merged = [];
    localItems.forEach(function(item) { if (!seenIds[item.id]) { seenIds[item.id] = true; merged.push(item); } });
    metas.forEach(function(m) { if (!seenIds[m.id]) { seenIds[m.id] = true; merged.push(m); } });
    renderFilteredGrid(merged, cat.name);
  }).catch(function() { renderFilteredGrid(localItems, cat.name); });
}

function loadGenreFiltered(cat) {
  var localItems = globalAllItems.filter(function(item) { return itemMatchesCategory(item, cat); });
  var searchTerms = cat.searchTerms || cat.genres || [cat.name.toLowerCase()];
  var allSearchPromises = [];
  searchTerms.forEach(function(term) {
    allSearchPromises.push(fetchJson(PROXY_URL + encodeURIComponent(API_BASE + "/catalog/movie/moviebay-all-movies/search=" + encodeURIComponent(term) + ".json"), 1).catch(function() { return { metas: [] }; }));
    allSearchPromises.push(fetchJson(PROXY_URL + encodeURIComponent(API_BASE + "/catalog/series/moviebay-all-series/search=" + encodeURIComponent(term) + ".json"), 1).catch(function() { return { metas: [] }; }));
  });
  Promise.all(allSearchPromises).then(function(results) {
    var seenIds = {};
    var merged = [];
    localItems.forEach(function(item) { if (!seenIds[item.id]) { seenIds[item.id] = true; merged.push(item); } });
    results.forEach(function(r) {
      if (r && r.metas) r.metas.forEach(function(m) {
        if (!seenIds[m.id]) { seenIds[m.id] = true; if (!m.type) m.type = "movie"; merged.push(m); }
      });
    });
    renderFilteredGrid(merged, cat.name);
  }).catch(function() { renderFilteredGrid(localItems, cat.name); });
}

function getItemGenres(item) {
  if (!item.genres) return [];
  if (Array.isArray(item.genres)) return item.genres.map(function(g) { return String(g).toLowerCase().trim(); });
  return String(item.genres).toLowerCase().split(/[,/]/).map(function(g) { return g.trim(); }).filter(Boolean);
}

function itemMatchesCategory(item, cat) {
  if (cat.typeFilter && (item.type || "movie") !== cat.typeFilter) return false;
  if (!cat.genres && !cat.keywords) return true;
  var genreMatch = false;
  if (cat.genres && cat.genres.length > 0) {
    var itemGenres = getItemGenres(item);
    for (var i = 0; i < cat.genres.length; i++) {
      for (var j = 0; j < itemGenres.length; j++) {
        if (itemGenres[j].indexOf(cat.genres[i]) !== -1 || cat.genres[i].indexOf(itemGenres[j]) !== -1) { genreMatch = true; break; }
      }
      if (genreMatch) break;
    }
  }
  var keywordMatch = false;
  if (cat.keywords && cat.keywords.length > 0) {
    var searchText = ((item.name || "") + " " + (item.description || "")).toLowerCase();
    for (var k = 0; k < cat.keywords.length; k++) {
      if (searchText.indexOf(cat.keywords[k]) !== -1) { keywordMatch = true; break; }
    }
  }
  if (cat.genres && cat.keywords) return genreMatch || keywordMatch;
  if (cat.genres) return genreMatch;
  if (cat.keywords) return keywordMatch;
  return true;
}

  section.appendChild(grid);
  content.appendChild(section);
}

var IMG_FALLBACK = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="#111"/><text x="100" y="155" fill="#444" text-anchor="middle" font-size="14" font-family="sans-serif">No Image</text></svg>');
function imgFail(el, alt) { el.onerror = null; el.src = alt && alt !== el.src ? alt : IMG_FALLBACK; el.onerror = function() { this.onerror = null; this.src = IMG_FALLBACK; }; }
function skelGrid(n) { var h = '<div class="skeleton-grid" aria-hidden="true">'; for (var i = 0; i < n; i++) h += '<div class="skeleton"></div>'; return h + '</div>'; }
function skelPage() { return '<div aria-busy="true" aria-label="Loading"><div class="skeleton skeleton-title"></div>' + skelGrid(12) + '</div>'; }
function createPosterCard(meta) {
  var card = document.createElement("div");
  card.className = "poster-card";
  card.setAttribute("role", "button"); card.tabIndex = 0; card.setAttribute("aria-label", meta.name || "Open title");
  var type = meta.type || "movie";
  card.onclick = function() { openDetail(type, meta.id); };
  var imgWrap = document.createElement("div");
  imgWrap.className = "poster-img-wrap";
  var img = document.createElement("img");
  img.src = meta.poster || "";
  img.alt = meta.name || "";
  img.loading = "lazy"; img.decoding = "async";
  img.onerror = function() { this.onerror = null; this.src = IMG_FALLBACK; };
  imgWrap.appendChild(img);
  var vjName = meta.vj || (meta.vjs && meta.vjs.length ? meta.vjs[0] : "");
  if (vjName) { var badge = document.createElement("div"); badge.className = "poster-badge"; badge.textContent = vjName; imgWrap.appendChild(badge); }
  if (meta.releaseInfo && parseInt(meta.releaseInfo) >= 2025) { var quality = document.createElement("div"); quality.className = "poster-quality"; quality.textContent = "NEW"; imgWrap.appendChild(quality); }
  card.appendChild(imgWrap);
  var name = document.createElement("div"); name.className = "poster-name"; name.textContent = meta.name || "Unknown"; card.appendChild(name);
  var sub = document.createElement("div"); sub.className = "poster-sub";
  var parts = []; if (meta.releaseInfo) parts.push(meta.releaseInfo); if (vjName) parts.push(vjName);
  sub.textContent = parts.join(" | ");
  card.appendChild(sub);
  return card;
}

    currentStreams = data && data.streams ? data.streams : [];
    currentSelectedStream = 0;
    vjGroups = groupStreamsByVJ(currentStreams);
    selectedVJIndex = 0;
    if (vjGroups.length > 0) {
      var best = getBestStreamForVJ(vjGroups[0]);
      if (best) currentSelectedStream = best.globalIndex;

function renderStreamSelector() {

    container.innerHTML = '<div class="empty-state"><p>No streams available</p></div>';

    });

      html += '<div class="sub-section-title">Streams (' + activeGroup.name + ')</div>';

function selectStream(idx) { currentSelectedStream = idx; renderStreamSelector(); }

function selectVJOption(vjIdx) {
  selectedVJIndex = vjIdx;

    var best = getBestStreamForVJ(vjGroups[vjIdx]);

function initEpisodes(videos) {
  allEpisodes = (videos || []).map(function(ep, i) {
    return { id: ep.id || "", season: parseInt(ep.season) || 1, number: parseInt(ep.number) || (i + 1), name: ep.name || ("Episode " + (parseInt(ep.number) || (i + 1))), released: ep.released || "", duration: ep.duration || "" };
  });
  allEpisodes.sort(function(a, b) { if (a.season !== b.season) return a.season - b.season; return a.number - b.number; });
  var seasons = {};
  allEpisodes.forEach(function(ep) { if (!seasons[ep.season]) seasons[ep.season] = []; seasons[ep.season].push(ep); });
  var seasonNums = Object.keys(seasons).map(Number).sort(function(a, b) { return a - b; });
  currentSeason = seasonNums[0] || 1;
  var container = document.getElementById("episodeSection");
  if (!allEpisodes.length) { container.innerHTML = ""; return; }
  var html = '<div class="sub-section-title">Episodes</div>';
  if (seasonNums.length > 1) {
    html += '<div class="season-tabs">';
    seasonNums.forEach(function(s) { html += '<button class="season-tab' + (s === currentSeason ? ' active' : '') + '" data-season="' + s + '" onclick="selectSeason(' + s + ', this)">Season ' + s + '</button>'; });
    html += '</div>';
  }
  html += '<div id="episodeItems"></div>';
  container.innerHTML = html;
  renderEpisodeItems(seasons[currentSeason] || allEpisodes);
}

function selectSeason(seasonNum, btn) {
  seasonNum = parseInt(seasonNum);
  currentSeason = seasonNum;
  var tabs = document.querySelectorAll(".season-tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
    if (parseInt(tabs[i].getAttribute("data-season")) === seasonNum) tabs[i].classList.add("active");
  }
  renderEpisodeItems(allEpisodes.filter(function(ep) { return ep.season === seasonNum; }));
}

function renderEpisodeItems(episodes) {
  var container = document.getElementById("episodeItems");
  if (!container) return;
  container.innerHTML = "";
  episodes.forEach(function(ep) {
    var globalIdx = -1;
    for (var i = 0; i < allEpisodes.length; i++) {
      if (allEpisodes[i].season === ep.season && allEpisodes[i].number === ep.number) { globalIdx = i; break; }
    }
    var item = document.createElement("div");
    item.className = "episode-item" + (globalIdx === currentEpisodeIndex ? " playing" : "");
    item.setAttribute("data-idx", globalIdx);
    item.innerHTML = '<div class="ep-num">' + esc(ep.number) + '</div><div class="ep-info"><div class="ep-name">' + esc(ep.name) + '</div><div class="ep-date">' + esc(ep.released) + (ep.duration ? " | " + esc(ep.duration) : "") + '</div></div><div class="ep-play-icon">' + (globalIdx === currentEpisodeIndex ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>') + '</div>';
    item.onclick = function() {
      var idx = parseInt(this.getAttribute("data-idx"));
      if (idx >= 0) { currentEpisodeIndex = idx; loadEpisodeStream(allEpisodes[idx]); }
    };
    container.appendChild(item);
  });
  if (currentEpisodeIndex >= 0) {
    var playing = container.querySelector(".episode-item.playing");
    if (playing) setTimeout(function() { playing.scrollIntoView({ behavior: "smooth", block: "center" }); }, 200);
  }
}

function loadEpisodeStream(ep) {
  if (!currentDetail) return;
  var epUrl = PROXY_URL + encodeURIComponent(API_BASE + "/stream/series/" + currentDetail.id + ":" + ep.season + ":" + ep.number + ".json");
  showStatus("Loading S" + ep.season + " E" + ep.number + "...");
  fetchJson(epUrl, 2).then(function(data) {
    hideStatus();
    var streams = data && data.streams ? data.streams : [];
    if (streams.length > 0) {
      currentStreams = streams;
      currentSelectedStream = 0;
      vjGroups = groupStreamsByVJ(streams);
      selectedVJIndex = 0;
      if (vjGroups.length > 0) {
        var best = getBestStreamForVJ(vjGroups[0]);
        if (best) currentSelectedStream = best.globalIndex;
      }
      showPlayerPage(streams[currentSelectedStream].url, streams[currentSelectedStream].fallbackUrl, currentDetail.name, "S" + ep.season + " E" + ep.number + " - " + ep.name, streams[currentSelectedStream].subtitle || "");
    } else { showToast("No stream for this episode", "error"); }
  }).catch(function(err) { hideStatus(); showToast("Failed: " + err.message, "error"); });
}

function onDetailPlay() {
  if (!currentStreams || currentStreams.length === 0) { showToast("No streams available", "error"); return; }
  if (allEpisodes.length > 0 && currentEpisodeIndex < 0) {
    currentEpisodeIndex = 0;
    loadEpisodeStream(allEpisodes[0]);
    return;
  }
  var s = currentStreams[currentSelectedStream];
  showPlayerPage(s.url, s.fallbackUrl, currentDetail.name, "", s.subtitle || "");
}

function showPlayerPage(rawUrl, fallbackUrl, title, episodeLabel, subtitle) {
  showPage("playerPage");
  document.getElementById("playerPage").classList.add("active");
  document.getElementById("playerTitle").textContent = title + (episodeLabel ? " - " + episodeLabel : "");
  document.getElementById("playerSub").textContent = subtitle || "";
  var pct = document.getElementById("pcTitle");
  if (pct) pct.textContent = title + (episodeLabel ? " \u00b7 " + episodeLabel : "");
  addToHistory();
  var wlBtn = document.getElementById("playerWlBtn");
  if (wlBtn && currentDetail) wlBtn.textContent = isWatchlisted(currentDetail.id) ? "In My List" : "My List";
  var trBtn = document.getElementById("playerTrailerBtn");
  if (trBtn && currentDetail) trBtn.style.display = (currentDetail.trailers && currentDetail.trailers.length) ? "" : "none";
  renderPlayerVJBar();
  var epTab = document.getElementById("ptabEpisodes");
  if (allEpisodes.length > 0) { epTab.style.display = ""; showPlayerTab("episodes"); }
  else { epTab.style.display = "none"; showPlayerTab("related"); }
  renderPlayerEpisodes();
  loadRelatedContent();
  renderPlayerInfo();
  startPlayback(rawUrl, fallbackUrl);
  startSaveInterval();
  var scrollArea = document.getElementById("playerScrollArea");
  if (scrollArea) scrollArea.scrollTop = 0;
}

function renderPlayerVJBar() {
  var bar = document.getElementById("playerVJBar");
  var chips = document.getElementById("playerVJChips");
  if (!bar || !chips) return;
  if (!vjGroups || vjGroups.length < 2) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  chips.innerHTML = "";
  vjGroups.forEach(function(g, i) {
    var chip = document.createElement("button");
    chip.className = "player-vj-chip" + (i === selectedVJIndex ? " active" : "");
    chip.textContent = g.name;
    chip.onclick = function() { switchPlayerVJ(i); };
    chips.appendChild(chip);
  });
}

function switchPlayerVJ(vjIdx) {
  if (!vjGroups || vjIdx < 0 || vjIdx >= vjGroups.length) return;
  if (vjIdx === selectedVJIndex) return;
  var video = document.getElementById("videoPlayer");
  var currentTime = video.currentTime || 0;
  var wasPlaying = !video.paused;
  selectedVJIndex = vjIdx;
  var best = getBestStreamForVJ(vjGroups[vjIdx]);
  if (!best) return;
  currentSelectedStream = best.globalIndex;
  var stream = best.stream;
  var resolvedUrl = resolveStreamUrl(stream.url || stream.fallbackUrl || "");
  video.pause();
  video.src = resolvedUrl;
  video.load();
  video.addEventListener("loadedmetadata", function onMeta() {
    video.removeEventListener("loadedmetadata", onMeta);
    if (currentTime > 0) video.currentTime = currentTime;
    if (wasPlaying) video.play().catch(function(){});
  });
  renderPlayerVJBar();
  showToast("Switched to: " + vjGroups[vjIdx].name, "success");
}

function showPlayerTab(tabName) {
  var tabs = document.querySelectorAll(".player-tab");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
  var contents = document.querySelectorAll(".player-tab-content");
  for (var j = 0; j < contents.length; j++) contents[j].classList.remove("active");
  if (tabName === "episodes") { document.getElementById("ptabEpisodes").classList.add("active"); document.getElementById("playerTabEpisodes").classList.add("active"); }
  else if (tabName === "related") { document.querySelectorAll(".player-tab")[1].classList.add("active"); document.getElementById("playerTabRelated").classList.add("active"); }
  else if (tabName === "info") { document.querySelectorAll(".player-tab")[2].classList.add("active"); document.getElementById("playerTabInfo").classList.add("active"); }
}

function renderPlayerEpisodes() {
  var container = document.getElementById("playerEpisodeArea");
  if (!container) return;
  if (!allEpisodes.length) { container.innerHTML = '<div class="empty-state"><p>No episodes for this title</p></div>'; return; }
  var seasons = {};
  allEpisodes.forEach(function(ep) { if (!seasons[ep.season]) seasons[ep.season] = []; seasons[ep.season].push(ep); });
  var seasonNums = Object.keys(seasons).map(Number).sort(function(a, b) { return a - b; });
  var html = "";
  html += '<div class="player-ep-actions-bar"><button class="player-ep-select-btn" onclick="selectAllEpisodes()">Select All</button><button class="player-ep-select-btn primary" id="batchDlBtn" onclick="downloadSelectedEpisodes()">Download Selected</button></div>';
  if (seasonNums.length > 1) {
    html += '<div class="season-tabs">';
    seasonNums.forEach(function(s) {
      html += '<button class="season-tab' + (s === currentSeason ? ' active' : '') + '" data-season="' + s + '" onclick="selectPlayerSeason(' + s + ')">Season ' + s + '</button>';
    });
    html += '</div>';
  }
  var eps = seasons[currentSeason] || allEpisodes;
  html += '<div id="playerEpisodeList">';
  eps.forEach(function(ep) {
    var globalIdx = -1;
    for (var i = 0; i < allEpisodes.length; i++) {
      if (allEpisodes[i].season === ep.season && allEpisodes[i].number === ep.number) { globalIdx = i; break; }
    }
    var isPlaying = globalIdx === currentEpisodeIndex;
    var isChecked = !!selectedEpDownload[globalIdx];
    html += '<div class="player-ep-item' + (isPlaying ? ' playing' : '') + '" onclick="playEpisodeFromList(' + globalIdx + ')"><div class="player-ep-check' + (isChecked ? ' checked' : '') + '" onclick="event.stopPropagation();toggleEpDownload(' + globalIdx + ')"></div><div class="player-ep-num">' + esc(ep.number) + '</div><div class="player-ep-info"><div class="player-ep-name">' + esc(ep.name) + '</div><div class="player-ep-date">' + esc(ep.released) + (ep.duration ? " | " + esc(ep.duration) : "") + (isPlaying ? ' <span class="player-ep-now">Now Playing</span>' : '') + '</div></div><button class="player-ep-dl-btn" onclick="event.stopPropagation();downloadSingleEpisode(' + globalIdx + ')" title="Download"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button></div>';
  });
  html += '</div>';
  container.innerHTML = html;
  updateBatchDownloadBar();
}

function selectPlayerSeason(seasonNum) { currentSeason = parseInt(seasonNum); renderPlayerEpisodes(); }

function playEpisodeFromList(globalIdx) {
  if (globalIdx < 0 || globalIdx >= allEpisodes.length) return;
  currentEpisodeIndex = globalIdx;
  var ep = allEpisodes[globalIdx];
  currentSeason = ep.season;
  loadEpisodeStream(ep);
  renderPlayerEpisodes();
}

function loadRelatedContent() {
  if (!currentDetail) return;
  var container = document.getElementById("playerRelatedGrid");
  container.innerHTML = '<div class="skeleton-row"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div></div>';
  var currentGenres = [];
  if (currentDetail.genres) currentGenres = Array.isArray(currentDetail.genres) ? currentDetail.genres : [currentDetail.genres];
  var type = currentDetail.type || "movie";
  var catalogId = type === "movie" ? "moviebay-all-movies" : "moviebay-all-series";
  var url = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + type + "/" + catalogId + ".json");
  fetchJson(url).then(function(data) {
    var items = data && data.metas ? data.metas : [];
    items = items.filter(function(item) { return item.id !== currentDetail.id; });
    if (currentGenres.length > 0) {
      var genreFiltered = items.filter(function(item) {
        if (!item.genres) return false;
        var itemGenres = Array.isArray(item.genres) ? item.genres : [item.genres];
        for (var i = 0; i < currentGenres.length; i++) {
          for (var j = 0; j < itemGenres.length; j++) {
            if (String(itemGenres[j]).toLowerCase() === String(currentGenres[i]).toLowerCase()) return true;
          }
        }
        return false;
      });
      if (genreFiltered.length >= 4) items = genreFiltered;
    }
    items = items.slice(0, 20);
    renderRelatedGrid(items);
  }).catch(function() {
    container.innerHTML = '<div class="empty-state"><p>Could not load related content</p></div>';
  });
}
