<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>OmegaStream</title>
  <style>
    :root {
      --primary: #00DC82;
      --primary-dark: #00B86B;
      --bg: #000000;
      --surface: #0A0A0C;
      --card: #111114;
      --card-hover: #1A1D24;
      --text: #FFFFFF;
      --text-2: rgba(255,255,255,0.7);
      --text-3: rgba(255,255,255,0.4);
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.1);
      --error: #FF4757;
      --warning: #FFA502;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-pill: 28px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100svh;
      scroll-behavior: smooth;
    }
    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; }
    img { -webkit-user-drag: none; user-select: none; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input { outline: none; font-family: inherit; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
    @keyframes progressPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes heroKenBurns {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .animate-fade { animation: fadeIn 0.3s ease; }
    .animate-up { animation: fadeInUp 0.4s ease; }
    .animate-slide { animation: slideInRight 0.3s ease; }

    /* ===== STATUS BAR ===== */
    #statusBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10001;
      background: rgba(0, 220, 130, 0.95);
      color: #000;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 10px 16px;
      transform: translateY(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #statusBar.show { transform: translateY(0); }
    #statusBar.error { background: rgba(220, 50, 50, 0.95); color: #fff; }
    #statusBar.warning { background: rgba(255, 165, 2, 0.95); color: #000; }

    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10002;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 400px;
    }
    .toast {
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.3s ease;
      pointer-events: auto;
    }
    .toast.hiding { animation: toastOut 0.3s ease forwards; }
    .toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .toast-icon.success { background: rgba(0, 220, 130, 0.2); color: var(--primary); }
    .toast-icon.error { background: rgba(255, 71, 87, 0.2); color: var(--error); }
    .toast-icon.info { background: rgba(255, 165, 2, 0.2); color: var(--warning); }

    /* ===== LOADING OVERLAY ===== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
    }
    .loader-logo span { color: var(--text); }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    #loadingOverlay p {
      color: var(--text-3);
      font-size: 13px;
      animation: pulse 1.5s infinite;
    }

    /* ===== HEADER ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .header-logo span { color: var(--text); }
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--glass);
      color: var(--text);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.92); }

    /* ===== SEARCH ===== */
    #searchBar {
      display: none;
      padding: 0 18px 14px;
      background: rgba(0,0,0,0.85);
    }
    #searchBar.active { display: block; animation: fadeIn 0.2s ease; }
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-3);
      font-size: 16px;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 15px;
      transition: border-color 0.2s, background 0.2s;
    }
    #searchInput::placeholder { color: var(--text-3); }
    #searchInput:focus {
      border-color: var(--primary);
      background: rgba(255,255,255,0.08);
    }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 6px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* ===== CATEGORY TABS ===== */
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0;
      padding: 9px 20px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.07);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cat-tab.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 4px 16px rgba(0, 220, 130, 0.3);
    }
    .cat-tab:active { transform: scale(0.95); }

    /* ===== FEATURED HERO ===== */
    .featured-hero {
      position: relative;
      width: 100%;
      height: 440px;
      overflow: hidden;
      border-radius: 0 0 28px 28px;
      cursor: pointer;
    }
    .featured-hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: heroKenBurns 20s ease-in-out infinite alternate;
    }
    .featured-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.2) 40%,
        rgba(0,0,0,0.7) 70%,
        rgba(0,0,0,0.98) 100%
      );
    }
    .featured-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 20px 28px;
    }
    .featured-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .featured-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .featured-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .featured-meta span {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
    }
    .featured-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-3);
    }
    .featured-desc {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 18px;
      max-width: 500px;
    }
    .featured-actions {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      padding: 13px 28px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: #000;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary:active { transform: scale(0.95); opacity: 0.9; }
    .btn-secondary {
      padding: 13px 28px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:active { transform: scale(0.95); background: rgba(255,255,255,0.12); }

    /* ===== SECTIONS ===== */
    .section {
      padding: 12px 0 20px;
      animation: fadeInUp 0.3s ease;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 12px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
    }
    .section-more {
      background: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== POSTER CARDS ===== */
    .poster-scroll {
      display: flex;
      gap: 12px;
      padding: 4px 18px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .poster-scroll::-webkit-scrollbar { display: none; }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 12px;
      padding: 4px 18px 8px;
    }

    .poster-card {
      flex-shrink: 0;
      width: 132px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .poster-card:active { transform: scale(0.94); }
    .poster-grid .poster-card { width: 100%; }
    .poster-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 0.675;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }
    .poster-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .poster-card:hover .poster-img-wrap img { transform: scale(1.05); }
    .poster-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .poster-card:hover .poster-overlay,
    .poster-card:active .poster-overlay { opacity: 1; }
    .poster-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 220, 130, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.25s;
    }
    .poster-card:hover .poster-play-icon,
    .poster-card:active .poster-play-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .poster-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      color: var(--primary);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .poster-quality {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 220, 130, 0.9);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .poster-name {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .poster-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== CONTINUE WATCHING CARD ===== */
    .continue-card {
      flex-shrink: 0;
      width: 180px;
      cursor: pointer;
    }
    .continue-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }
    .continue-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .continue-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--primary);
      border-radius: 0 2px 0 0;
    }
    .continue-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 220, 130, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .continue-info {
      margin-top: 8px;
    }
    .continue-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .continue-ep {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .continue-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: var(--text-2);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
    }
    .skeleton-poster {
      width: 132px;
      height: 190px;
      border-radius: var(--radius);
      flex-shrink: 0;
    }
    .skeleton-hero {
      width: 100%;
      height: 440px;
      border-radius: 0 0 28px 28px;
    }
    .skeleton-row {
      display: flex;
      gap: 12px;
      padding: 4px 18px;
    }

    /* ===== ERROR STATE ===== */
    .error-state {
      text-align: center;
      padding: 32px 20px;
    }
    .error-state .error-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .error-state p {
      color: var(--text-3);
      margin-bottom: 16px;
      font-size: 14px;
    }
    .retry-btn {
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: #000;
      font-size: 14px;
      font-weight: 700;
    }

    /* ===== DETAIL PAGE ===== */
    #detailPage {
      display: none;
      min-height: 100vh;
      min-height: 100svh;
    }
    .detail-hero {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .detail-hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: linear-gradient(transparent, rgba(0,0,0,0.98));
    }
    .detail-top-btns {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .detail-top-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-info {
      padding: 0 20px 32px;
      margin-top: -80px;
      position: relative;
      z-index: 5;
    }
    .detail-logo {
      max-height: 80px;
      max-width: 65%;
      object-fit: contain;
      object-position: left bottom;
      margin-bottom: 14px;
    }
    .detail-title-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-meta-item {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }
    .detail-badge {
      padding: 3px 9px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }
    .detail-imdb {
      background: #F5C518;
      color: #000;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
    }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .detail-tag {
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-2);
    }
    .detail-tag.vj-tag {
      background: rgba(0, 220, 130, 0.1);
      border-color: rgba(0, 220, 130, 0.2);
      color: var(--primary);
    }
    .detail-desc {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-2);
      margin-bottom: 22px;
    }
    .detail-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .detail-actions .btn-primary {
      flex: 1;
      max-width: 260px;
      justify-content: center;
    }
    .action-circle-btn {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .action-circle-btn:active { transform: scale(0.9); }

<script>
// ===================================================================
// CONFIGURATION
// ===================================================================
var WORKER_BASE = "https://moviebay-proxy.milesdaglas.workers.dev";
var PROXY_URL = WORKER_BASE + "?url=";
var VIDEO_PROXY = WORKER_BASE + "/video?url=";
var API_BASE = "https://s-u.in";

var CATALOGS = [
  { id: "moviebay-trending-movies", name: "Trending Movies", type: "movie" },
  { id: "moviebay-latest-movies", name: "Latest Movies", type: "movie" },
  { id: "moviebay-popular-movies", name: "Popular Movies", type: "movie" },
  { id: "moviebay-vj-movies", name: "VJ Movies", type: "movie" },
  { id: "moviebay-all-movies", name: "All Movies", type: "movie" },
  { id: "moviebay-trending-series", name: "Trending Series", type: "series" },
  { id: "moviebay-latest-series", name: "Latest Series", type: "series" },
  { id: "moviebay-popular-series", name: "Popular Series", type: "series" },
  { id: "moviebay-vj-series", name: "VJ Series", type: "series" },
  { id: "moviebay-all-series", name: "All Series", type: "series" }
];

// ===================================================================
// CACHE LAYER
// ===================================================================
var memoryCache = {};

function cacheGet(key) {
  if (memoryCache[key] && memoryCache[key].expiry > Date.now()) return memoryCache[key].data;
  try {
    var s = localStorage.getItem("os_c_" + key);
    if (s) {
      var p = JSON.parse(s);
      if (p && p.expiry > Date.now()) { memoryCache[key] = p; return p.data; }
    }
  } catch(e) {}
  return null;
}

function cacheSet(key, data, ttl) {
  var entry = { data: data, expiry: Date.now() + (ttl || 300000) };
  memoryCache[key] = entry;
  try { localStorage.setItem("os_c_" + key, JSON.stringify(entry)); } catch(e) {}
}

// ===================================================================
// FETCH WITH RETRY
// ===================================================================
function fetchJson(url, retries) {
  retries = retries || 3;
  return new Promise(function(resolve, reject) {
    var cached = cacheGet(url);
    if (cached) { resolve(cached); return; }

    function attempt(remaining, delay) {
      setTimeout(function() {
        fetch(url).then(function(resp) {
          if (resp.status === 429) {
            if (remaining > 0) {
              showStatus("Rate limited - retrying in " + Math.round(delay * 2 / 1000) + "s...", "warning");
              attempt(remaining - 1, delay * 2);
            } else { reject(new Error("Rate limited - try again shortly")); }
            return;
          }
          if (!resp.ok) {
            if (remaining > 0) { attempt(remaining - 1, delay * 2); }
            else { reject(new Error("HTTP " + resp.status)); }
            return;
          }
          return resp.json();
        }).then(function(data) {
          if (data) { cacheSet(url, data, 300000); resolve(data); }
        }).catch(function(err) {
          if (remaining > 0) { attempt(remaining - 1, delay * 2); }
          else { reject(err); }
        });
      }, delay);
    }
    attempt(retries, 1000);
  });
}

// ===================================================================
// STREAM URL RESOLVER
// ===================================================================
function resolveStreamUrl(rawUrl) {
  if (!rawUrl) return rawUrl;
  if (rawUrl.indexOf(".m3u8") !== -1 || rawUrl.indexOf("/stream/hls/") !== -1) return rawUrl;
  if (rawUrl.indexOf("cdn.zflixtv.com") !== -1) return rawUrl;
  if (rawUrl.indexOf(".mp4") !== -1 && rawUrl.indexOf("s-u.in") === -1) return rawUrl;
  if (rawUrl.indexOf("s-u.in") !== -1) return VIDEO_PROXY + encodeURIComponent(rawUrl);
  return rawUrl;
}

// ===================================================================
// STATUS BAR
// ===================================================================
var statusTimer = null;

function showStatus(msg, type) {
  var bar = document.getElementById("statusBar");
  bar.textContent = msg;
  bar.className = "show" + (type === "error" ? " error" : type === "warning" ? " warning" : "");
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(hideStatus, 3500);
}

function hideStatus() {
  document.getElementById("statusBar").className = "";
}

// ===================================================================
// TOAST NOTIFICATIONS
// ===================================================================
function showToast(msg, type) {
  var container = document.getElementById("toastContainer");
  var toast = document.createElement("div");
  toast.className = "toast";
  var iconClass = type === "error" ? "error" : type === "info" ? "info" : "success";
  var iconSymbol = type === "error" ? "!" : type === "info" ? "i" : "OK";
  toast.innerHTML = '<div class="toast-icon ' + iconClass + '">' + iconSymbol + '</div><div>' + msg + '</div>';
  container.appendChild(toast);

  setTimeout(function() {
    toast.classList.add("hiding");
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }, 2800);
}

// ===================================================================
// STATE
// ===================================================================
var currentCategory = CATALOGS[0].id;
var currentType = "movie";
var currentDetail = null;
var currentStreams = [];
var currentSelectedStream = 0;
var allEpisodes = [];
var currentEpisodeIndex = -1;
var currentSeason = 1;
var searchTimeout = null;
var saveInterval = null;

// ===================================================================
// WATCHLIST (localStorage)
// ===================================================================
function getWatchlist() {
  try { return JSON.parse(localStorage.getItem("os_watchlist") || "[]"); } catch(e) { return []; }
}

function saveWatchlist(list) {
  try { localStorage.setItem("os_watchlist", JSON.stringify(list)); } catch(e) {}
}

function isWatchlisted(id) {
  var list = getWatchlist();
  return list.some(function(item) { return item.id === id; });
}

function toggleWatchlist() {
  if (!currentDetail) return;
  var list = getWatchlist();
  var idx = -1;
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === currentDetail.id) { idx = i; break; }
  }

  var btn = document.getElementById("detailWatchlistBtn");

  if (idx >= 0) {
    list.splice(idx, 1);
    btn.innerHTML = "&#9825;";
    btn.classList.remove("watchlist-active");
    showToast("Removed from My List", "info");
  } else {
    list.unshift({
      id: currentDetail.id,
      type: currentDetail.type,
      name: currentDetail.name,
      poster: currentDetail.poster || "",
      vj: currentDetail.vj || "",
      releaseInfo: currentDetail.releaseInfo || ""
    });
    btn.innerHTML = "&#9829;";
    btn.classList.add("watchlist-active");
    showToast("Added to My List", "success");
  }
  saveWatchlist(list);
}

// ===================================================================
// CONTINUE WATCHING (localStorage)
// ===================================================================
function getContinueWatching() {
  try { return JSON.parse(localStorage.getItem("os_continue") || "[]"); } catch(e) { return []; }
}

function saveWatchProgress() {
  var video = document.getElementById("videoPlayer");
  if (!currentDetail || !video || video.duration <= 0) return;

  var epInfo = null;
  if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length) {
    var ep = allEpisodes[currentEpisodeIndex];
    epInfo = "S" + ep.season + " E" + ep.number;
    if (ep.name) epInfo += " - " + ep.name;
  }

  var progress = {
    id: currentDetail.id,
    type: currentDetail.type,
    name: currentDetail.name,
    poster: currentDetail.poster || currentDetail.background || "",
    vj: currentDetail.vj || "",
    episodeInfo: epInfo,
    episodeIndex: currentEpisodeIndex,
    currentTime: video.currentTime,
    duration: video.duration,
    timestamp: Date.now()
  };

  var saved = getContinueWatching();
  saved = saved.filter(function(p) { return p.id !== progress.id; });
  saved.unshift(progress);
  saved = saved.slice(0, 20);
  try { localStorage.setItem("os_continue", JSON.stringify(saved)); } catch(e) {}
}

function removeContinueItem(id, event) {
  if (event) event.stopPropagation();
  var saved = getContinueWatching();
  saved = saved.filter(function(p) { return p.id !== id; });
  try { localStorage.setItem("os_continue", JSON.stringify(saved)); } catch(e) {}
  loadHome();
  showToast("Removed from Continue Watching", "info");
}

function startSaveInterval() {
  if (saveInterval) clearInterval(saveInterval);
  saveInterval = setInterval(function() {
    var video = document.getElementById("videoPlayer");
    if (video && !video.paused && video.duration > 0) saveWatchProgress();
  }, 5000);
}

function stopSaveInterval() {
  if (saveInterval) { clearInterval(saveInterval); saveInterval = null; }
}

// ===================================================================
// DOWNLOAD
// ===================================================================
function downloadCurrent() {
  var stream = null;
  if (currentStreams && currentStreams.length > 0) {
    stream = currentStreams[currentSelectedStream] || currentStreams[0];
  }
  if (!stream) {
    showToast("No stream available to download", "error");
    return;
  }

  var dlUrl = stream.downloadUrl || stream.url;
  if (!dlUrl) {
    showToast("No download URL available", "error");
    return;
  }

  var resolved = resolveStreamUrl(dlUrl);
  showToast("Starting download...", "info");
  window.open(resolved, "_blank");
}

// ===================================================================
// PICTURE IN PICTURE
// ===================================================================
function togglePiP() {
  var video = document.getElementById("videoPlayer");
  if (!video) return;

  if (document.pictureInPictureElement) {
    document.exitPictureInPicture().catch(function() {});
    return;
  }

  if (video.requestPictureInPicture) {
    video.requestPictureInPicture().catch(function(e) {
      showToast("PiP not supported here", "error");
    });
  } else {
    showToast("PiP not supported on this device", "error");
  }
}

// ===================================================================
// TRAILER MODAL
// ===================================================================
function playTrailer() {
  if (!currentDetail || !currentDetail.trailers || currentDetail.trailers.length === 0) {
    showToast("No trailer available", "info");
    return;
  }

  var trailer = currentDetail.trailers[0];
  var videoId = "";

  if (trailer.url) {
    var match = trailer.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    if (match) videoId = match[1];
  } else if (trailer.source) {
    videoId = trailer.source;
  }

  if (!videoId) {
    showToast("Could not parse trailer URL", "error");
    return;
  }

// ===================================================================

function renderCategoryTabs() {

// ===================================================================
// HOME PAGE LOADING (FIXED: proper skeleton management)
// ===================================================================
function loadHome() {
  var content = document.getElementById("homeContent");
  content.innerHTML = "";

  // 1. Featured hero skeleton
  var heroSkel = document.createElement("div");
  heroSkel.id = "featuredHeroSection";
  heroSkel.innerHTML = '<div class="skeleton skeleton-hero"></div>';
  content.appendChild(heroSkel);

  // 2. Continue Watching
  renderContinueWatchingSection();

  // 3. My Watchlist
  renderWatchlistSection();

  // 4. Catalog sections with proper IDs
  var toLoad = CATALOGS.filter(function(c) { return c.type === currentType; });

  toLoad.forEach(function(cat) {
    var section = document.createElement("div");
    section.id = "section_" + cat.id;
    section.className = "section";
    section.innerHTML =
      '<div class="section-header"><div class="section-title">' + cat.name + '</div></div>' +
      '<div class="skeleton-row">' +
        '<div class="skeleton skeleton-poster"></div>' +
        '<div class="skeleton skeleton-poster"></div>' +
        '<div class="skeleton skeleton-poster"></div>' +
        '<div class="skeleton skeleton-poster"></div>' +
      '</div>';
    content.appendChild(section);
  });

  // 5. Fetch featured hero data from first catalog
  if (toLoad.length > 0) {
    var featuredCat = toLoad[0];
    var featuredUrl = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + featuredCat.type + "/" + featuredCat.id + ".json");
    fetchJson(featuredUrl).then(function(data) {
      if (data && data.metas && data.metas.length > 0) {
        renderFeaturedHero(data.metas[0]);
      }
    }).catch(function() {});
  }

  // 6. Fetch all catalog data
  toLoad.forEach(function(cat) {
    var apiUrl = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + cat.type + "/" + cat.id + ".json");
    fetchJson(apiUrl).then(function(data) {
      renderHomeSection(cat, data && data.metas ? data.metas : []);
    }).catch(function(err) {
      renderHomeError(cat, err.message);
    });
  });
}

// ===================================================================
// POSTER CARD
// ===================================================================
function createPosterCard(meta) {
  var card = document.createElement("div");
  card.className = "poster-card";

  var type = meta.type || currentType;
  var id = meta.id;

  card.onclick = function() {
    openDetail(type, id);
  };

  var imgWrap = document.createElement("div");
  imgWrap.className = "poster-img-wrap";

  var img = document.createElement("img");
  img.src = meta.poster || "";
  img.alt = meta.name || "";
  img.loading = "lazy";
  img.onerror = function() {
    this.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" fill="#111"><rect width="200" height="300"/><text x="100" y="155" fill="#333" text-anchor="middle" font-size="14">No Image</text></svg>');
  };
  imgWrap.appendChild(img);

  // Overlay with play icon
  var overlay = document.createElement("div");
  overlay.className = "poster-overlay";
  imgWrap.appendChild(overlay);

  var playIcon = document.createElement("div");
  playIcon.className = "poster-play-icon";
  playIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><polygon points="5,3 19,12 5,21"/></svg>';
  imgWrap.appendChild(playIcon);

  // VJ badge
  var vjName = meta.vj || (meta.vjs && meta.vjs.length ? meta.vjs[0] : "");
  if (vjName) {
    var badge = document.createElement("div");
    badge.className = "poster-badge";
    badge.textContent = vjName;
    imgWrap.appendChild(badge);
  }

  // Quality badge
  if (meta.releaseInfo && parseInt(meta.releaseInfo) >= 2025) {
    var quality = document.createElement("div");
    quality.className = "poster-quality";
    quality.textContent = "NEW";
    imgWrap.appendChild(quality);
  }

  card.appendChild(imgWrap);

  var name = document.createElement("div");
  name.className = "poster-name";
  name.textContent = meta.name || "Unknown";
  card.appendChild(name);

  var sub = document.createElement("div");
  sub.className = "poster-sub";
  var subParts = [];
  if (meta.releaseInfo) subParts.push(meta.releaseInfo);
  if (vjName) subParts.push(vjName);
  sub.textContent = subParts.join(" \u2022 ");
  card.appendChild(sub);

  return card;
}

function toggleSearch() {
  var bar = document.getElementById("searchBar");
  bar.classList.toggle("active");
  if (bar.classList.contains("active")) {
    document.getElementById("searchInput").focus();
  } else {
    document.getElementById("searchInput").value = "";
    loadHome();
  }
}

function onSearch(query) {
  if (searchTimeout) clearTimeout(searchTimeout);
  if (!query || query.length < 2) {
    loadHome();
    return;
  }

  searchTimeout = setTimeout(function() {
    showStatus("Searching...");

    var catalogId = currentType === "movie" ? "moviebay-all-movies" : "moviebay-all-series";
    var searchUrl = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + currentType + "/" + catalogId + "/search=" + encodeURIComponent(query) + ".json");

    fetchJson(searchUrl, 2).then(function(data) {
      hideStatus();
      var metas = data && data.metas ? data.metas : [];
      var content = document.getElementById("homeContent");
      content.innerHTML = "";

      if (metas.length === 0) {
        content.innerHTML = '<div class="empty-state animate-up"><div class="empty-icon">&#128269;</div><h3>No results found</h3><p>Try a different search term</p></div>';
        return;
      }

      var section = document.createElement("div");
      section.className = "section animate-up";
      section.innerHTML = '<div class="section-header"><div class="section-title">Results for "' + query + '" (' + metas.length + ')</div></div>';

      var grid = document.createElement("div");
      grid.className = "poster-grid";
      metas.forEach(function(meta) {
        grid.appendChild(createPosterCard(meta));
      });
      section.appendChild(grid);
      content.appendChild(section);

    }).catch(function(err) {
      hideStatus();
      showToast("Search failed: " + err.message, "error");
    });
  }, 500);
}

// ===================================================================
// DETAIL PAGE
// ===================================================================
function openDetail(type, id) {
  currentType = type;
  showStatus("Loading details...");
  document.getElementById("loadingOverlay").classList.remove("hidden");

  var metaUrl = PROXY_URL + encodeURIComponent(API_BASE + "/meta/" + type + "/" + id + ".json");

  fetchJson(metaUrl).then(function(data) {
    hideStatus();
    document.getElementById("loadingOverlay").classList.add("hidden");

    if (!data || !data.meta) {
      showToast("Details not found", "error");
      return;
    }

    currentDetail = data.meta;
    currentDetail.type = type;
    currentDetail.id = id;
    renderDetail(data.meta);
  }).catch(function(err) {
    hideStatus();
    document.getElementById("loadingOverlay").classList.add("hidden");
    showToast("Failed to load details: " + err.message, "error");
  });
}

function renderDetail(meta) {
  // Hero background
  var bg = meta.background || meta.banner || meta.poster || "";
  var bgImg = document.getElementById("detailBg");
  bgImg.src = bg;
  bgImg.onerror = function() { this.src = meta.poster || ""; };

  // Logo vs title
  var logo = document.getElementById("detailLogo");
  var titleText = document.getElementById("detailTitleText");
  if (meta.logo) {
    logo.src = meta.logo;
    logo.style.display = "";
    titleText.style.display = "none";
  } else {
    logo.style.display = "none";
    titleText.textContent = meta.name || "Unknown";
    titleText.style.display = "";
  }

  // Meta row
  var metaRow = document.getElementById("detailMetaRow");
  metaRow.innerHTML = "";
  if (meta.releaseInfo) {
    metaRow.innerHTML += '<div class="detail-meta-item">' + meta.releaseInfo + '</div>';
  }
  if (meta.runtime) {
    metaRow.innerHTML += '<div class="detail-meta-item">' + meta.runtime + '</div>';
  }
  if (meta.certification) {
    metaRow.innerHTML += '<div class="detail-badge">' + meta.certification + '</div>';
  }
  if (meta.imdbRating) {
    metaRow.innerHTML += '<div class="detail-imdb">IMDb ' + meta.imdbRating + '</div>';
  }

  // Tags
  var tagsDiv = document.getElementById("detailTags");
  tagsDiv.innerHTML = "";
  var genres = meta.genres ? (Array.isArray(meta.genres) ? meta.genres : [meta.genres]) : [];
  genres.forEach(function(g) {
    tagsDiv.innerHTML += '<div class="detail-tag">' + g + '</div>';
  });
  if (meta.vj) {
    tagsDiv.innerHTML += '<div class="detail-tag vj-tag">VJ: ' + meta.vj + '</div>';
  }
  if (meta.isDubbed !== undefined && meta.isDubbed) {
    tagsDiv.innerHTML += '<div class="detail-tag vj-tag">Luganda Dubbed</div>';
  }

  // Description
  document.getElementById("detailDesc").textContent = meta.description || "";

  // Watchlist button state
  var wlBtn = document.getElementById("detailWatchlistBtn");
  if (isWatchlisted(meta.id)) {
    wlBtn.innerHTML = "&#9829;";
    wlBtn.classList.add("watchlist-active");
  } else {
    wlBtn.innerHTML = "&#9825;";
    wlBtn.classList.remove("watchlist-active");
  }

  // Trailer button
  var trailerBtn = document.getElementById("trailerBtn");
  if (meta.trailers && meta.trailers.length > 0) {
    trailerBtn.style.display = "";
  } else {
    trailerBtn.style.display = "none";
  }

  // Reset play button
  document.getElementById("detailPlayBtn").innerHTML =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Play Now';
  document.getElementById("detailPlayBtn").style.display = "";

  // Load streams
  loadStreams(meta.id, meta.type);

  // Load episodes if series
  if (meta.type === "series" && meta.videos && meta.videos.length > 0) {
    initEpisodes(meta.videos);
  } else {
    document.getElementById("episodeSection").innerHTML = "";
    allEpisodes = [];
  }

  // Show detail page
  showPage("detailPage");
}

function loadStreams(id, type) {
  var streamUrl = PROXY_URL + encodeURIComponent(API_BASE + "/stream/" + type + "/" + id + ".json");
  var container = document.getElementById("streamSelector");
  container.innerHTML = '<div class="sub-section-title">Streams</div><div class="skeleton" style="height:60px;margin-bottom:8px"></div><div class="skeleton" style="height:60px"></div>';

  fetchJson(streamUrl).then(function(data) {
    currentStreams = data && data.streams ? data.streams : [];
    currentSelectedStream = 0;
    renderStreamSelector();
  }).catch(function(err) {
    container.innerHTML =
      '<div class="error-state"><p>Failed to load streams: ' + err.message + '</p>' +
      '<button class="retry-btn" onclick="loadStreams(\'' + id + '\',\'' + type + '\')">Retry</button></div>';
  });
}

function renderStreamSelector() {
  var container = document.getElementById("streamSelector");

  if (!currentStreams || currentStreams.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128251;</div><p>No streams available</p></div>';

    return;
  }

    container.innerHTML = "";

  }

    var speedText = stream.isFast ? "Fast" : "Normal";

        '<div class="stream-icon-wrap">' + (stream.isFast ? '&#9889;' : '&#127909;') + '</div>' +
        '<div class="stream-info">' +
          '<div class="stream-name">' + (stream.vj || stream.sourceName || "Stream " + (idx + 1)) + '</div>' +
          '<div class="stream-sub">' + (stream.subtitle || stream.server || "") + '</div>' +
        '</div>' +
        '<div class="stream-speed ' + speedClass + '">' + speedText + '</div>' +
      '</div>';
  });

  container.innerHTML = html;
}

function selectStream(idx) {
  currentSelectedStream = idx;
  renderStreamSelector();
}

// ===================================================================
// EPISODES (FIXED: proper season handling with integer normalization)
// ===================================================================
function initEpisodes(videos) {
  // Normalize all episode data to integers
  allEpisodes = (videos || []).map(function(ep, i) {
    return {
      id: ep.id || "",
      season: parseInt(ep.season) || 1,
      number: parseInt(ep.number) || (i + 1),
      name: ep.name || ("Episode " + (parseInt(ep.number) || (i + 1))),
      released: ep.released || "",
      thumbnail: ep.thumbnail || "",
      description: ep.description || "",
      duration: ep.duration || ""
    };
  });

  // Sort by season then episode number
  allEpisodes.sort(function(a, b) {
    if (a.season !== b.season) return a.season - b.season;
    return a.number - b.number;
  });

  // Group by season
  var seasons = {};
  allEpisodes.forEach(function(ep) {
    if (!seasons[ep.season]) seasons[ep.season] = [];
    seasons[ep.season].push(ep);
  });

  var seasonNums = Object.keys(seasons).map(Number).sort(function(a, b) { return a - b; });
  currentSeason = seasonNums[0] || 1;

  var container = document.getElementById("episodeSection");

  if (allEpisodes.length === 0) {
    container.innerHTML = "";
    return;
  }

  // Build season tabs
  var html = '<div class="sub-section-title">Episodes</div>';

  if (seasonNums.length > 1) {
    html += '<div class="season-tabs">';
    seasonNums.forEach(function(s) {
      html += '<button class="season-tab' + (s === currentSeason ? ' active' : '') + '" onclick="selectSeason(' + s + ', this)">Season ' + s + '</button>';
    });
    html += '</div>';
  }

  html += '<div id="episodeItems"></div>';
  container.innerHTML = html;

  // Render first season episodes
  renderEpisodeItems(seasons[currentSeason] || allEpisodes);
}

function selectSeason(seasonNum, btn) {
  seasonNum = parseInt(seasonNum);
  currentSeason = seasonNum;

  // Update tab active states
  var tabs = document.querySelectorAll(".season-tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
    if (parseInt(tabs[i].textContent.replace("Season ", "")) === seasonNum) {
      tabs[i].classList.add("active");
    }
  }

  // Filter episodes for this season (integer comparison)
  var eps = allEpisodes.filter(function(ep) {
    return ep.season === seasonNum;
  });

  renderEpisodeItems(eps);
}

function renderEpisodeItems(episodes) {
  var container = document.getElementById("episodeItems");
  if (!container) return;
  container.innerHTML = "";

  episodes.forEach(function(ep) {
    // Find global index for proper next/prev navigation
    var globalIdx = -1;
    for (var i = 0; i < allEpisodes.length; i++) {
      if (allEpisodes[i].season === ep.season && allEpisodes[i].number === ep.number) {
        globalIdx = i;
        break;
      }
    }

    var item = document.createElement("div");
    item.className = "episode-item" + (globalIdx === currentEpisodeIndex ? " playing" : "");
    item.setAttribute("data-ep-idx", globalIdx);

    item.innerHTML =
      '<div class="ep-num">' + ep.number + '</div>' +
      '<div class="ep-info">' +
        '<div class="ep-name">' + ep.name + '</div>' +
        '<div class="ep-date">' + ep.released + (ep.duration ? ' | ' + ep.duration : '') + '</div>' +
      '</div>' +
      '<div class="ep-play-icon">' +
        (globalIdx === currentEpisodeIndex
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
          : '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>') +
      '</div>';

    item.onclick = function() {
      var idx = parseInt(this.getAttribute("data-ep-idx"));
      if (idx >= 0) {
        currentEpisodeIndex = idx;
        loadEpisodeStream(allEpisodes[idx]);
      }
    };

    container.appendChild(item);
  });

  // Auto-scroll to current episode
  if (currentEpisodeIndex >= 0) {
    var playingItem = container.querySelector(".episode-item.playing");
    if (playingItem) {
      setTimeout(function() {
        playingItem.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 200);
    }
  }
}

function loadEpisodeStream(ep) {
  if (!currentDetail) return;

  var epUrl = PROXY_URL + encodeURIComponent(
    API_BASE + "/stream/series/" + currentDetail.id + ":" + ep.season + ":" + ep.number + ".json"
  );

  showStatus("Loading S" + ep.season + " E" + ep.number + "...");

  fetchJson(epUrl, 2).then(function(data) {
    hideStatus();
    var streams = data && data.streams ? data.streams : [];
    if (streams.length > 0) {
      currentStreams = streams;
      currentSelectedStream = 0;
      showPlayer(streams[0].url, streams[0].fallbackUrl, currentDetail.name + " - S" + ep.season + " E" + ep.number, streams[0].subtitle || "");
    } else {
      showToast("No stream for this episode", "error");
    }
  }).catch(function(err) {
    hideStatus();
    showToast("Failed to load episode: " + err.message, "error");
  });
}

// ===================================================================
// PLAY ACTIONS
// ===================================================================
function onDetailPlay() {
  if (!currentStreams || currentStreams.length === 0) {
    showToast("No streams available", "error");
    return;
  }

  // If series with episodes, play first episode
  if (allEpisodes.length > 0 && currentEpisodeIndex < 0) {
    currentEpisodeIndex = 0;
    loadEpisodeStream(allEpisodes[0]);
    return;
  }

  var stream = currentStreams[currentSelectedStream];
  showPlayer(stream.url, stream.fallbackUrl, currentDetail.name, stream.subtitle || "");
}

function showPlayer(rawUrl, fallbackUrl, title, subtitle) {
  showPage("playerPage");

  document.getElementById("playerTitle").textContent = title;
  document.getElementById("playerSub").textContent = subtitle || "";

  updateEpisodeNav();
  startPlayback(rawUrl, fallbackUrl);
  startSaveInterval();
}

function updateEpisodeNav() {
  var prevBtn = document.getElementById("prevEpBtn");
  var nextBtn = document.getElementById("nextEpBtn");

  if (currentEpisodeIndex < 0 || allEpisodes.length === 0) {
    prevBtn.style.display = "none";
    nextBtn.style.display = "none";
    return;
  }

  prevBtn.style.display = "";
  nextBtn.style.display = "";
  prevBtn.disabled = currentEpisodeIndex <= 0;
  nextBtn.disabled = currentEpisodeIndex >= allEpisodes.length - 1;
}

function playPrevEpisode() {
  if (currentEpisodeIndex > 0) {
    currentEpisodeIndex--;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
  }
}

function playNextEpisode() {
  if (currentEpisodeIndex < allEpisodes.length - 1) {
    currentEpisodeIndex++;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
  }
}

function backToDetail() {
  saveWatchProgress();
  stopSaveInterval();
  cleanupVideo();

  // Update episode display
  if (allEpisodes.length > 0 && currentEpisodeIndex >= 0) {
    var container = document.getElementById("episodeItems");
    if (container) {
      var eps = allEpisodes.filter(function(ep) { return ep.season === currentSeason; });
      renderEpisodeItems(eps);
    }
  }

  showPage("detailPage");
}

function showHome() {
  saveWatchProgress();
  stopSaveInterval();
  cleanupVideo();
  showPage("homePage");
  loadHome();
}

// ===================================================================
// PAGE NAVIGATION
// ===================================================================
function showPage(pageId) {
  var pages = ["homePage", "detailPage", "playerPage"];
  pages.forEach(function(id) {
    var el = document.getElementById(id);
    if (id === pageId) {
      el.style.display = "block";
      el.classList.add("page-enter");
      setTimeout(function() { el.classList.remove("page-enter"); }, 350);
    } else {
      el.style.display = "none";
    }
  });
  window.scrollTo(0, 0);
}

function cleanupVideo() {
  var video = document.getElementById("videoPlayer");
  if (!video) return;
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();
}

// ===================================================================
// VIDEO PLAYBACK (FIXED: all issues resolved)
// ===================================================================
function startPlayback(rawStreamUrl, fallbackUrl) {
  var video = document.getElementById("videoPlayer");
  var streamUrl = resolveStreamUrl(rawStreamUrl);
  var resolvedFallback = fallbackUrl ? resolveStreamUrl(fallbackUrl) : null;

  console.log("[OmegaStream] Raw:", rawStreamUrl ? rawStreamUrl.substring(0, 80) : "null");
  console.log("[OmegaStream] Resolved:", streamUrl ? streamUrl.substring(0, 80) : "null");

  // Full cleanup
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();

  hideStatus();

  setTimeout(function() {
    video.src = streamUrl;
    video.load();

    var playPromise = video.play();
    if (playPromise) {
      playPromise.catch(function() {
        showStatus("Tap play to start");
      });
    }
  }, 100);

  // Seek stall recovery
  var stallTimer = null;
  var recoverTime = 0;
  var fallbackUsed = false;

  function onSeeking() {
    recoverTime = video.currentTime;
    if (stallTimer) clearTimeout(stallTimer);
    stallTimer = setTimeout(function() {
      if (video.paused || video.readyState < 3) {
        console.log("[OmegaStream] Seek stalled at " + recoverTime + "s, recovering...");
        var t = recoverTime;
        video.pause();
        video.removeAttribute("src");
        video.load();
        setTimeout(function() {
          video.src = streamUrl;
          video.addEventListener("loadedmetadata", function onMeta() {
            video.removeEventListener("loadedmetadata", onMeta);
            video.currentTime = t;
            video.play();
          });
        }, 100);
      }
    }, 4000);
  }

  function onPlaying() {
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
  }

  function onError() {
    var err = video.error;
    var errMsg = "Unknown error";
    if (err) {
      switch(err.code) {
        case 1: errMsg = "Loading aborted"; break;
        case 2: errMsg = "Network error"; break;
        case 3: errMsg = "Decode error"; break;
        case 4: errMsg = "Format not supported"; break;
      }
    }

    if (resolvedFallback && !fallbackUsed && resolvedFallback !== streamUrl) {
      fallbackUsed = true;
      console.log("[OmegaStream] Trying fallback...");
      showStatus("Trying backup stream...");
      video.pause();
      video.removeAttribute("src");
      video.load();
      setTimeout(function() {
        video.src = resolvedFallback;
        video.load();
        video.play().catch(function() {});
      }, 100);
      return;
    }

    showStatus("Error: " + errMsg + " - tap play to retry", "error");
    setTimeout(hideStatus, 5000);
  }

  function onEnded() {
    saveWatchProgress();
    if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length - 1) {
      showStatus("Next episode starting...");
      setTimeout(function() {
        hideStatus();
        playNextEpisode();
      }, 1500);
    }
  }

  video.addEventListener("seeking", onSeeking);
  video.addEventListener("playing", onPlaying);
  video.addEventListener("error", onError);
  video.addEventListener("ended", onEnded);

  video._stallCleanup = function() {
    video.removeEventListener("seeking", onSeeking);
    video.removeEventListener("playing", onPlaying);
    video.removeEventListener("error", onError);
    video.removeEventListener("ended", onEnded);
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    video._stallCleanup = null;
  };
}

// ===================================================================
// START
// ===================================================================
document.addEventListener("DOMContentLoaded", init);
</script>
