// ================================================================
// POSTER CARD
// ================================================================
function createPosterCard(meta) {
  var card = document.createElement("div");
  card.className = "poster-card";
  var type = meta.type || "movie";
  card.onclick = function() { openDetail(type, meta.id); };
  var imgWrap = document.createElement("div");
  imgWrap.className = "poster-img-wrap";
  var img = document.createElement("img");
  img.src = meta.poster || "";
  img.alt = meta.name || "";
  img.loading = "lazy";
  img.onerror = function() { this.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" fill="#111"><rect width="200" height="300"/><text x="100" y="155" fill="#333" text-anchor="middle" font-size="14">No Image</text></svg>'); };
  imgWrap.appendChild(img);
  var vjName = meta.vj || (meta.vjs && meta.vjs.length ? meta.vjs[0] : "");
  if (vjName) { var badge = document.createElement("div"); badge.className = "poster-badge"; badge.textContent = vjName; imgWrap.appendChild(badge); }
  if (meta.releaseInfo && parseInt(meta.releaseInfo) >= 2025) { var quality = document.createElement("div"); quality.className = "poster-quality"; quality.textContent = "NEW"; imgWrap.appendChild(quality); }
  card.appendChild(imgWrap);
  var name = document.createElement("div"); name.className = "poster-name"; name.textContent = meta.name || "Unknown"; card.appendChild(name);
  var sub = document.createElement("div"); sub.className = "poster-sub";
  var parts = []; if (meta.releaseInfo) parts.push(meta.releaseInfo); if (vjName) parts.push(vjName);
  sub.textContent = parts.join(" | ");
  card.appendChild(sub);
  return card;
}

// ================================================================
// DETAIL PAGE
// ================================================================
function openDetail(type, id) {
  showStatus("Loading details...");
  document.getElementById("loadingOverlay").classList.remove("hidden");
  var metaUrl = PROXY_URL + encodeURIComponent(API_BASE + "/meta/" + type + "/" + id + ".json");
  fetchJson(metaUrl).then(function(data) {
    hideStatus();
    document.getElementById("loadingOverlay").classList.add("hidden");
    if (!data || !data.meta) { showToast("Details not found", "error"); return; }
    currentDetail = data.meta;
    currentDetail.type = type;
    currentDetail.id = id;
    vjGroups = [];
    selectedVJIndex = 0;
    renderDetail(data.meta);
  }).catch(function(err) {
    hideStatus();
    document.getElementById("loadingOverlay").classList.add("hidden");
    showToast("Failed to load: " + err.message, "error");
  });
}

function renderDetail(meta) {
  var bg = meta.background || meta.banner || meta.poster || "";
  var bgImg = document.getElementById("detailBg");
  bgImg.src = bg;
  bgImg.onerror = function() { this.src = meta.poster || ""; };
  var logo = document.getElementById("detailLogo");
  var titleText = document.getElementById("detailTitleText");
  if (meta.logo) { logo.src = meta.logo; logo.style.display = ""; titleText.style.display = "none"; }
  else { logo.style.display = "none"; titleText.textContent = meta.name || "Unknown"; titleText.style.display = ""; }
  var metaRow = document.getElementById("detailMetaRow");
  metaRow.innerHTML = "";
  if (meta.releaseInfo) metaRow.innerHTML += '<div class="detail-meta-item">' + meta.releaseInfo + '</div>';
  if (meta.runtime) metaRow.innerHTML += '<div class="detail-meta-item">' + meta.runtime + '</div>';
  if (meta.certification) metaRow.innerHTML += '<div class="detail-badge">' + meta.certification + '</div>';
  if (meta.imdbRating) metaRow.innerHTML += '<div class="detail-imdb">IMDb ' + meta.imdbRating + '</div>';
  var tagsDiv = document.getElementById("detailTags");
  tagsDiv.innerHTML = "";
  var genres = meta.genres ? (Array.isArray(meta.genres) ? meta.genres : [meta.genres]) : [];
  genres.forEach(function(g) { tagsDiv.innerHTML += '<div class="detail-tag">' + g + '</div>'; });
  if (meta.vj) tagsDiv.innerHTML += '<div class="detail-tag vj-tag">VJ: ' + meta.vj + '</div>';
  if (meta.isDubbed) tagsDiv.innerHTML += '<div class="detail-tag vj-tag">Dubbed</div>';
  document.getElementById("detailDesc").textContent = meta.description || "";
  var wlBtn = document.getElementById("detailWatchlistBtn");
  if (isWatchlisted(meta.id)) { wlBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--error)" stroke="var(--error)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>'; wlBtn.classList.add("watchlist-active"); }
  else { wlBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>'; wlBtn.classList.remove("watchlist-active"); }
  var trailerBtn = document.getElementById("trailerBtn");
  trailerBtn.style.display = (meta.trailers && meta.trailers.length) ? "" : "none";
  document.getElementById("detailPlayBtn").style.display = "";
  document.getElementById("detailPlayBtn").innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Play Now';
  loadStreams(meta.id, meta.type);
  if (meta.type === "series" && meta.videos && meta.videos.length > 0) initEpisodes(meta.videos);
  else { document.getElementById("episodeSection").innerHTML = ""; allEpisodes = []; currentEpisodeIndex = -1; }
  showPage("detailPage");
}

function loadStreams(id, type) {
  var streamUrl = PROXY_URL + encodeURIComponent(API_BASE + "/stream/" + type + "/" + id + ".json");
  var container = document.getElementById("streamSelector");
  container.innerHTML = '<div class="sub-section-title">Streams</div><div class="skeleton" style="height:60px;margin-bottom:8px"></div><div class="skeleton" style="height:60px"></div>';
  fetchJson(streamUrl).then(function(data) {
    currentStreams = data && data.streams ? data.streams : [];
    currentSelectedStream = 0;
    vjGroups = groupStreamsByVJ(currentStreams);
    selectedVJIndex = 0;
    if (vjGroups.length > 0) {
      var best = getBestStreamForVJ(vjGroups[0]);
      if (best) currentSelectedStream = best.globalIndex;
    }
    renderStreamSelector();
  }).catch(function(err) {
    container.innerHTML = '<div class="error-state"><p>Failed to load streams: ' + err.message + '</p><button class="retry-btn" onclick="loadStreams(\'' + id + '\',\'' + type + '\')">Retry</button></div>';
  });
}

function renderStreamSelector() {
  var container = document.getElementById("streamSelector");
  if (!currentStreams || currentStreams.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No streams available</p></div>';
    document.getElementById("detailPlayBtn").style.display = "none";
    return;
  }
  if (currentStreams.length === 1) {
    container.innerHTML = "";
    return;
  }

  var html = "";

  if (vjGroups.length > 1) {
    html += '<div class="vj-section-title">Choose VJ / Audio Version</div>';
    html += '<div class="vj-chips">';
    vjGroups.forEach(function(g, i) {
      html += '<button class="vj-chip' + (i === selectedVJIndex ? ' active' : '') + '" onclick="selectVJOption(' + i + ')">' + g.name + '<span class="vj-chip-count">' + g.streams.length + '</span></button>';
    });
    html += '</div>';
  }

  html += '<div class="sub-section-title">Choose Stream</div>';

  if (vjGroups.length > 1) {
    var activeGroup = vjGroups[selectedVJIndex];
    if (activeGroup) {
      activeGroup.streams.forEach(function(s, idx) {
        var globalIdx = activeGroup.globalIndices[idx];
        html += '<div class="stream-option' + (globalIdx === currentSelectedStream ? ' active' : '') + '" onclick="selectStream(' + globalIdx + ')"><div class="stream-icon-wrap">' + (s.isFast ? '&#9889;' : '&#127909;') + '</div><div class="stream-info"><div class="stream-name">' + (s.name || s.sourceName || "Stream " + (globalIdx + 1)) + '</div><div class="stream-sub">' + (s.subtitle || s.server || "") + '</div><div class="vj-label">VJ: ' + activeGroup.name + '</div></div><div class="stream-speed ' + (s.isFast ? "fast" : "normal") + '">' + (s.isFast ? "Fast" : "Normal") + '</div></div>';
      });
    }
  } else {
    currentStreams.forEach(function(s, idx) {
      var vjLabel = extractVJName(s);
      html += '<div class="stream-option' + (idx === currentSelectedStream ? ' active' : '') + '" onclick="selectStream(' + idx + ')"><div class="stream-icon-wrap">' + (s.isFast ? '&#9889;' : '&#127909;') + '</div><div class="stream-info"><div class="stream-name">' + (s.vj || s.sourceName || "Stream " + (idx + 1)) + '</div><div class="stream-sub">' + (s.subtitle || s.server || "") + '</div></div><div class="stream-speed ' + (s.isFast ? "fast" : "normal") + '">' + (s.isFast ? "Fast" : "Normal") + '</div></div>';
    });
  }

  container.innerHTML = html;
}

function selectStream(idx) {
  currentSelectedStream = idx;
  renderStreamSelector();
}

function selectVJOption(vjIdx) {
  selectedVJIndex = vjIdx;
  if (vjGroups[vjIdx]) {
    var best = getBestStreamForVJ(vjGroups[vjIdx]);
    if (best) currentSelectedStream = best.globalIndex;
  }
  renderStreamSelector();
  showToast("Selected: " + (vjGroups[vjIdx] ? vjGroups[vjIdx].name : ""), "success");
}

// ================================================================
// EPISODES (DETAIL PAGE)
// ================================================================
function initEpisodes(videos) {
  allEpisodes = (videos || []).map(function(ep, i) {
    return { id: ep.id || "", season: parseInt(ep.season) || 1, number: parseInt(ep.number) || (i + 1), name: ep.name || ("Episode " + (parseInt(ep.number) || (i + 1))), released: ep.released || "", duration: ep.duration || "" };
  });
  allEpisodes.sort(function(a, b) { if (a.season !== b.season) return a.season - b.season; return a.number - b.number; });
  var seasons = {};
  allEpisodes.forEach(function(ep) { if (!seasons[ep.season]) seasons[ep.season] = []; seasons[ep.season].push(ep); });
  var seasonNums = Object.keys(seasons).map(Number).sort(function(a, b) { return a - b; });
  currentSeason = seasonNums[0] || 1;
  var container = document.getElementById("episodeSection");
  if (!allEpisodes.length) { container.innerHTML = ""; return; }
  var html = '<div class="sub-section-title">Episodes</div>';
  if (seasonNums.length > 1) {
    html += '<div class="season-tabs">';
    seasonNums.forEach(function(s) { html += '<button class="season-tab' + (s === currentSeason ? ' active' : '') + '" data-season="' + s + '" onclick="selectSeason(' + s + ', this)">Season ' + s + '</button>'; });
    html += '</div>';
  }
  html += '<div id="episodeItems"></div>';
  container.innerHTML = html;
  renderEpisodeItems(seasons[currentSeason] || allEpisodes);
}

function selectSeason(seasonNum, btn) {
  seasonNum = parseInt(seasonNum);
  currentSeason = seasonNum;
  var tabs = document.querySelectorAll(".season-tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
    if (parseInt(tabs[i].getAttribute("data-season")) === seasonNum) tabs[i].classList.add("active");
  }
  renderEpisodeItems(allEpisodes.filter(function(ep) { return ep.season === seasonNum; }));
}

function renderEpisodeItems(episodes) {
  var container = document.getElementById("episodeItems");
  if (!container) return;
  container.innerHTML = "";
  episodes.forEach(function(ep) {
    var globalIdx = -1;
    for (var i = 0; i < allEpisodes.length; i++) {
      if (allEpisodes[i].season === ep.season && allEpisodes[i].number === ep.number) { globalIdx = i; break; }
    }
    var item = document.createElement("div");
    item.className = "episode-item" + (globalIdx === currentEpisodeIndex ? " playing" : "");
    item.setAttribute("data-idx", globalIdx);
    item.innerHTML = '<div class="ep-num">' + ep.number + '</div><div class="ep-info"><div class="ep-name">' + ep.name + '</div><div class="ep-date">' + ep.released + (ep.duration ? " | " + ep.duration : "") + '</div></div><div class="ep-play-icon">' + (globalIdx === currentEpisodeIndex ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>') + '</div>';
    item.onclick = function() {
      var idx = parseInt(this.getAttribute("data-idx"));
      if (idx >= 0) { currentEpisodeIndex = idx; loadEpisodeStream(allEpisodes[idx]); }
    };
    container.appendChild(item);
  });
  if (currentEpisodeIndex >= 0) {
    var playing = container.querySelector(".episode-item.playing");
    if (playing) setTimeout(function() { playing.scrollIntoView({ behavior: "smooth", block: "center" }); }, 200);
  }
}

function loadEpisodeStream(ep) {
  if (!currentDetail) return;
  var epUrl = PROXY_URL + encodeURIComponent(API_BASE + "/stream/series/" + currentDetail.id + ":" + ep.season + ":" + ep.number + ".json");
  showStatus("Loading S" + ep.season + " E" + ep.number + "...");
  fetchJson(epUrl, 2).then(function(data) {
    hideStatus();
    var streams = data && data.streams ? data.streams : [];
    if (streams.length > 0) {
      currentStreams = streams;
      currentSelectedStream = 0;
      vjGroups = groupStreamsByVJ(streams);
      selectedVJIndex = 0;
      if (vjGroups.length > 0) {
        var best = getBestStreamForVJ(vjGroups[0]);
        if (best) currentSelectedStream = best.globalIndex;
      }
      showPlayerPage(streams[currentSelectedStream].url, streams[currentSelectedStream].fallbackUrl, currentDetail.name, "S" + ep.season + " E" + ep.number + " - " + ep.name, streams[currentSelectedStream].subtitle || "");
    } else { showToast("No stream for this episode", "error"); }
  }).catch(function(err) { hideStatus(); showToast("Failed: " + err.message, "error"); });
}

function onDetailPlay() {
  if (!currentStreams || currentStreams.length === 0) { showToast("No streams available", "error"); return; }
  if (allEpisodes.length > 0 && currentEpisodeIndex < 0) {
    currentEpisodeIndex = 0;
    loadEpisodeStream(allEpisodes[0]);
    return;
  }
  var s = currentStreams[currentSelectedStream];
  showPlayerPage(s.url, s.fallbackUrl, currentDetail.name, "", s.subtitle || "");
}

// ================================================================
// PLAYER PAGE
// ================================================================
function showPlayerPage(rawUrl, fallbackUrl, title, episodeLabel, subtitle) {
  showPage("playerPage");
  document.getElementById("playerPage").classList.add("active");
  document.getElementById("playerTitle").textContent = title + (episodeLabel ? " - " + episodeLabel : "");
  document.getElementById("playerSub").textContent = subtitle || "";
  var wlBtn = document.getElementById("playerWlBtn");
  if (wlBtn && currentDetail) wlBtn.textContent = isWatchlisted(currentDetail.id) ? "In My List" : "My List";
  var trBtn = document.getElementById("playerTrailerBtn");
  if (trBtn && currentDetail) trBtn.style.display = (currentDetail.trailers && currentDetail.trailers.length) ? "" : "none";
  renderPlayerVJBar();
  var epTab = document.getElementById("ptabEpisodes");
  if (allEpisodes.length > 0) { epTab.style.display = ""; showPlayerTab("episodes"); }
  else { epTab.style.display = "none"; showPlayerTab("related"); }
  renderPlayerEpisodes();
  loadRelatedContent();
  renderPlayerInfo();
  startPlayback(rawUrl, fallbackUrl);
  startSaveInterval();
  var scrollArea = document.getElementById("playerScrollArea");
  if (scrollArea) scrollArea.scrollTop = 0;
}

function renderPlayerVJBar() {
  var bar = document.getElementById("playerVJBar");
  var chips = document.getElementById("playerVJChips");
  if (!bar || !chips) return;
  if (!vjGroups || vjGroups.length < 2) {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "flex";
  chips.innerHTML = "";
  vjGroups.forEach(function(g, i) {
    var chip = document.createElement("button");
    chip.className = "player-vj-chip" + (i === selectedVJIndex ? " active" : "");
    chip.textContent = g.name;
    chip.onclick = function() { switchPlayerVJ(i); };
    chips.appendChild(chip);
  });
}

function switchPlayerVJ(vjIdx) {
  if (!vjGroups || vjIdx < 0 || vjIdx >= vjGroups.length) return;
  if (vjIdx === selectedVJIndex) return;
  var video = document.getElementById("videoPlayer");
  var currentTime = video.currentTime || 0;
  var wasPlaying = !video.paused;
  selectedVJIndex = vjIdx;
  var best = getBestStreamForVJ(vjGroups[vjIdx]);
  if (!best) return;
  currentSelectedStream = best.globalIndex;
  var stream = best.stream;
  var rawUrl = stream.url || stream.fallbackUrl || "";
  var resolvedUrl = resolveStreamUrl(rawUrl);
  video.pause();
  video.src = resolvedUrl;
  video.load();
  video.addEventListener("loadedmetadata", function onMeta() {
    video.removeEventListener("loadedmetadata", onMeta);
    if (currentTime > 0) video.currentTime = currentTime;
    if (wasPlaying) video.play().catch(function(){});
  });
  renderPlayerVJBar();
  showToast("Switched to: " + vjGroups[vjIdx].name, "success");
  if (currentDetail && allEpisodes.length > 0 && currentEpisodeIndex >= 0) {
    var ep = allEpisodes[currentEpisodeIndex];
    if (ep) {
      document.getElementById("playerTitle").textContent = currentDetail.name + " - S" + ep.season + " E" + ep.number;
    }
  }
}

function showPlayerTab(tabName) {
  var tabs = document.querySelectorAll(".player-tab");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
  var contents = document.querySelectorAll(".player-tab-content");
  for (var j = 0; j < contents.length; j++) contents[j].classList.remove("active");
  if (tabName === "episodes") {
    document.getElementById("ptabEpisodes").classList.add("active");
    document.getElementById("playerTabEpisodes").classList.add("active");
  } else if (tabName === "related") {
    document.querySelectorAll(".player-tab")[1].classList.add("active");
    document.getElementById("playerTabRelated").classList.add("active");
  } else if (tabName === "info") {
    document.querySelectorAll(".player-tab")[2].classList.add("active");
    document.getElementById("playerTabInfo").classList.add("active");
  }
}

function renderPlayerEpisodes() {
  var container = document.getElementById("playerEpisodeArea");
  if (!container) return;
  if (!allEpisodes.length) { container.innerHTML = '<div class="empty-state"><p>No episodes for this title</p></div>'; return; }
  var seasons = {};
  allEpisodes.forEach(function(ep) { if (!seasons[ep.season]) seasons[ep.season] = []; seasons[ep.season].push(ep); });
  var seasonNums = Object.keys(seasons).map(Number).sort(function(a, b) { return a - b; });

  var html = "";
  html += '<div class="player-ep-actions-bar"><button class="player-ep-select-btn" onclick="selectAllEpisodes()">Select All</button><button class="player-ep-select-btn primary" id="batchDlBtn" onclick="downloadSelectedEpisodes()">Download Selected</button></div>';

  if (seasonNums.length > 1) {
    html += '<div class="season-tabs">';
    seasonNums.forEach(function(s) {
      html += '<button class="season-tab' + (s === currentSeason ? ' active' : '') + '" data-season="' + s + '" onclick="selectPlayerSeason(' + s + ')">Season ' + s + '</button>';
    });
    html += '</div>';
  }

  var eps = seasons[currentSeason] || allEpisodes;
  html += '<div id="playerEpisodeList">';
  eps.forEach(function(ep) {
    var globalIdx = -1;
    for (var i = 0; i < allEpisodes.length; i++) {
      if (allEpisodes[i].season === ep.season && allEpisodes[i].number === ep.number) { globalIdx = i; break; }
    }
    var isPlaying = globalIdx === currentEpisodeIndex;
    var isChecked = !!selectedEpDownload[globalIdx];
    html += '<div class="player-ep-item' + (isPlaying ? ' playing' : '') + '" onclick="playEpisodeFromList(' + globalIdx + ')"><div class="player-ep-check' + (isChecked ? ' checked' : '') + '" onclick="event.stopPropagation();toggleEpDownload(' + globalIdx + ')"></div><div class="player-ep-num">' + ep.number + '</div><div class="player-ep-info"><div class="player-ep-name">' + ep.name + '</div><div class="player-ep-date">' + ep.released + (ep.duration ? " | " + ep.duration : "") + (isPlaying ? ' <span class="player-ep-now">Now Playing</span>' : '') + '</div></div><button class="player-ep-dl-btn" onclick="event.stopPropagation();downloadSingleEpisode(' + globalIdx + ')" title="Download"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button></div>';
  });
  html += '</div>';
  container.innerHTML = html;
  updateBatchDownloadBar();
}

function selectPlayerSeason(seasonNum) {
  currentSeason = parseInt(seasonNum);
  renderPlayerEpisodes();
}

function playEpisodeFromList(globalIdx) {
  if (globalIdx < 0 || globalIdx >= allEpisodes.length) return;
  currentEpisodeIndex = globalIdx;
  var ep = allEpisodes[globalIdx];
  currentSeason = ep.season;
  loadEpisodeStream(ep);
  renderPlayerEpisodes();
}

function loadRelatedContent() {
  if (!currentDetail) return;
  var container = document.getElementById("playerRelatedGrid");
  container.innerHTML = '<div class="skeleton-row"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-poster"></div></div>';
  var currentGenres = [];
  if (currentDetail.genres) currentGenres = Array.isArray(currentDetail.genres) ? currentDetail.genres : [currentDetail.genres];
  var type = currentDetail.type || "movie";
  var catalogId = type === "movie" ? "moviebay-all-movies" : "moviebay-all-series";
  var url = PROXY_URL + encodeURIComponent(API_BASE + "/catalog/" + type + "/" + catalogId + ".json");
  fetchJson(url).then(function(data) {
    var items = data && data.metas ? data.metas : [];
    items = items.filter(function(item) { return item.id !== currentDetail.id; });
    if (currentGenres.length > 0) {
      var genreFiltered = items.filter(function(item) {
        if (!item.genres) return false;
        var itemGenres = Array.isArray(item.genres) ? item.genres : [item.genres];
        for (var i = 0; i < currentGenres.length; i++) {
          for (var j = 0; j < itemGenres.length; j++) {
            if (String(itemGenres[j]).toLowerCase() === String(currentGenres[i]).toLowerCase()) return true;
          }
        }
        return false;
      });
      if (genreFiltered.length >= 4) items = genreFiltered;
    }
    items = items.slice(0, 20);
    renderRelatedGrid(items);
  }).catch(function() {
    container.innerHTML = '<div class="empty-state"><p>Could not load related content</p></div>';
  });
}

function renderRelatedGrid(items) {
  var container = document.getElementById("playerRelatedGrid");
  if (!items.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#127909;</div><h3>No related titles</h3></div>'; return; }
  container.innerHTML = "";
  var grid = document.createElement("div");
  grid.className = "poster-grid";
  grid.style.padding = "0";
  items.forEach(function(meta) { grid.appendChild(createPosterCard(meta)); });
  container.appendChild(grid);
}

function renderPlayerInfo() {
  var container = document.getElementById("playerInfoContent");
  if (!currentDetail || !container) return;
  var meta = currentDetail;
  var html = '<div style="padding-bottom:20px">';
  if (meta.description) html += '<p style="font-size:14px;line-height:1.7;color:var(--text-2);margin-bottom:16px">' + meta.description + '</p>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">';
  var genres = meta.genres ? (Array.isArray(meta.genres) ? meta.genres : [meta.genres]) : [];
  genres.forEach(function(g) { html += '<div class="detail-tag">' + g + '</div>'; });
  if (meta.vj) html += '<div class="detail-tag vj-tag">VJ: ' + meta.vj + '</div>';
  if (vjGroups && vjGroups.length > 1) {
    vjGroups.forEach(function(g) {
      if (g.name !== meta.vj) html += '<div class="detail-tag vj-tag">Available: ' + g.name + '</div>';
    });
  }
  html += '</div>';
  html += '<div class="detail-meta-row" style="margin-bottom:12px">';
  if (meta.releaseInfo) html += '<div class="detail-meta-item">' + meta.releaseInfo + '</div>';
  if (meta.runtime) html += '<div class="detail-meta-item">' + meta.runtime + '</div>';
  if (meta.imdbRating) html += '<div class="detail-imdb">IMDb ' + meta.imdbRating + '</div>';
  if (meta.certification) html += '<div class="detail-badge">' + meta.certification + '</div>';
  html += '</div>';
  if (meta.cast && meta.cast.length) {
    html += '<div class="sub-section-title" style="margin-top:12px">Cast</div><p style="font-size:13px;color:var(--text-2);line-height:1.6">' + (Array.isArray(meta.cast) ? meta.cast.join(", ") : meta.cast) + '</p>';
  }
  if (meta.director) html += '<div class="sub-section-title" style="margin-top:12px">Director</div><p style="font-size:13px;color:var(--text-2)">' + meta.director + '</p>';
  if (meta.writer) html += '<div class="sub-section-title" style="margin-top:12px">Writer</div><p style="font-size:13px;color:var(--text-2)">' + meta.writer + '</p>';
  html += '</div>';
  container.innerHTML = html;
}

// ================================================================
// PAGE NAVIGATION
// ================================================================
function showPage(pageId) {
  var pages = ["homePage", "detailPage", "playerPage"];
  pages.forEach(function(id) {
    var el = document.getElementById(id);
    if (id === pageId) {
      el.style.display = id === "playerPage" ? "flex" : "block";
      el.classList.add("page-enter");
      setTimeout(function() { el.classList.remove("page-enter"); }, 350);
    } else {
      el.style.display = "none";
      el.classList.remove("active");
    }
  });
  window.scrollTo(0, 0);
}

function cleanupVideo() {
  var video = document.getElementById("videoPlayer");
  if (!video) return;
  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();
}

function backToDetail() {
  saveProgress();
  stopSaveInterval();
  cleanupVideo();
  document.getElementById("playerPage").classList.remove("active");
  document.getElementById("playerVJBar").style.display = "none";
  if (allEpisodes.length > 0 && currentEpisodeIndex >= 0) {
    renderEpisodeItems(allEpisodes.filter(function(ep) { return ep.season === currentSeason; }));
  }
  showPage("detailPage");
}

function showHome() {
  saveProgress();
  stopSaveInterval();
  cleanupVideo();
  document.getElementById("playerPage").classList.remove("active");
  document.getElementById("playerVJBar").style.display = "none";
  showPage("homePage");
  currentCategoryFilter = "all";
  renderCategoryTabs();
  loadHome();
}

// ================================================================
// VIDEO PLAYBACK
// ================================================================
function startPlayback(rawStreamUrl, fallbackUrl) {
  var video = document.getElementById("videoPlayer");
  var streamUrl = resolveStreamUrl(rawStreamUrl);
  var resolvedFallback = fallbackUrl ? resolveStreamUrl(fallbackUrl) : null;

  console.log("[Omega] Raw:", rawStreamUrl ? rawStreamUrl.substring(0, 100) : "null");
  console.log("[Omega] Resolved:", streamUrl ? streamUrl.substring(0, 100) : "null");

  if (video._stallCleanup) video._stallCleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();
  hideStatus();

  setTimeout(function() {
    video.src = streamUrl;
    video.load();
    video.play().catch(function() { showStatus("Tap play to start"); });
  }, 100);

  var stallTimer = null;
  var recoverTime = 0;
  var fallbackUsed = false;

  function onSeeking() {
    recoverTime = video.currentTime;
    if (stallTimer) clearTimeout(stallTimer);
    stallTimer = setTimeout(function() {
      if (video.paused || video.readyState < 3) {
        var t = recoverTime;
        video.pause();
        video.removeAttribute("src");
        video.load();
        setTimeout(function() {
          video.src = streamUrl;
          video.addEventListener("loadedmetadata", function onMeta() {
            video.removeEventListener("loadedmetadata", onMeta);
            video.currentTime = t;
            video.play();
          });
        }, 100);
      }
    }, 4000);
  }

  function onPlaying() { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; } }

  function onError() {
    var err = video.error;
    var errMsg = "Unknown error";
    if (err) {
      switch (err.code) {
        case 1: errMsg = "Loading aborted"; break;
        case 2: errMsg = "Network error"; break;
        case 3: errMsg = "Decode error"; break;
        case 4: errMsg = "Format not supported"; break;
      }
    }
    if (resolvedFallback && !fallbackUsed && resolvedFallback !== streamUrl) {
      fallbackUsed = true;
      showStatus("Trying backup stream...");
      video.pause();
      video.removeAttribute("src");
      video.load();
      setTimeout(function() { video.src = resolvedFallback; video.load(); video.play().catch(function(){}); }, 100);
      return;
    }
    showStatus("Error: " + errMsg + " - tap play to retry", "error");
    setTimeout(hideStatus, 6000);
  }

  function onEnded() {
    saveProgress();
    if (currentEpisodeIndex >= 0 && currentEpisodeIndex < allEpisodes.length - 1) {
      showStatus("Next episode starting...");
      setTimeout(function() { hideStatus(); playNextEpisode(); }, 1500);
    }
  }

  video.addEventListener("seeking", onSeeking);
  video.addEventListener("playing", onPlaying);
  video.addEventListener("error", onError);
  video.addEventListener("ended", onEnded);

  video._stallCleanup = function() {
    video.removeEventListener("seeking", onSeeking);
    video.removeEventListener("playing", onPlaying);
    video.removeEventListener("error", onError);
    video.removeEventListener("ended", onEnded);
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    video._stallCleanup = null;
  };
}

function playPrevEpisode() {
  if (currentEpisodeIndex > 0) {
    currentEpisodeIndex--;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
    renderPlayerEpisodes();
  }
}

function playNextEpisode() {
  if (currentEpisodeIndex < allEpisodes.length - 1) {
    currentEpisodeIndex++;
    var ep = allEpisodes[currentEpisodeIndex];
    currentSeason = ep.season;
    loadEpisodeStream(ep);
    renderPlayerEpisodes();
  }
}

// ================================================================
// INIT
// ================================================================
function init() {
  renderCategoryTabs();
  loadHome();
  renderDownloadList();
  updateDownloadBadge();
  setTimeout(function() { document.getElementById("loadingOverlay").classList.add("hidden"); }, 800);
}

document.addEventListener("DOMContentLoaded", init);
</script>
